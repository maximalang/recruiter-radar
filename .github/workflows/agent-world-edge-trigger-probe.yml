name: Agent World edge trigger probe

on:
  push:
    branches:
      - codex/agent-world-edge-temp
    paths:
      - ops/agent-world-edge-trigger-probe.txt

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Publish probe status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d '{"state":"success","context":"agent-world-edge-trigger-probe","description":"Temporary edge workflow trigger is healthy"}' >/dev/null
