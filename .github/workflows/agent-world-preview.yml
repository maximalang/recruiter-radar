name: Agent World Preview

on:
  push:
    branches: ['temp/agent-world-preview']

permissions:
  contents: read

concurrency:
  group: agent-world-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout preview deployment helper
        uses: actions/checkout@v7

      - name: Checkout exact Agent World revision
        uses: actions/checkout@v7
        with:
          repository: maximalang/site
          ref: 5047968494e7adb5fe1bc914645cd409daa02b6e
          path: agent-world-src
          persist-credentials: false

      - name: Validate deployment helper and revision
        run: |
          set -euo pipefail
          bash -n .github/scripts/deploy-agent-world-preview.sh
          test "$(git -C agent-world-src rev-parse HEAD)" = "5047968494e7adb5fe1bc914645cd409daa02b6e"

      - name: Build immutable Agent World web image
        run: |
          set -euo pipefail
          docker build \
            -f agent-world-src/Dockerfile \
            -t agent-world-preview-web:5047968494e7adb5fe1bc914645cd409daa02b6e \
            agent-world-src
          docker save agent-world-preview-web:5047968494e7adb5fe1bc914645cd409daa02b6e \
            | gzip -1 > /tmp/agent-world-preview-web.tar.gz
          ls -lh /tmp/agent-world-preview-web.tar.gz

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.RR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.RR_SSH_PORT }}" -t ed25519 "${{ secrets.RR_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload isolated preview material
        run: |
          set -euo pipefail
          remote="${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}"
          port="${{ secrets.RR_SSH_PORT }}"
          ssh -p "$port" -o LogLevel=ERROR "$remote" 'install -d -m 0700 /opt/agent-world-preview'
          scp -P "$port" -o LogLevel=ERROR \
            /tmp/agent-world-preview-web.tar.gz \
            "$remote:/opt/agent-world-preview/web-5047968494e7adb5fe1bc914645cd409daa02b6e.tar.gz"
          scp -P "$port" -o LogLevel=ERROR \
            .github/scripts/deploy-agent-world-preview.sh \
            "$remote:/opt/agent-world-preview/deploy.sh"

      - name: Deploy bounded preview beside Recruiter Radar
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.RR_SSH_PORT }}" -o LogLevel=ERROR \
            "${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}" \
            'chmod 700 /opt/agent-world-preview/deploy.sh && /opt/agent-world-preview/deploy.sh 5047968494e7adb5fe1bc914645cd409daa02b6e'

      - name: Verify preview and Recruiter Radar externally
        run: |
          set -euo pipefail
          preview_ok=false
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 15 \
              https://recruiter-radar.ru:8443/api/health/ready \
              > /tmp/agent-world-ready.json; then
              preview_ok=true
              break
            fi
            sleep 5
          done
          if [ "$preview_ok" != true ]; then
            echo 'Agent World preview is healthy locally but public HTTPS:8443 is unreachable.' >&2
            exit 1
          fi
          curl -fsS --max-time 15 https://recruiter-radar.ru/api/health > /tmp/radar-ready.json
          curl -fsSI --max-time 15 https://recruiter-radar.ru:8443/ | head -20
          echo 'PREVIEW_URL=https://recruiter-radar.ru:8443'

      - name: Cleanup runner material
        if: always()
        run: rm -f /tmp/agent-world-preview-web.tar.gz /tmp/agent-world-ready.json /tmp/radar-ready.json
