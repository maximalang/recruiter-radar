name: Apply Evidence Radar Patch

on:
  push:
    branches: [ codex/evidence-radar-system ]
  pull_request:
    branches: [ codex/commercial-signal-engine-phase-11 ]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/evidence-radar-system
          fetch-depth: 0
      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat .evidence-radar-patch.part1 .evidence-radar-patch.part2 .evidence-radar-patch.part3 .evidence-radar-patch.part4 .evidence-radar-patch.part5 | base64 --decode > /tmp/evidence-radar-patch.tar.gz
          echo "b22fc561b2bf1d1545c65bb2c314585ffd858ab675f20e714c3205999aedf06f  /tmp/evidence-radar-patch.tar.gz" | sha256sum --check -
          tar -xzf /tmp/evidence-radar-patch.tar.gz -C .
          # Workflow files are finalized by the connected GitHub writer in the
          # next commit because GITHUB_TOKEN cannot safely author workflow YAML.
          rm .github/workflows/evidence-radar-contracts.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/opportunities apps/web/lib/intelligence apps/web/src/__tests__ packages/db/migrations packages/db/scripts/run-evidence-radar-v1-db-tests.mjs docs
          git diff --cached --check
          if git diff --cached --no-ext-diff | grep -E '(-----BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY-----|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})'; then
            echo "Potential secret found in staged patch."
            exit 1
          fi
          git commit -m "feat: add evidence-first radar system"
          git push origin HEAD:codex/evidence-radar-system
