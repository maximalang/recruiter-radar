name: Apply final Robokassa patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-final-robokassa
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'feat/robokassa-primary-billing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/robokassa-primary-billing
          fetch-depth: 0
      - name: Apply verified final tree
        shell: bash
        run: |
          set -euo pipefail
          for index in 00 01 02 03 04 05 06 07 08 09; do
            test -f ".rrpatch/part${index}" || { echo "Patch incomplete"; exit 0; }
          done
          cat .rrpatch/part{00,01,02,03,04,05,06,07,08,09} | base64 -d | gzip -d > /tmp/robokassa.patch
          echo "3180c09c715c2883126df7ac2bb8328dffb5ab24501d1cd84c27d5dfe7ec76c7  /tmp/robokassa.patch" | sha256sum -c -
          git read-tree --reset -u ed743a5fa55688a39038da7c45d79bd0dea1d5e3
          git apply --index --whitespace=error-all /tmp/robokassa.patch
          rm -rf .rrpatch
          rm -f .github/workflows/apply-robokassa-final.yml
          git add -A
          git config user.name "Recruiter Radar CI"
          git config user.email "support@recruiter-radar.ru"
          git commit -m "feat: complete Robokassa billing, checkout and pricing"
          git push origin HEAD:feat/robokassa-primary-billing
