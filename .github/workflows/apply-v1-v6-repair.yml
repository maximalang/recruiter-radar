name: Apply V1-V6 repair patch

on:
  push:
    branches:
      - chatgpt/full-v1-v6-implementation
    paths:
      - '.github/rr-repair/**'
      - '.github/workflows/apply-v1-v6-repair.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply verified repair patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/rr-repair/patch.b64.part* > /tmp/rrpatch.b64
          base64 -d /tmp/rrpatch.b64 | gzip -dc > /tmp/rrpatch.diff
          echo "8d8e0812a24b8dbf7882770e5458e8553a3009092f2a28639c6fff4a3d9d7c71  /tmp/rrpatch.diff" | sha256sum -c -
          git apply --check /tmp/rrpatch.diff
          git apply /tmp/rrpatch.diff
          rm -rf .github/rr-repair
          rm -f .github/workflows/apply-v1-v6-repair.yml
          rm -f .github/workflows/source-snapshot.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ui): complete V1-V6 migration and CI contracts"
          git push origin HEAD:chatgpt/full-v1-v6-implementation
