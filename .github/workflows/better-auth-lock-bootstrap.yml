name: Better Auth Lock Bootstrap

on:
  push:
    branches: [ 'codex/better-auth-foundation' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: better-auth-lock-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/better-auth-foundation
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Verify lockfile is reproducible
        run: npm ci
      - name: Generate Better Auth SQL for review
        env:
          NODE_ENV: development
          BETTER_AUTH_ENABLED: 'true'
          BETTER_AUTH_MCP_OAUTH_ENABLED: 'true'
          BETTER_AUTH_MCP_DCR_ENABLED: 'false'
          BETTER_AUTH_SECRET: 'ci-only-better-auth-secret-32-characters-minimum'
          BETTER_AUTH_URL: 'http://localhost:3000'
          DATABASE_URL: 'postgres://postgres:postgres@127.0.0.1:5432/test'
        run: npx auth@1.6.25 generate --config apps/web/lib/better-auth/auth.ts --output generated-better-auth.sql --yes
      - uses: actions/upload-artifact@v4
        with:
          name: better-auth-generated-schema
          path: generated-better-auth.sql
          if-no-files-found: error
          retention-days: 1
