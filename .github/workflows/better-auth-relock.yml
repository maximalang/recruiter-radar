name: Better Auth Relock

on:
  push:
    branches: [ 'codex/better-auth-foundation' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: better-auth-relock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relock:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/better-auth-foundation
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Rebuild lockfile without OAuth Provider
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Generate website-only Better Auth SQL for review
        env:
          NODE_ENV: development
          BETTER_AUTH_ENABLED: 'true'
          BETTER_AUTH_SECRET: 'ci-only-better-auth-secret-32-characters-minimum'
          BETTER_AUTH_URL: 'http://localhost:3000'
          DATABASE_URL: 'postgres://postgres:postgres@127.0.0.1:5432/test'
        run: npx auth@1.6.25 generate --config apps/web/lib/better-auth/auth.ts --output generated-better-auth-core.sql --yes
      - name: Ensure OAuth Provider advisory is absent
        shell: bash
        run: |
          if npm ls @better-auth/oauth-provider --all 2>/dev/null | grep -q '@better-auth/oauth-provider'; then
            echo 'Unexpected @better-auth/oauth-provider dependency remains' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: better-auth-core-schema
          path: generated-better-auth-core.sql
          if-no-files-found: error
          retention-days: 1
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build(auth): remove OAuth Provider from lockfile'
          git push origin HEAD:codex/better-auth-foundation
