name: Landing prefetch remediation

on:
  push:
    branches:
      - chatgpt/full-v1-v6-implementation

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/full-v1-v6-implementation
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Disable eager checkout route prefetch from landing
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workspace = Path('apps/web/app/landing/workspace-scene.tsx')
          text = workspace.read_text()
          replacements = [
              (
                  '            href={props.checkoutHref}\n',
                  '            prefetch={false}\n            href={props.checkoutHref}\n',
                  1,
              ),
              (
                  '          href={checkoutHref}\n',
                  '          prefetch={false}\n          href={checkoutHref}\n',
                  1,
              ),
          ]
          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'workspace checkout replacement mismatch: {old!r}: {count} != {expected}')
              text = text.replace(old, new)
          workspace.write_text(text)

          conversion = Path('apps/web/app/landing/conversion-panel.tsx')
          text = conversion.read_text()
          replacements = [
              (
                  '            href={buildCheckoutHref(',
                  '            prefetch={false}\n            href={buildCheckoutHref(',
                  2,
              ),
              (
                  '                  href={buildCheckoutHref(',
                  '                  prefetch={false}\n                  href={buildCheckoutHref(',
                  1,
              ),
          ]
          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'conversion checkout replacement mismatch: {old!r}: {count} != {expected}')
              text = text.replace(old, new)
          conversion.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck application
        run: npm run web:check
      - name: Typecheck tests
        run: npm run test:types --workspace @recruiter-radar/web
      - name: Verify landing source contracts
        run: npm test --workspace @recruiter-radar/web -- --runInBand --runTestsByPath src/__tests__/app/landing-final-production-contract.test.ts src/__tests__/app/landing-runtime-truth-contract.test.ts src/__tests__/app/landing-visual-polish.test.ts
      - name: Commit remediation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/chatgpt-landing-prefetch-remediation.yml
          git add apps/web/app/landing/workspace-scene.tsx apps/web/app/landing/conversion-panel.tsx
          git commit -m 'fix(landing): avoid eager checkout route prefetch'
          git push origin HEAD:chatgpt/full-v1-v6-implementation
