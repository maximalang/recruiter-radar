name: Landing Radar remediation

on:
  push:
    branches:
      - chatgpt/full-v1-v6-implementation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/full-v1-v6-implementation
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Apply browser audit contract
        run: python .github/chatgpt/landing-radar-remediation.py
      - name: Install dependencies
        run: npm ci
      - name: Verify landing source contracts
        run: npm test --workspace @recruiter-radar/web -- --runInBand --runTestsByPath src/__tests__/app/landing-final-production-contract.test.ts src/__tests__/app/landing-visual-polish.test.ts src/__tests__/app/landing-runtime-truth-contract.test.ts src/__tests__/app/home-page-section-intros.test.tsx
      - name: Typecheck application
        run: npm run web:check
      - name: Typecheck tests
        run: npm run test:types --workspace @recruiter-radar/web
      - name: Build application
        env:
          NEXT_PUBLIC_YANDEX_METRIKA_ID: '12345678'
        run: npm run web:build
      - name: Verify Radar scene contract
        run: |
          grep -Fq 'data-theme="inverse"' apps/web/app/landing/radar-scene.tsx
          grep -Fq 'data-radar-semantic-list' apps/web/app/landing/radar-scene.tsx
          grep -Fq '#scene-radar' apps/web/scripts/verify-landing-production.mjs
          grep -Fq 'recency-confidence' apps/web/scripts/verify-landing-production.mjs
          git diff --check
      - name: Commit validated QA contract
        run: |
          rm -f .github/workflows/chatgpt-landing-radar.yml
          rm -f .github/chatgpt/landing-radar-remediation.py
          git config user.name chatgpt-remediation
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'test: cover final landing Radar scene'
          git push origin HEAD:chatgpt/full-v1-v6-implementation
