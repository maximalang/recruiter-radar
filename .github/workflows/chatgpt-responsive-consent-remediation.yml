name: Responsive audit consent remediation

on:
  push:
    branches:
      - chatgpt/full-v1-v6-implementation

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/full-v1-v6-implementation
          fetch-depth: 0
      - name: Patch responsive audit consent handling
        run: node scripts/patch-responsive-consent.cjs
      - name: Validate audit script
        run: node --check scripts/verify-responsive-surfaces.mjs
      - name: Commit remediation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/chatgpt-responsive-consent-remediation.yml scripts/patch-responsive-consent.cjs
          git add scripts/verify-responsive-surfaces.mjs
          git commit -m 'fix(ci): resolve consent before responsive interactions'
          git push origin HEAD:chatgpt/full-v1-v6-implementation
