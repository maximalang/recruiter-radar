name: V1-V6 Exact Head Audit

on:
  push:
    branches:
      - chatgpt/v1-v6-final-audit-f9e36

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f9e36b7b31052700b593089231d7644e5154e91d
          fetch-depth: 0
      - name: Audit exact PR head against V1-V6 cleanup contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          PROD_ROOTS = [Path('apps/web/app'), Path('apps/web/components'), Path('apps/web/lib')]
          TEST_ROOTS = [Path('apps/web/src/__tests__'), Path('packages'), Path('scripts')]
          SUFFIXES = {'.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs', '.css', '.scss', '.md', '.json'}

          legacy_terms = [
              'LeadCard', 'OpportunityCard', 'ScoreGauge', 'ScoreBar', 'ScoreBandChip',
              'SettingsOverview', 'radioCard', 'modeBadge', 'metricCard', 'signalLeadCard',
              'signalLeadSections', 'signalLeadScoreTrack', 'ContentCard',
              'recruiter-radar-v6', 'recruiter-radar-v7', '#9fca63', '#c8f36a', '#c9ec8b',
              'Возможности', 'Дашборд', 'Командный центр', 'Карта спроса', 'Source Registry',
          ]

          def files_under(roots):
              for root in roots:
                  if not root.exists():
                      continue
                  for path in root.rglob('*'):
                      if path.is_file() and path.suffix.lower() in SUFFIXES:
                          yield path

          def read(path):
              try:
                  return path.read_text(encoding='utf-8')
              except Exception:
                  return ''

          prod_files = list(files_under(PROD_ROOTS))
          test_files = list(files_under(TEST_ROOTS))
          report = {
              'production_legacy_hits': [],
              'test_negative_contract_mentions': [],
              'hover_transform_hits': [],
              'infinite_animation_hits': [],
              'forbidden_translate_hits': [],
              'static_article_tabindex_hits': [],
              'lead_detail_container_hits': [],
              'dashboard_account_overview_hits': [],
              'temporary_audit_files': [],
              'radar_contract_errors': [],
          }

          for path in prod_files:
              text = read(path)
              lines = text.splitlines()
              for term in legacy_terms:
                  for idx, line in enumerate(lines, 1):
                      if term.lower() in line.lower():
                          report['production_legacy_hits'].append({
                              'term': term, 'path': str(path), 'line': idx, 'text': line.strip()[:240],
                          })
              for m in re.finditer(r'(?is)([^\{]{0,200}:hover[^\{]*)\{([^\}]*)\}', text):
                  body = m.group(2)
                  tm = re.search(r'transform\s*:\s*([^;]+)', body, re.I)
                  if tm and tm.group(1).strip().lower() not in {'none', 'translatey(0)', 'translatey(0px)'}:
                      report['hover_transform_hits'].append({
                          'path': str(path), 'line': text[:m.start()].count('\n') + 1,
                          'selector': ' '.join(m.group(1).split())[-180:], 'transform': tm.group(1).strip(),
                      })
              for idx, line in enumerate(lines, 1):
                  if re.search(r'\banimation(?:-iteration-count)?\s*:[^;\n]*\binfinite\b', line, re.I):
                      report['infinite_animation_hits'].append({'path': str(path), 'line': idx, 'text': line.strip()[:240]})
                  if 'translateY(-1px)' in line or 'translatey(-1px)' in line.lower():
                      report['forbidden_translate_hits'].append({'path': str(path), 'line': idx, 'text': line.strip()[:240]})
                  if re.search(r'<article\b[^>]*\btabIndex=\{?0\}?', line):
                      report['static_article_tabindex_hits'].append({'path': str(path), 'line': idx, 'text': line.strip()[:240]})
                  if 'leadDetailContainer' in line:
                      report['lead_detail_container_hits'].append({'path': str(path), 'line': idx, 'text': line.strip()[:240]})
                  if 'DashboardAccountOverview' in line:
                      report['dashboard_account_overview_hits'].append({'path': str(path), 'line': idx, 'text': line.strip()[:240]})

          for path in test_files:
              text = read(path)
              for term in legacy_terms:
                  if term.lower() in text.lower():
                      report['test_negative_contract_mentions'].append({'term': term, 'path': str(path)})

          for path in Path('.github/workflows').glob('chatgpt-*.yml'):
              report['temporary_audit_files'].append(str(path))
          if Path('.github/chatgpt').exists():
              for path in Path('.github/chatgpt').rglob('*'):
                  if path.is_file():
                      report['temporary_audit_files'].append(str(path))

          radar_scene = Path('apps/web/app/landing/radar-scene.tsx')
          radar_copy = read(radar_scene) if radar_scene.exists() else ''
          if not radar_scene.exists():
              report['radar_contract_errors'].append('landing Radar scene missing')
          if 'data-radar-spatial-model="recency-confidence"' not in radar_copy:
              report['radar_contract_errors'].append('Radar spatial model is not recency-confidence')
          if 'data-radar-semantic-list' not in radar_copy:
              report['radar_contract_errors'].append('Radar semantic list missing')
          if 'DEMO_COMPANY' not in radar_copy or 'DEMO_EVIDENCE_SOURCES' not in radar_copy:
              report['radar_contract_errors'].append('Radar scene is not tied to shared demo truth')

          print('=== V1-V6 EXACT HEAD AUDIT ===')
          for key, values in report.items():
              print(f'\n## {key}: {len(values)}')
              for item in values[:200]:
                  print(json.dumps(item, ensure_ascii=False))

          hard_fail_keys = [
              'production_legacy_hits', 'hover_transform_hits', 'infinite_animation_hits',
              'forbidden_translate_hits', 'static_article_tabindex_hits',
              'lead_detail_container_hits', 'dashboard_account_overview_hits',
              'temporary_audit_files', 'radar_contract_errors',
          ]
          failures = sum(len(report[key]) for key in hard_fail_keys)
          if failures:
              raise SystemExit(f'V1-V6 exact-head audit failed with {failures} hard violations')
          print('\nV1-V6 exact-head audit: CLEAN')
          PY
