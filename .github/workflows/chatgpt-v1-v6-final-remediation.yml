name: V1-V6 Final Remediation

on:
  push:
    branches:
      - chatgpt/full-v1-v6-implementation

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/full-v1-v6-implementation
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Apply final audited cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_root = Path('apps/web/app')
          refs = []
          for path in app_root.rglob('*'):
              if path.is_file() and path.suffix in {'.ts', '.tsx', '.js', '.jsx'}:
                  text = path.read_text(encoding='utf-8')
                  if 'leadDetailContainer' in text:
                      refs.append(str(path))
          if refs:
              raise SystemExit('leadDetailContainer still has runtime references: ' + ', '.join(refs))

          css_path = Path('apps/web/app/ui/internal-page.module.css')
          css = css_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'/\* Core decision surfaces read as one workspace, not a stack of nested cards\. \*/\n'
              r'\.leadDetailContainer \{[\s\S]*?'
              r'@media \(max-width: 768px\) \{\n'
              r'  \.leadDetailContainer \.detailLayout \{[\s\S]*?'
              r'  \.leadDetailContainer \.detailSidebar \{ margin-top: 4px; \}\n'
              r'\}\n\n',
          )
          css, count = pattern.subn('', css, count=1)
          if count != 1:
              raise SystemExit(f'expected one dead lead-detail decision block, removed {count}')

          standalone_pattern = re.compile(
              r'/\* ── Lead detail layout ── \*/\n'
              r'\.leadDetailContainer \{\n'
              r'  max-width: 960px;\n'
              r'  margin: 0 auto;\n'
              r'\}\n\n'
          )
          css, standalone_count = standalone_pattern.subn('', css, count=1)
          if standalone_count != 1:
              raise SystemExit(f'expected one standalone dead lead-detail rule, removed {standalone_count}')
          if '.leadDetailContainer' in css:
              raise SystemExit('leadDetailContainer still present in stylesheet after cleanup')
          css_path.write_text(css, encoding='utf-8')

          test_path = Path('apps/web/src/__tests__/app/site-finish-contract.test.ts')
          test = test_path.read_text(encoding='utf-8')
          old = '''    expect(internalPage).toContain(".leadDetailContainer .detailMain > .contentCard");\n    expect(internalPage).toContain(".leadDetailContainer .detailSidebar > .contentCard");'''
          new = '''    expect(internalPage).not.toContain(".leadDetailContainer");\n    expect(internalPage).not.toContain(".detailMain > .contentCard");\n    expect(internalPage).not.toContain(".detailSidebar > .contentCard");'''
          if old not in test:
              raise SystemExit('stale site-finish assertions not found')
          test_path.write_text(test.replace(old, new, 1), encoding='utf-8')

          admin_path = Path('apps/web/app/admin/page.tsx')
          admin = admin_path.read_text(encoding='utf-8')
          old_admin = '>дашборде</Link>'
          if old_admin not in admin:
              raise SystemExit('admin dashboard copy target not found')
          admin_path.write_text(admin.replace(old_admin, '>разделе «Сегодня»</Link>', 1), encoding='utf-8')

          delivery_path = Path('apps/web/app/landing/delivery-scene.module.css')
          delivery = delivery_path.read_text(encoding='utf-8')
          delivery = delivery.replace(
              '.channelHierarchy:has(.channelRoute:hover)::before, .channelHierarchy:has(.channelRoute:focus-visible)::before, .channelHierarchy:has(.moreRoutes[open])::before { transform: scaleX(1); }',
              '.channelHierarchy:has(.moreRoutes[open])::before { transform: scaleX(1); }',
          )
          remove_prefixes = (
              '.channelRoute::after ',
              '.channelRoute:hover, .channelRoute:focus-visible ',
              '.channelRoute:hover::after, .channelRoute:focus-visible::after ',
              '.deliveryRoutes:has(.channelRoute:hover) ',
              '.channelRoute:hover .channelIcon, .channelRoute:focus-visible .channelIcon ',
          )
          lines = []
          removed = []
          for line in delivery.splitlines():
              if line.startswith(remove_prefixes):
                  removed.append(line)
                  continue
              if line.startswith('.channelIcon {'):
                  line = line.replace(' transition: background-color .18s ease, transform .18s ease;', '')
              lines.append(line)
          if len(removed) != 5:
              raise SystemExit(f'expected 5 non-interactive delivery hover rules, removed {len(removed)}')
          delivery_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Guard router layout
        run: npm run guard:router
      - name: Type check application
        run: npm run web:check
      - name: Type check tests
        run: npm run test:types --workspace @recruiter-radar/web
      - name: Verify V1-V6 cleanup contracts
        run: npm test --workspace @recruiter-radar/web -- --runInBand src/__tests__/app/v1-v6-visual-contract.test.ts src/__tests__/app/site-finish-contract.test.ts
      - name: Remove temporary audit workflows and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/chatgpt-v1-v6-final-audit.yml .github/workflows/chatgpt-v1-v6-final-remediation.yml
          git add apps/web/app/ui/internal-page.module.css \
                  apps/web/src/__tests__/app/site-finish-contract.test.ts \
                  apps/web/app/admin/page.tsx \
                  apps/web/app/landing/delivery-scene.module.css
          git diff --cached --check
          git commit -m "fix(ui): close final V1-V6 audit defects"
          git push origin HEAD:chatgpt/full-v1-v6-implementation
