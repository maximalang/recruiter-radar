name: ChatGPT V1-V6 landing selector remediation

on:
  push:
    branches:
      - chatgpt/full-v1-v6-implementation

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/full-v1-v6-implementation
          fetch-depth: 0
      - name: Scope landing header QA to the brand header
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('apps/web/scripts/verify-landing-production.mjs')
          text = path.read_text()
          old = '''  await page.locator("#scene-evidence").scrollIntoViewIfNeeded();\n  await page.waitForTimeout(180);\n  assert.match(await page.locator("header a[aria-current='location']").first().innerText(), /Как работает/);\n  assert.equal(await page.locator("header").getAttribute("data-tone"), "dark");\n  await page.locator("#scene-delivery").scrollIntoViewIfNeeded();\n  await page.waitForTimeout(180);\n  assert.equal(await page.locator("header").getAttribute("data-tone"), "light");'''
          new = '''  const brandHeader = page.locator('header[data-brand-header="recruiter-radar"]');\n  await page.locator("#scene-evidence").scrollIntoViewIfNeeded();\n  await page.waitForTimeout(180);\n  assert.match(await brandHeader.locator("a[aria-current='location']").first().innerText(), /Как работает/);\n  assert.equal(await brandHeader.getAttribute("data-tone"), "dark");\n  await page.locator("#scene-delivery").scrollIntoViewIfNeeded();\n  await page.waitForTimeout(180);\n  assert.equal(await brandHeader.getAttribute("data-tone"), "light");'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'landing active navigation selector block mismatch: {count}')
          path.write_text(text.replace(old, new))
          PY
          node --check apps/web/scripts/verify-landing-production.mjs
          grep -Fq 'header[data-brand-header="recruiter-radar"]' apps/web/scripts/verify-landing-production.mjs
      - name: Commit verified landing QA fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/chatgpt-v1-v6-landing-selector.yml
          git config user.name "chatgpt-remediation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: scope landing navigation QA to brand header"
          git push origin HEAD:chatgpt/full-v1-v6-implementation
