name: ChatGPT V1-V6 remediation 3

on:
  push:
    branches:
      - chatgpt/full-v1-v6-implementation

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/full-v1-v6-implementation
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Apply V1-V6 semantic and hierarchy fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              f = Path(path)
              before = f.read_text()
              after = fn(before)
              if after == before:
                  raise SystemExit(f'{path}: edit made no change')
              f.write_text(after)

          def repl(path, old, new, expected=1):
              def apply(text):
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(f'{path}: expected {expected} x {old!r}, found {count}')
                  return text.replace(old, new)
              edit(path, apply)

          def sub(path, pattern, replacement, expected=1, flags=re.S|re.M):
              compiled = re.compile(pattern, flags)
              def apply(text):
                  out, count = compiled.subn(lambda _m: replacement, text, count=expected)
                  if count != expected:
                      raise SystemExit(f'{path}: expected {expected} regex edits for {pattern!r}, found {count}')
                  return out
              edit(path, apply)

          # Semantic test contracts that drifted behind the final V1-V6 UI.
          repl('apps/web/src/__tests__/app/opportunities/opportunity-states.test.tsx', "name: 'Сегодня'", "name: 'Ситуации'", 2)
          repl('apps/web/src/__tests__/app/opportunities/opportunity-funnel.test.tsx', 'Показано 7 раз · 4 возможности', 'Показано 7 раз · 4 ситуации')
          repl('apps/web/src/__tests__/app/onboarding/onboarding-view.test.tsx', 'Как получать новые возможности', 'Как получать новые компании')
          repl('apps/web/src/__tests__/app/leads/ai-enrichment-block.test.tsx', '/AI-подсказка по найму/i', '/ИИ-подсказка по найму/i')
          repl('apps/web/src/__tests__/app/leads/product-route-access.test.tsx', 'Не удалось загрузить возможность', 'Не удалось загрузить компанию')
          repl('apps/web/src/__tests__/app/leads/product-route-access.test.tsx', 'Лид не найден', 'Компания не найдена')
          repl('apps/web/src/__tests__/app/leads/product-route-access.test.tsx', 'Не удалось загрузить профили Radar', 'Не удалось загрузить профили радара')

          # Sources is diagnostics, not primary product IA. Keep only the legacy redirect.
          repl(
              'apps/web/src/__tests__/app/evidence-radar-surface-contract.test.ts',
              "const sourcePage = readFileSync(resolve(opportunitiesRoot, 'sources', 'page.tsx'), 'utf8')",
              "const sourcePage = readFileSync(resolve(process.cwd(), 'app', 'settings', 'diagnostics', 'sources', 'page.tsx'), 'utf8')\n  const legacySourcePage = readFileSync(resolve(opportunitiesRoot, 'sources', 'page.tsx'), 'utf8')",
          )
          repl(
              'apps/web/src/__tests__/app/evidence-radar-surface-contract.test.ts',
              "    expect(navigation).toContain(\"label: 'Диагностика источников'\")",
              "    expect(navigation).not.toContain('Диагностика источников')\n    expect(legacySourcePage).toContain(\"redirect('/settings/diagnostics/sources')\")",
          )

          # Company rows remain scan-first: no per-row accordion and no /100 decoration.
          repl('apps/web/src/__tests__/app/leads/lead-row.test.tsx', 'Сила сигнала 80 из 100', 'Сила сигнала 80', 3)
          sub(
              'apps/web/src/__tests__/app/leads/lead-row.test.tsx',
              r"  it\('keeps primary proof scan-friendly and provenance behind a disclosure', \(\) => \{.*?\n  \}\);\n\n(?=  it\('keeps workflow status subordinate)",
              "  it('keeps primary proof scan-friendly without a per-row evidence accordion', () => {\n    const { container } = render(\n      <LeadRow\n        lead={{ ...baseLead, reasons: ['Карьерная страница обновлена'] } as unknown as LeadItem}\n        fitPreview={{ icon: 'industry', text: 'Совпадает отрасль' }}\n        hiringMode=\"specialist\"\n        rank={2}\n      />,\n    );\n\n    expect(screen.getByText('Hiring burst across 3 roles')).toBeInTheDocument();\n    expect(container.textContent).toContain('4 вакансии · 2 подтвержд.');\n    expect(container.textContent).toContain('1 источник');\n    expect(container.textContent).toContain('Совпадает отрасль');\n    expect(container.querySelector('details')).toBeNull();\n    expect(container.querySelector('[data-legend]')).toBeNull();\n  });\n\n",
          )
          repl('apps/web/src/__tests__/app/leads/lead-row.test.tsx', 'AI-подсказка доступна', 'ИИ-подсказка доступна')
          repl(
              'apps/web/app/leads/leads-page-content.tsx',
              "  const secondarySignals = [\n    lead.isForeignEmployer ? 'зарубежный ATS' : null,\n    fitPreview?.text ?? null,\n  ].filter(Boolean).join(' · ');",
              "  const secondarySignals = [\n    lead.isForeignEmployer ? 'иностранный работодатель' : null,\n    lead.hasAiHint ? 'ИИ-подсказка доступна' : null,\n    fitPreview?.text ?? null,\n  ].filter(Boolean).join(' · ');",
          )
          sub('apps/web/app/leads/leads-workspace.module.css', r"\n\.disclosure\{.*?\n(?=\.emptyWrap\{)", '')
          repl('apps/web/app/leads/leads-workspace.module.css', '.workflow,.disclosure{grid-column:2/-1}', '.workflow{grid-column:2/-1}')
          repl('apps/web/app/leads/leads-workspace.module.css', ' "disclosure disclosure"', '')
          repl('apps/web/app/leads/leads-workspace.module.css', '.disclosure{grid-area:disclosure}', '')
          repl('apps/web/app/leads/leads-workspace.module.css', '.ledger{grid-template-columns:1fr;gap:18px}', '')

          # Cross-route finish contract follows the final semantic company rail.
          repl(
              'apps/web/src/__tests__/app/site-finish-contract.test.ts',
              '    const radar = readAppFile("opportunities/evidence-radar-map.module.css");',
              '    const radar = readAppFile("opportunities/evidence-radar-map.module.css");\n    const leads = readAppFile("leads/leads-workspace.module.css");',
          )
          sub(
              'apps/web/src/__tests__/app/site-finish-contract.test.ts',
              r'^\s*expect\(internalPage\)\.toMatch\(/\\\.signalCardList.*?\);$',
              '    expect(leads).toContain(".list{display:grid}");\n    expect(leads).toMatch(/\\.row\\{[\\s\\S]*?border-bottom:1px solid var\\(--rr-color-separator\\)/);\n    expect(leads).not.toContain(".disclosure");',
          )

          # Landing tests follow the current final composition/copy.
          repl('apps/web/src/__tests__/app/home-page-section-intros.test.tsx', 'expect(html).toContain("Настройте нишу и географию");', 'expect(html).toContain("Настройте нишу");')
          sub(
              'apps/web/src/__tests__/app/home-page-section-intros.test.tsx',
              r'expect\(markup\.match\(/name=[^/]?preview-leads[^/]?/g\)\)\.toHaveLength\(2\);',
              'expect(markup.match(/data-selected-lead-detail/g)).toHaveLength(1);',
          )
          repl('apps/web/src/__tests__/app/home-page-section-intros.test.tsx', 'expect(hero).toContain("Уже есть доступ? Войти");', 'expect(hero).toContain(">Войти</a>");')
          repl('apps/web/src/__tests__/app/landing-visual-polish.test.ts', '760px', '600px')
          repl('apps/web/src/__tests__/app/landing-final-production-contract.test.ts', 'expect(evidence).toContain("Почему сейчас");', 'expect(evidence).toContain("почему сейчас");')
          repl('apps/web/src/__tests__/app/landing-runtime-truth-contract.test.ts', 'expect(evidence).toContain("Почему сейчас");', 'expect(evidence).toContain("почему сейчас");')

          # Company Brief DOM hard gate: Decision -> Evidence -> Action -> secondary context.
          detail = Path('apps/web/app/leads/[id]/page.tsx')
          text = detail.read_text()
          text = text.replace('<section className={styles.decision} aria-label="Решение">', '<section className={styles.decision} aria-label="Решение" data-company-brief-decision>')
          evidence_pattern = re.compile(r"\n            <section className=\{styles\.section\}>\n              <h2>Подтверждения</h2>.*?\n            </section>\n", re.S)
          match = evidence_pattern.search(text)
          if not match:
              raise SystemExit('Company Brief evidence block not found')
          evidence = match.group(0).replace(
              '<section className={styles.section}>',
              '<section className={`${styles.section} ${styles.evidenceSection}`} data-company-brief-evidence>',
              1,
          )
          text = text[:match.start()] + '\n' + text[match.end():]
          marker = '        <div className={styles.layout}>\n'
          if text.count(marker) != 1:
              raise SystemExit('Company Brief layout marker mismatch')
          text = text.replace(marker, marker + evidence.replace('            ', '          ', 1), 1)
          text = text.replace('<div className={styles.main}>', '<div className={styles.main} data-company-brief-context>', 1)
          text = text.replace('<aside className={styles.aside} aria-label="Действия и контекст">', '<aside className={styles.aside} aria-label="Действия и контекст" data-company-brief-action>', 1)
          detail.write_text(text)

          repl(
              'apps/web/app/leads/[id]/lead-brief.module.css',
              '.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,340px);gap:48px;padding-top:36px}.main{min-width:0;max-width:780px;grid-column:1;grid-row:1}',
              '.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,340px);grid-template-areas:"evidence action" "main action";gap:0 48px;padding-top:36px}.evidenceSection{grid-area:evidence;min-width:0;max-width:780px}.main{grid-area:main;min-width:0;max-width:780px}',
          )
          repl(
              'apps/web/app/leads/[id]/lead-brief.module.css',
              '.aside{min-width:0;grid-column:2;grid-row:1}',
              '.aside{grid-area:action;min-width:0}',
          )
          repl(
              'apps/web/app/leads/[id]/lead-brief.module.css',
              '@media(max-width:1000px){.decision{grid-template-columns:1fr;gap:24px}.layout{grid-template-columns:1fr;gap:24px}.main{max-width:none;grid-column:1;grid-row:auto}.aside{grid-column:1;grid-row:auto}.rail{position:static;padding:24px 0 0;border-left:0;border-top:1px solid var(--rr-color-separator)}}',
              '@media(max-width:1000px){.decision{grid-template-columns:1fr;gap:24px}.layout{grid-template-columns:1fr;grid-template-areas:"evidence" "action" "main";gap:24px}.evidenceSection,.main{max-width:none}.rail{position:static;padding:24px 0 0;border-left:0;border-top:1px solid var(--rr-color-separator)}}',
          )
          Path('apps/web/src/__tests__/app/leads/lead-detail-mobile-hierarchy.test.ts').write_text("""import { readFile } from 'node:fs/promises'\nimport { resolve } from 'node:path'\n\nconst pagePath = resolve(process.cwd(), 'app', 'leads', '[id]', 'page.tsx')\nconst stylesPath = resolve(process.cwd(), 'app', 'leads', '[id]', 'lead-brief.module.css')\n\ndescribe('company brief mobile hierarchy', () => {\n  it('keeps Decision -> Evidence -> Action before secondary context in DOM order', async () => {\n    const page = await readFile(pagePath, 'utf8')\n    const orderedAnchors = [\n      'data-company-brief-decision',\n      'data-company-brief-evidence',\n      'data-company-brief-action',\n      'data-company-brief-context',\n    ]\n\n    let previous = -1\n    for (const anchor of orderedAnchors) {\n      const current = page.indexOf(anchor)\n      expect(current).toBeGreaterThan(previous)\n      previous = current\n    }\n    expect(page.match(/<NextStepsBlock/g)).toHaveLength(1)\n  })\n\n  it('uses semantic grid areas rather than CSS order to preserve mobile meaning', async () => {\n    const styles = await readFile(stylesPath, 'utf8')\n    expect(styles).toContain('grid-template-areas:\"evidence action\" \"main action\"')\n    expect(styles).toContain('grid-template-areas:\"evidence\" \"action\" \"main\"')\n    expect(styles).not.toMatch(/(?:^|[;{])\\s*order\\s*:/)\n  })\n})\n""")

          # Auth production acceptance must test the final semantic company row/detail, not removed accordions.
          sub(
              'packages/db/scripts/run-auth-v2-account-team-e2e.mjs',
              r"  const leadDisclosure = page\.locator\('details\[data-motion-disclosure\]'\)\.first\(\)\n  await leadDisclosure\.waitFor\(\{ state: 'visible' \}\)\n  await leadDisclosure\.locator\('summary'\)\.click\(\)\n  assert\(\n    await leadDisclosure\.getAttribute\('open'\) === '',\n    'Authenticated lead disclosure did not open\.',\n  \)\n",
              "  const leadRows = page.locator('article[data-lead-row=\"true\"]')\n  await leadRows.first().waitFor({ state: 'visible' })\n  assert(await leadRows.count() >= 1, 'Authenticated company rows are missing.')\n  assert(\n    await leadRows.first().locator('details').count() === 0,\n    'Company rows must stay scan-first without per-row evidence accordions.',\n  )\n",
          )
          sub(
              'packages/db/scripts/run-auth-v2-account-team-e2e.mjs',
              r"  assert\(\n    await page\.locator\('\[data-motion-disclosure\]'\)\.count\(\) >= 1,\n    'Authenticated lead detail disclosure is missing\.',\n  \)\n",
              "  const companyBriefOrder = await page.evaluate(() => {\n    const decision = document.querySelector('[data-company-brief-decision]')\n    const evidence = document.querySelector('[data-company-brief-evidence]')\n    const action = document.querySelector('[data-company-brief-action]')\n    if (!decision || !evidence || !action) return false\n    return Boolean(\n      decision.compareDocumentPosition(evidence) & Node.DOCUMENT_POSITION_FOLLOWING\n      && evidence.compareDocumentPosition(action) & Node.DOCUMENT_POSITION_FOLLOWING\n    )\n  })\n  assert(companyBriefOrder, 'Company Brief must keep Decision -> Evidence -> Action in DOM order.')\n",
          )
          repl('packages/db/scripts/run-auth-v2-account-team-e2e.mjs', 'filterDisclosureStatusInteractions: true,', 'filterAndDecisionFlowInteractions: true,')

          # Exact responsive hard-gate matrices.
          responsive = Path('scripts/verify-responsive-surfaces.mjs')
          rtext = responsive.read_text()
          rtext = re.sub(
              r"const viewports = \[.*?\n\];",
              """const viewports = [\n  { name: 'mobile-320', width: 320, height: 568 },\n  { name: 'mobile-360', width: 360, height: 800 },\n  { name: 'mobile-375', width: 375, height: 812 },\n  { name: 'mobile-390', width: 390, height: 844 },\n  { name: 'mobile-430', width: 430, height: 932 },\n  { name: 'tablet-768', width: 768, height: 1024 },\n  { name: 'tablet-1024', width: 1024, height: 768 },\n  { name: 'desktop-1280', width: 1280, height: 800 },\n  { name: 'desktop-1366', width: 1366, height: 768 },\n  { name: 'desktop-1440', width: 1440, height: 900 },\n  { name: 'desktop-1536', width: 1536, height: 960 },\n  { name: 'desktop-1920', width: 1920, height: 1080 },\n];""",
              rtext,
              count=1,
              flags=re.S,
          )
          responsive.write_text(rtext)

          landing_audit = Path('apps/web/scripts/verify-landing-production.mjs')
          ltext = landing_audit.read_text()
          ltext = re.sub(
              r"const viewportMatrix = \[.*?\n\];",
              """const viewportMatrix = [\n  { width: 1920, height: 1080, name: \"desktop-1920x1080\" },\n  { width: 1536, height: 960, name: \"desktop-1536x960\" },\n  { width: 1440, height: 900, name: \"desktop-1440x900\" },\n  { width: 1366, height: 768, name: \"desktop-1366x768\" },\n  { width: 1280, height: 800, name: \"desktop-1280x800\" },\n  { width: 1024, height: 768, name: \"tablet-1024x768\" },\n  { width: 768, height: 1024, name: \"tablet-768x1024\" },\n  { width: 430, height: 932, name: \"mobile-430x932\" },\n  { width: 390, height: 844, name: \"mobile-390x844\" },\n  { width: 375, height: 812, name: \"mobile-375x812\" },\n  { width: 360, height: 800, name: \"mobile-360x800\" },\n  { width: 320, height: 568, name: \"mobile-320x568\" },\n];""",
              ltext,
              count=1,
              flags=re.S,
          )
          ltext = ltext.replace('page.getByRole("link", { name: "Уже есть доступ? Войти" })', 'page.getByRole("link", { name: "Войти", exact: true })')
          landing_audit.write_text(ltext)
          repl('apps/web/src/__tests__/app/landing-visual-polish.test.ts', 'name: "mobile-320x700"', 'name: "mobile-320x568"')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify targeted semantic contracts
        run: >-
          npm test --workspace @recruiter-radar/web -- --runInBand --runTestsByPath
          src/__tests__/app/home-page-section-intros.test.tsx
          src/__tests__/app/landing-visual-polish.test.ts
          src/__tests__/app/landing-final-production-contract.test.ts
          src/__tests__/app/landing-runtime-truth-contract.test.ts
          src/__tests__/app/leads/product-route-access.test.tsx
          src/__tests__/app/evidence-radar-surface-contract.test.ts
          src/__tests__/app/leads/lead-row.test.tsx
          src/__tests__/app/leads/lead-detail-mobile-hierarchy.test.ts
          src/__tests__/app/site-finish-contract.test.ts
          src/__tests__/app/onboarding/onboarding-view.test.tsx
          src/__tests__/app/leads/ai-enrichment-block.test.tsx
          src/__tests__/app/opportunities/opportunity-funnel.test.tsx
          src/__tests__/app/opportunities/opportunity-states.test.tsx
      - name: Typecheck web
        run: npm run typecheck --workspace @recruiter-radar/web
      - name: Lint web
        run: npm run lint --workspace @recruiter-radar/web
      - name: Commit verified fixes and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/chatgpt-v1-v6-remediation.yml .github/workflows/chatgpt-v1-v6-remediation-2.yml .github/workflows/chatgpt-v1-v6-remediation-3.yml
          git config user.name "chatgpt-remediation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ui): align V1-V6 semantic contracts"
          git push origin HEAD:chatgpt/full-v1-v6-implementation
