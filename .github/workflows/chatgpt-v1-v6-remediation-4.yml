name: ChatGPT V1-V6 remediation 4

on:
  push:
    branches:
      - chatgpt/full-v1-v6-implementation

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/full-v1-v6-implementation
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Reapply verified migration edits and close residual contracts
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          previous = Path('.github/workflows/chatgpt-v1-v6-remediation-3.yml').read_text()
          marker = "          python <<'PY'\n"
          if marker not in previous:
              raise SystemExit('previous remediation script start not found')
          body = previous.split(marker, 1)[1].split('\n          PY\n', 1)[0]
          exec(textwrap.dedent(body), {'Path': Path, 're': re})

          def replace(path, old, new, expected=1):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} x {old!r}, found {count}')
              file.write_text(text.replace(old, new))

          # Final landing vocabulary and evidence grammar.
          replace('apps/web/src/__tests__/app/home-page-section-intros.test.tsx', '"Факты и источники"', '"Подтверждения и источники"')
          replace('apps/web/src/__tests__/app/home-page-section-intros.test.tsx', '"ОЦЕНКА РАДАРА"', '"Уровень подтверждения"')
          replace('apps/web/src/__tests__/app/home-page-section-intros.test.tsx', '"ФАКТЫ ПО КОМПАНИИ"', '"Источник · факт · дата · статус"')
          replace('apps/web/src/__tests__/app/home-page-section-intros.test.tsx', 'expect(evidence).toContain("Почему сейчас");', 'expect(evidence).toContain("почему сейчас");')
          replace(
              'apps/web/src/__tests__/app/landing-visual-polish.test.ts',
              'expect(sceneStyles).toMatch(/@media \\(max-width:\\s*600px\\)[\\s\\S]*?\\.signalSpine\\s*\\{/);',
              'expect(sceneStyles).toMatch(/@media \\(max-width:\\s*600px\\)[\\s\\S]*?\\.signalStep\\s*\\{/);',
          )

          # AI confidence is semantically a dt/dd pair, not one concatenated text node.
          replace(
              'apps/web/src/__tests__/app/leads/ai-enrichment-block.test.tsx',
              "expect(screen.getByText(/Уверенность ИИ: средняя/)).toBeInTheDocument();",
              "expect(screen.getByText('Уверенность ИИ')).toBeInTheDocument();\n    expect(screen.getByText(/средняя · scrapegraph/)).toBeInTheDocument();",
          )

          # Move secondary company context after the action rail in source DOM.
          detail = Path('apps/web/app/leads/[id]/page.tsx')
          text = detail.read_text()
          main_marker = '          <div className={styles.main} data-company-brief-context>'
          main_start = text.index(main_marker)
          depth = 0
          main_end = None
          for match in re.finditer(r'<div\b|</div>', text[main_start:]):
              token = match.group(0)
              depth += 1 if token.startswith('<div') else -1
              if depth == 0:
                  main_end = main_start + match.end()
                  break
          if main_end is None:
              raise SystemExit('Company Brief main block boundary not found')
          main_block = text[main_start:main_end]
          text = text[:main_start] + text[main_end:]
          aside_marker = '          <aside className={styles.aside} aria-label="Действия и контекст" data-company-brief-action>'
          aside_start = text.index(aside_marker)
          aside_close = text.index('          </aside>', aside_start) + len('          </aside>')
          text = text[:aside_close] + '\n' + main_block + text[aside_close:]
          detail.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify targeted semantic contracts
        run: >-
          npm test --workspace @recruiter-radar/web -- --runInBand --runTestsByPath
          src/__tests__/app/home-page-section-intros.test.tsx
          src/__tests__/app/landing-visual-polish.test.ts
          src/__tests__/app/landing-final-production-contract.test.ts
          src/__tests__/app/landing-runtime-truth-contract.test.ts
          src/__tests__/app/leads/product-route-access.test.tsx
          src/__tests__/app/evidence-radar-surface-contract.test.ts
          src/__tests__/app/leads/lead-row.test.tsx
          src/__tests__/app/leads/lead-detail-mobile-hierarchy.test.ts
          src/__tests__/app/site-finish-contract.test.ts
          src/__tests__/app/onboarding/onboarding-view.test.tsx
          src/__tests__/app/leads/ai-enrichment-block.test.tsx
          src/__tests__/app/opportunities/opportunity-funnel.test.tsx
          src/__tests__/app/opportunities/opportunity-states.test.tsx
      - name: Typecheck web
        run: npm run typecheck --workspace @recruiter-radar/web
      - name: Lint web
        run: npm run lint --workspace @recruiter-radar/web
      - name: Commit verified fixes and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/chatgpt-v1-v6-remediation.yml .github/workflows/chatgpt-v1-v6-remediation-2.yml .github/workflows/chatgpt-v1-v6-remediation-3.yml .github/workflows/chatgpt-v1-v6-remediation-4.yml
          git config user.name "chatgpt-remediation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ui): align V1-V6 semantic contracts"
          git push origin HEAD:chatgpt/full-v1-v6-implementation
