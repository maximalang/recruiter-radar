name: ChatGPT V1-V6 remediation 5

on:
  push:
    branches:
      - chatgpt/full-v1-v6-implementation

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/full-v1-v6-implementation
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Reapply complete remediation and fix mobile contract syntax
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          previous = Path('.github/workflows/chatgpt-v1-v6-remediation-4.yml').read_text()
          marker = "          python <<'PY'\n"
          body = previous.split(marker, 1)[1].split('\n          PY\n', 1)[0]
          exec(textwrap.dedent(body), {'Path': Path, 're': re, 'textwrap': textwrap})

          path = Path('apps/web/src/__tests__/app/landing-visual-polish.test.ts')
          text = path.read_text()
          old = 'expect(sceneStyles).toMatch(/@media \\(max-width:\\s*600px\\)[\\s\\S]*?\\.signalStep\\s*\\{/);'
          new = 'expect(sceneStyles).toContain("@media(max-width:600px)");\n    expect(sceneStyles).toContain(".signalStep{padding-bottom:24px}");'
          if text.count(old) != 1:
              raise SystemExit(f'landing mobile contract assertion mismatch: {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify targeted semantic contracts
        run: >-
          npm test --workspace @recruiter-radar/web -- --runInBand --runTestsByPath
          src/__tests__/app/home-page-section-intros.test.tsx
          src/__tests__/app/landing-visual-polish.test.ts
          src/__tests__/app/landing-final-production-contract.test.ts
          src/__tests__/app/landing-runtime-truth-contract.test.ts
          src/__tests__/app/leads/product-route-access.test.tsx
          src/__tests__/app/evidence-radar-surface-contract.test.ts
          src/__tests__/app/leads/lead-row.test.tsx
          src/__tests__/app/leads/lead-detail-mobile-hierarchy.test.ts
          src/__tests__/app/site-finish-contract.test.ts
          src/__tests__/app/onboarding/onboarding-view.test.tsx
          src/__tests__/app/leads/ai-enrichment-block.test.tsx
          src/__tests__/app/opportunities/opportunity-funnel.test.tsx
          src/__tests__/app/opportunities/opportunity-states.test.tsx
      - name: Typecheck web
        run: npm run typecheck --workspace @recruiter-radar/web
      - name: Lint web
        run: npm run lint --workspace @recruiter-radar/web
      - name: Commit verified fixes and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/chatgpt-v1-v6-remediation.yml .github/workflows/chatgpt-v1-v6-remediation-2.yml .github/workflows/chatgpt-v1-v6-remediation-3.yml .github/workflows/chatgpt-v1-v6-remediation-4.yml .github/workflows/chatgpt-v1-v6-remediation-5.yml
          git config user.name "chatgpt-remediation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ui): align V1-V6 semantic contracts"
          git push origin HEAD:chatgpt/full-v1-v6-implementation
