name: ChatGPT V1-V6 remediation

on:
  push:
    branches:
      - chatgpt/full-v1-v6-implementation

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/full-v1-v6-implementation
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Apply semantic contract fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def p(path):
              return Path(path)

          def replace(path, old, new, count=None):
              file = p(path)
              text = file.read_text()
              actual = text.count(old)
              if count is not None and actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old!r}')
              if actual == 0:
                  raise SystemExit(f'{path}: pattern not found: {old!r}')
              file.write_text(text.replace(old, new))

          def regex_replace(path, pattern, replacement, count=1):
              file = p(path)
              text = file.read_text()
              text2, actual = re.subn(pattern, replacement, text, count=count, flags=re.S)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} regex replacements, found {actual}: {pattern!r}')
              file.write_text(text2)

          # Final authenticated terminology and route-state contracts.
          replace('apps/web/src/__tests__/app/opportunities/opportunity-states.test.tsx', "name: 'Сегодня'", "name: 'Ситуации'", 2)
          replace('apps/web/src/__tests__/app/opportunities/opportunity-funnel.test.tsx', 'Показано 7 раз · 4 возможности', 'Показано 7 раз · 4 ситуации', 1)
          replace('apps/web/src/__tests__/app/onboarding/onboarding-view.test.tsx', 'Как получать новые возможности', 'Как получать новые компании', 1)
          replace('apps/web/src/__tests__/app/leads/ai-enrichment-block.test.tsx', '/AI-подсказка по найму/i', '/ИИ-подсказка по найму/i', 1)
          replace('apps/web/src/__tests__/app/leads/product-route-access.test.tsx', 'Не удалось загрузить возможность', 'Не удалось загрузить компанию', 1)
          replace('apps/web/src/__tests__/app/leads/product-route-access.test.tsx', 'Лид не найден', 'Компания не найдена', 1)
          replace('apps/web/src/__tests__/app/leads/product-route-access.test.tsx', 'Не удалось загрузить профили Radar', 'Не удалось загрузить профили радара', 1)

          # Radar Sources lives under Settings → Diagnostics; legacy /opportunities/sources is redirect-only.
          replace(
              'apps/web/src/__tests__/app/evidence-radar-surface-contract.test.ts',
              "const sourcePage = readFileSync(resolve(opportunitiesRoot, 'sources', 'page.tsx'), 'utf8')",
              "const sourcePage = readFileSync(resolve(process.cwd(), 'app', 'settings', 'diagnostics', 'sources', 'page.tsx'), 'utf8')\n  const legacySourcePage = readFileSync(resolve(opportunitiesRoot, 'sources', 'page.tsx'), 'utf8')",
              1,
          )
          replace(
              'apps/web/src/__tests__/app/evidence-radar-surface-contract.test.ts',
              "    expect(navigation).toContain(\"label: 'Диагностика источников'\")",
              "    expect(navigation).not.toContain('Диагностика источников')\n    expect(legacySourcePage).toContain(\"redirect('/settings/diagnostics/sources')\")",
              1,
          )

          # Company rows stay scan-first: no per-row evidence accordion, no /100 decoration.
          replace('apps/web/src/__tests__/app/leads/lead-row.test.tsx', 'Сила сигнала 80 из 100', 'Сила сигнала 80', 3)
          regex_replace(
              'apps/web/src/__tests__/app/leads/lead-row.test.tsx',
              r"  it\('keeps primary proof scan-friendly and provenance behind a disclosure', \(\) => \{.*?\n  \}\);\n\n  it\('keeps workflow status subordinate",
              "  it('keeps primary proof scan-friendly without a per-row evidence accordion', () => {\n    const { container } = render(\n      <LeadRow\n        lead={{ ...baseLead, reasons: ['Карьерная страница обновлена'] } as unknown as LeadItem}\n        fitPreview={{ icon: 'industry', text: 'Совпадает отрасль' }}\n        hiringMode=\"specialist\"\n        rank={2}\n      />,\n    );\n\n    expect(screen.getByText('Hiring burst across 3 roles')).toBeInTheDocument();\n    expect(container.textContent).toContain('4 вакансии · 2 подтвержд.');\n    expect(container.textContent).toContain('1 источник');\n    expect(container.textContent).toContain('Совпадает отрасль');\n    expect(container.querySelector('details')).toBeNull();\n    expect(container.querySelector('[data-legend]')).toBeNull();\n  });\n\n  it('keeps workflow status subordinate",
              1,
          )
          replace('apps/web/src/__tests__/app/leads/lead-row.test.tsx', 'AI-подсказка доступна', 'ИИ-подсказка доступна', 1)
          replace(
              'apps/web/app/leads/leads-page-content.tsx',
              "  const secondarySignals = [\n    lead.isForeignEmployer ? 'зарубежный ATS' : null,\n    fitPreview?.text ?? null,\n  ].filter(Boolean).join(' · ');",
              "  const secondarySignals = [\n    lead.isForeignEmployer ? 'иностранный работодатель' : null,\n    lead.hasAiHint ? 'ИИ-подсказка доступна' : null,\n    fitPreview?.text ?? null,\n  ].filter(Boolean).join(' · ');",
              1,
          )

          # Remove dead LeadRow disclosure/ledger CSS left after the V3 scan-row migration.
          regex_replace(
              'apps/web/app/leads/leads-workspace.module.css',
              r"\n\.disclosure\{.*?\n\.emptyWrap\{",
              "\n.emptyWrap{",
              1,
          )
          replace('apps/web/app/leads/leads-workspace.module.css', '.workflow,.disclosure{grid-column:2/-1}', '.workflow{grid-column:2/-1}', 1)
          replace('apps/web/app/leads/leads-workspace.module.css', ' "disclosure disclosure"', '', 1)
          replace('apps/web/app/leads/leads-workspace.module.css', '.disclosure{grid-area:disclosure}', '', 1)
          replace('apps/web/app/leads/leads-workspace.module.css', '.ledger{grid-template-columns:1fr;gap:18px}', '', 1)

          # Site-finish contract follows the final semantic company rail, not retired signalCardList.
          replace(
              'apps/web/src/__tests__/app/site-finish-contract.test.ts',
              '    const radar = readAppFile("opportunities/evidence-radar-map.module.css");',
              '    const radar = readAppFile("opportunities/evidence-radar-map.module.css");\n    const leads = readAppFile("leads/leads-workspace.module.css");',
              1,
          )
          replace(
              'apps/web/src/__tests__/app/site-finish-contract.test.ts',
              '    expect(internalPage).toMatch(/\\.signalCardList \\{[\\s\\S]*?gap: 0;[\\s\\S]*?background: transparent;/);',
              '    expect(leads).toContain(".list{display:grid}");\n    expect(leads).toMatch(/\\.row\\{[\\s\\S]*?border-bottom:1px solid var\\(--rr-color-separator\\)/);\n    expect(leads).not.toContain(".disclosure");',
              1,
          )

          # Landing contracts follow the final split preview and final copy.
          replace('apps/web/src/__tests__/app/home-page-section-intros.test.tsx', 'expect(html).toContain("Настройте нишу и географию");', 'expect(html).toContain("Настройте нишу");', 1)
          replace('apps/web/src/__tests__/app/home-page-section-intros.test.tsx', 'expect(markup.match(/name=\\"preview-leads\\"/g)).toHaveLength(2);', 'expect(markup.match(/data-selected-lead-detail/g)).toHaveLength(1);', 1)
          replace('apps/web/src/__tests__/app/home-page-section-intros.test.tsx', 'expect(hero).toContain("Уже есть доступ? Войти");', 'expect(hero).toContain(">Войти</a>");', 1)
          replace('apps/web/src/__tests__/app/landing-visual-polish.test.ts', '@media \\(max-width:\\s*760px\\)', '@media \\(max-width:\\s*600px\\)', 1)
          replace('apps/web/src/__tests__/app/landing-final-production-contract.test.ts', 'expect(evidence).toContain("Почему сейчас");', 'expect(evidence).toContain("почему сейчас");', 1)
          replace('apps/web/src/__tests__/app/landing-runtime-truth-contract.test.ts', 'expect(evidence).toContain("Почему сейчас");', 'expect(evidence).toContain("почему сейчас");', 1)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify remediated semantic contracts
        run: >-
          npm test --workspace @recruiter-radar/web -- --runInBand --runTestsByPath
          src/__tests__/app/home-page-section-intros.test.tsx
          src/__tests__/app/landing-visual-polish.test.ts
          src/__tests__/app/landing-final-production-contract.test.ts
          src/__tests__/app/landing-runtime-truth-contract.test.ts
          src/__tests__/app/leads/product-route-access.test.tsx
          src/__tests__/app/evidence-radar-surface-contract.test.ts
          src/__tests__/app/leads/lead-row.test.tsx
          src/__tests__/app/site-finish-contract.test.ts
          src/__tests__/app/onboarding/onboarding-view.test.tsx
          src/__tests__/app/leads/ai-enrichment-block.test.tsx
          src/__tests__/app/opportunities/opportunity-funnel.test.tsx
          src/__tests__/app/opportunities/opportunity-states.test.tsx
      - name: Commit verified fixes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/chatgpt-v1-v6-remediation.yml
          git config user.name "chatgpt-remediation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ui): align V1-V6 semantic contracts"
          git push origin HEAD:chatgpt/full-v1-v6-implementation
