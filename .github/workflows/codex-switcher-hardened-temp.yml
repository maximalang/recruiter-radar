name: Build Codex Switcher Hardened 0.3.1

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/codex-switcher-build-trigger.txt'

jobs:
  windows:
    if: github.event.pull_request.title == 'Temporary CI trigger: Codex Switcher Hardened'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Fetch isolated build payload
        shell: pwsh
        run: |
          git clone --depth 1 --branch build/codex-switcher-hardened-0.3.0 https://github.com/maximalang/site.git payload
          $parts = Get-ChildItem 'payload\codex-build\patch.part*' | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 patch parts, found $($parts.Count)" }
          $encoded = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('hardened.patch.gz', [Convert]::FromBase64String($encoded))
          $input = [IO.File]::OpenRead('hardened.patch.gz')
          $output = [IO.File]::Create('hardened.patch')
          $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
          try { $gzip.CopyTo($output) } finally { $gzip.Dispose(); $output.Dispose(); $input.Dispose() }

      - name: Fetch exact upstream v0.2.9 and apply hardened 0.3.1
        shell: pwsh
        run: |
          git clone https://github.com/Lampese/codex-switcher.git source
          Set-Location source
          git checkout 31e2b962009a51f27e964fa5c1984b1aeb237079
          git apply --check ..\hardened.patch
          git apply ..\hardened.patch
          git apply --check '..\payload\codex-build\fix-001-remove-updater-permission.patch'
          git apply '..\payload\codex-build\fix-001-remove-updater-permission.patch'
          git apply --check '..\payload\codex-build\fix-005-separate-install-0.3.1.patch'
          git apply '..\payload\codex-build\fix-005-separate-install-0.3.1.patch'
          Copy-Item '..\payload\codex-build\scripts\migrate-accounts.ps1' 'tools\migrate-accounts.ps1' -Force
          Copy-Item '..\payload\codex-build\scripts\verify-accounts.ps1' 'tools\verify-accounts.ps1' -Force
          Copy-Item '..\payload\codex-build\scripts\remove-old-switcher.ps1' 'tools\remove-old-switcher.ps1' -Force
          Copy-Item '..\payload\codex-build\scripts\install-hardened.ps1' 'tools\install-hardened.ps1' -Force

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri -> target
          cache-on-failure: true

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: source
        run: pnpm build

      - name: Verify isolation configuration
        shell: pwsh
        run: |
          $config = Get-Content 'source\src-tauri\tauri.conf.json' -Raw | ConvertFrom-Json
          $win = Get-Content 'source\src-tauri\tauri.windows.conf.json' -Raw | ConvertFrom-Json
          if ($config.productName -ne 'Codex Switcher Hardened') { throw 'Wrong productName' }
          if ($config.version -ne '0.3.1') { throw 'Wrong version' }
          if ($config.identifier -ne 'com.maximalang.codex-switcher-hardened') { throw 'Wrong identifier' }
          if ($win.app.windows[0].title -ne 'Codex Switcher Hardened') { throw 'Wrong Windows title' }
          $storage = Get-Content 'source\src-tauri\src\auth\storage.rs' -Raw
          if ($storage -notmatch 'CODEX_SWITCHER_HARDENED_HOME') { throw 'Dedicated home override missing' }
          if ($storage -match 'var\("CODEX_SWITCHER_HOME"\)') { throw 'Legacy home override is still accepted' }
          if ($storage -notmatch '\.codex-switcher-hardened') { throw 'Dedicated default store missing' }

      - name: Validate PowerShell scripts and migration
        shell: pwsh
        run: |
          $scripts = @(
            'source\tools\install-hardened.ps1',
            'source\tools\migrate-accounts.ps1',
            'source\tools\verify-accounts.ps1',
            'source\tools\remove-old-switcher.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if (@($parseErrors).Count -gt 0) {
              throw "PowerShell parse failure in $script`n$((@($parseErrors | ForEach-Object Message) -join "`n"))"
            }
          }

          function ConvertTo-Base64Url([string]$Text) {
            [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($Text)).TrimEnd('=').Replace('+', '-').Replace('/', '_')
          }
          $root = Join-Path $env:RUNNER_TEMP 'codex-switcher-migration-test'
          $legacy = Join-Path $root 'legacy'
          $target = Join-Path $root 'target'
          $codex = Join-Path $root 'codex'
          $backup = Join-Path $root 'backup'
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $legacy, $codex -Force | Out-Null
          $header = ConvertTo-Base64Url '{"alg":"none","typ":"JWT"}'
          $payload = ConvertTo-Base64Url '{"sub":"user-test-1","email":"test@example.com"}'
          $idToken = "$header.$payload.signature"
          $store = [ordered]@{
            version = 1
            accounts = @(
              [ordered]@{ id='account-1'; name='Primary'; email='test@example.com'; plan_type='plus'; auth_mode='chat_g_pt'; auth_data=[ordered]@{ type='chat_g_pt'; id_token=$idToken; access_token='access-1'; refresh_token='refresh-1'; account_id='workspace-1' }; created_at='2026-01-01T00:00:00Z'; last_used_at=$null },
              [ordered]@{ id='account-2'; name='API account'; email=$null; plan_type=$null; auth_mode='api_key'; auth_data=[ordered]@{ type='api_key'; key='sk-test-only' }; created_at='2026-01-01T00:00:00Z'; last_used_at=$null }
            )
            active_account_id = 'account-1'
            masked_account_ids = @()
          }
          [IO.File]::WriteAllText((Join-Path $legacy 'accounts.json'), ($store | ConvertTo-Json -Depth 20), [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText((Join-Path $codex 'auth.json'), (@{ tokens=@{ id_token=$idToken; access_token='access-live'; refresh_token='refresh-live'; account_id='workspace-1' } } | ConvertTo-Json -Depth 10), [Text.UTF8Encoding]::new($false))
          $sourceBefore = (Get-FileHash (Join-Path $legacy 'accounts.json') -Algorithm SHA256).Hash
          $authBefore = (Get-FileHash (Join-Path $codex 'auth.json') -Algorithm SHA256).Hash
          & 'source\tools\migrate-accounts.ps1' -SourceDir $legacy -TargetDir $target -CodexDir $codex -BackupRoot $backup -SkipProcessCheck
          & 'source\tools\verify-accounts.ps1' -SourceDir $legacy -TargetDir $target -CodexDir $codex
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic verification failed' }
          if ($sourceBefore -ne (Get-FileHash (Join-Path $legacy 'accounts.json') -Algorithm SHA256).Hash) { throw 'Migration changed legacy store' }
          if ($authBefore -ne (Get-FileHash (Join-Path $codex 'auth.json') -Algorithm SHA256).Hash) { throw 'Migration changed Codex auth' }

      - name: Format and release-test Rust
        working-directory: source
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --release --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer and portable executable
        working-directory: source
        run: pnpm tauri:win build --target x86_64-pc-windows-msvc

      - name: Test deterministic portable installation
        shell: pwsh
        run: |
          $portable = 'source\src-tauri\target\x86_64-pc-windows-msvc\release\codex-switcher-hardened.exe'
          if (-not (Test-Path $portable)) { throw 'Portable executable missing' }
          $testDir = Join-Path $env:RUNNER_TEMP 'portable-package'
          $installDir = Join-Path $env:RUNNER_TEMP 'portable-installed'
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null
          Copy-Item $portable (Join-Path $testDir 'codex-switcher-hardened.exe') -Force
          Copy-Item 'source\tools\install-hardened.ps1' $testDir -Force
          & (Join-Path $testDir 'install-hardened.ps1') -InstallDir $installDir
          $installed = Join-Path $installDir 'codex-switcher-hardened.exe'
          if (-not (Test-Path $installed)) { throw 'Portable installer did not copy executable' }
          if ((Get-FileHash $portable -Algorithm SHA256).Hash -ne (Get-FileHash $installed -Algorithm SHA256).Hash) { throw 'Portable installed binary hash mismatch' }
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CodexSwitcherHardened'
          if ($entry.DisplayVersion -ne '0.3.1') { throw 'Portable uninstall registration failed' }

      - name: Collect deliverables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path deliverables -Force | Out-Null
          $installer = Get-ChildItem 'source\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }
          Copy-Item $installer.FullName 'deliverables\Codex-Switcher-Hardened-0.3.1-x64-setup.exe'
          Copy-Item 'source\src-tauri\target\x86_64-pc-windows-msvc\release\codex-switcher-hardened.exe' 'deliverables\codex-switcher-hardened.exe'
          Copy-Item 'source\tools\install-hardened.ps1' deliverables\
          Copy-Item 'source\tools\migrate-accounts.ps1' deliverables\
          Copy-Item 'source\tools\verify-accounts.ps1' deliverables\
          Copy-Item 'source\tools\remove-old-switcher.ps1' deliverables\
          Copy-Item 'source\HARDENED-README.md' deliverables\
          $lines = Get-ChildItem deliverables -File | Sort-Object Name | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)"
          }
          [IO.File]::WriteAllLines((Join-Path (Resolve-Path deliverables) 'SHA256SUMS.txt'), $lines, [Text.UTF8Encoding]::new($false))

      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Switcher-Hardened-0.3.1-Windows-x64
          path: deliverables
          if-no-files-found: error
          retention-days: 7
