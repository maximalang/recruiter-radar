# trigger: complete public pages patch
name: Complete public pages patch

on:
  push:
    branches: [feat/robokassa-primary-billing]
    paths:
      - '.github/workflows/complete-public-pages.yml'

permissions:
  contents: write

concurrency:
  group: complete-public-pages-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/robokassa-primary-billing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply structured checkout and legal page patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count))

          checkout = 'apps/web/app/checkout/page.tsx'
          replace(
              checkout,
              '''      comment: JSON.stringify({
                schema: "checkout-details-v2",
                legalAcceptance,
                payer: {
                  type: payerType,
                  buyerInn: payerType === "business" ? buyerInn : null,
                },
              }),''',
              '''      payerType,
      buyerInn: payerType === "business" ? buyerInn : null,
      legalAcceptance,
      comment: null,''',
          )

          payments = 'apps/web/lib/payments.ts'
          replace(
              payments,
              '''  normalizeCheckoutOrderUserId,
  normalizeDailyDigestLimit,''',
              '''  normalizeBuyerInn,
  normalizeCheckoutOrderUserId,
  normalizeCheckoutPayerType,
  normalizeDailyDigestLimit,
  normalizeLegalAcceptance,''',
          )
          replace(
              payments,
              '''  const checkoutOwnerId = normalizeCheckoutOrderUserId(input.userId);
  const plan = getPublicPlanByCode(input.productCode);
  let order = await createCheckoutOrder({''',
              '''  const checkoutOwnerId = normalizeCheckoutOrderUserId(input.userId);
  const plan = getPublicPlanByCode(input.productCode);
  const payerType = normalizeCheckoutPayerType(input.payerType);
  const buyerInn = normalizeBuyerInn(input.buyerInn, payerType);
  const legalAcceptance = normalizeLegalAcceptance(input.legalAcceptance);

  if (payerType === "business" && !buyerInn) {
    throw new Error("A valid 10- or 12-digit buyer INN is required for a business payment.");
  }
  if (!legalAcceptance) {
    throw new Error("Legal acceptance evidence is required before checkout.");
  }

  let order = await createCheckoutOrder({''',
          )
          replace(
              payments,
              '''      planName: plan.name,
      planCadence: plan.cadence,
      specialization:''',
              '''      planName: plan.name,
      planCadence: plan.cadence,
      payerType,
      buyerInn,
      legalAcceptance,
      specialization:''',
          )

          normalize = 'apps/web/lib/paymentsNormalize.ts'
          replace(
              normalize,
              '''  CHECKOUT_ORDER_ONBOARDING_STATUSES,
  CHECKOUT_ORDER_ONBOARDING_STEPS,
  CHECKOUT_ORDER_STATUSES,''',
              '''  CHECKOUT_ORDER_ONBOARDING_STATUSES,
  CHECKOUT_ORDER_ONBOARDING_STEPS,
  CHECKOUT_ORDER_STATUSES,
  CHECKOUT_PAYER_TYPES,''',
          )
          replace(
              normalize,
              '''  type CheckoutOrder,
  type CheckoutOrderOnboardingStatus,''',
              '''  type CheckoutLegalAcceptance,
  type CheckoutOrder,
  type CheckoutOrderOnboardingStatus,''',
          )
          replace(
              normalize,
              '''  type CheckoutOrderStatus,
  type PublicPlanCode''',
              '''  type CheckoutOrderStatus,
  type CheckoutPayerType,
  type PublicPlanCode''',
          )
          replace(
              normalize,
              '''  const payload = value && typeof value === "object" ? (value as Record<string, unknown>) : {};

