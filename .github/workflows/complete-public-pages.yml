  const payerType = normalizeCheckoutPayerType(readString(payload.payerType));

  return {
    planName: normalizeOptionalText(readString(payload.planName)) ?? plan.name,
    planCadence: normalizeOptionalText(readString(payload.planCadence)) ?? plan.cadence,
    payerType,
    buyerInn: normalizeBuyerInn(readString(payload.buyerInn), payerType),
    legalAcceptance: normalizeLegalAcceptance(payload.legalAcceptance),''',
          )
          replace(
              normalize,
              '''export function normalizeCheckoutOrderId(value: string | number): number {''',
              '''export function normalizeCheckoutPayerType(value: unknown): CheckoutPayerType {
  const normalized = typeof value === "string" ? value.trim().toLowerCase() : "";
  return (CHECKOUT_PAYER_TYPES as readonly string[]).includes(normalized)
    ? normalized as CheckoutPayerType
    : "individual";
}

export function normalizeBuyerInn(
  value: string | null | undefined,
  payerType: CheckoutPayerType
): string | null {
  if (payerType !== "business") return null;
  const normalized = typeof value === "string" ? value.replace(/\D/g, "") : "";
  return /^(?:\d{10}|\d{12})$/.test(normalized) ? normalized : null;
}

export function normalizeLegalAcceptance(value: unknown): CheckoutLegalAcceptance | null {
  if (!value || typeof value !== "object" || Array.isArray(value)) return null;
  const source = value as Record<string, unknown>;
  const acceptedAt = normalizeOptionalText(readString(source.acceptedAt));
  const termsRevision = normalizeOptionalText(readString(source.termsRevision));
  const paymentAndRefundRevision = normalizeOptionalText(readString(source.paymentAndRefundRevision));
  const privacyRevision = normalizeOptionalText(readString(source.privacyRevision));
  const personalDataConsentRevision = normalizeOptionalText(readString(source.personalDataConsentRevision));
  if (
    !acceptedAt || Number.isNaN(new Date(acceptedAt).getTime()) ||
    !termsRevision || !paymentAndRefundRevision || !privacyRevision || !personalDataConsentRevision
  ) return null;
  return {
    acceptedAt: new Date(acceptedAt).toISOString(),
    termsRevision,
    paymentAndRefundRevision,
    privacyRevision,
    personalDataConsentRevision
  };
}

