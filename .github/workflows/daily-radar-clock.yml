name: Daily Radar Clock

on:
  schedule:
    - cron: '15 6 * * *'
    - cron: '15 9 * * *'
    - cron: '15 12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Safe readiness verification or explicit real delivery
        required: true
        default: verify
        type: choice
        options:
          - verify
          - deliver
      confirm:
        description: Type DELIVER to permit manual delivery
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: daily-radar-prod
  cancel-in-progress: false

jobs:
  daily-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.RR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.RR_SSH_PORT }} -t ed25519 ${{ secrets.RR_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Trigger fenced once-per-day radar delivery
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
          MANUAL_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            case "$MANUAL_MODE" in
              verify)
                trigger='manual-verify'
                request_mode='verify'
                ;;
              deliver)
                [ "$MANUAL_CONFIRM" = 'DELIVER' ] || {
                  echo 'Manual delivery requires confirm=DELIVER.' >&2
                  exit 64
                }
                trigger='manual-deliver'
                request_mode='deliver'
                ;;
              *) echo "Unsupported manual mode: $MANUAL_MODE" >&2; exit 64 ;;
            esac
          else
            case "$EVENT_SCHEDULE" in
              '15 6 * * *') trigger='primary' ;;
              '15 9 * * *') trigger='recovery-1' ;;
              '15 12 * * *') trigger='recovery-2' ;;
              *) echo "Unknown schedule: $EVENT_SCHEDULE" >&2; exit 64 ;;
            esac
            request_mode='scheduled'
          fi
          ssh -p ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }} \
            "DAILY_RADAR_TRIGGER='$trigger' DAILY_RADAR_REQUEST_MODE='$request_mode' bash -s" <<'SSH_EOF'
          set -euo pipefail
          cd /opt/recruiter-radar
          docker compose exec -T \
            -e DAILY_RADAR_TRIGGER="$DAILY_RADAR_TRIGGER" \
            -e DAILY_RADAR_REQUEST_MODE="$DAILY_RADAR_REQUEST_MODE" \
            web node --input-type=module - <<'NODE'
          const key = process.env.CRON_API_KEY?.trim()
          if (!key) throw new Error('CRON_API_KEY is not configured in the web runtime.')

          const requestMode = process.env.DAILY_RADAR_REQUEST_MODE
          const requestBody = requestMode === 'verify'
            ? { mode: 'verify' }
            : requestMode === 'deliver'
              ? { mode: 'deliver', confirm: 'DELIVER' }
              : {}

          const response = await fetch('http://127.0.0.1:3000/api/cron/daily-radar', {
            method: 'POST',
            headers: { 'x-api-key': key, 'content-type': 'application/json' },
            body: JSON.stringify(requestBody),
          })
          const body = await response.json().catch(() => ({}))
          console.log(JSON.stringify({
            trigger: process.env.DAILY_RADAR_TRIGGER || 'unknown',
            runDate: body?.runDate ?? null,
            attempt: body?.data?.attemptCount ?? body?.attemptCount ?? null,
            finalStatus: body?.reason ?? (body?.success === true ? 'completed' : 'failed'),
            httpStatus: response.status,
            success: body?.success ?? false,
            skipped: body?.skipped ?? false,
            terminal: body?.terminal ?? false,
            reason: body?.reason ?? null,
            nextRetryAt: body?.nextRetryAt ?? null,
            durationMs: body?.data?.durationMs ?? null,
            ingestStatus: body?.data?.ingest?.ok === true ? 'healthy' : body?.data?.ingest ? 'failed' : 'unknown',
            ingestSucceeded: body?.data?.ingest?.succeeded ?? 0,
            ingestFailed: body?.data?.ingest?.failed ?? 0,
            credentialGated: body?.data?.ingest?.credentialGated ?? 0,
            ingestNoActiveProfiles: body?.data?.ingest?.noActiveProfiles ?? false,
            temporalStatus: body?.data?.temporal?.ok === true ? 'healthy' : body?.data?.temporal ? 'failed' : 'unknown',
            temporalReasonCode: body?.data?.temporal?.reason ?? null,
            temporalObservations: body?.data?.temporal?.observations ?? 0,
            temporalDerivedEvents: body?.data?.temporal?.derivedEvents ?? 0,
            profilesActive: body?.data?.digest?.eligibility?.active ?? 0,
            profilesEligible: body?.data?.digest?.eligibility?.eligible ?? body?.data?.digest?.profilesTotal ?? 0,
            profileExclusions: body?.data?.digest?.eligibility?.excluded ?? {},
            profilesCompleted: body?.data?.digest?.profilesCompleted ?? 0,
            profilesRetryable: body?.data?.digest?.profilesRetryable ?? 0,
            profilesTerminal: body?.data?.digest?.profilesTerminal ?? 0,
            profilesSkipped: body?.data?.digest?.profilesSkipped ?? 0,
            profilesRunning: body?.data?.digest?.profilesRunning ?? 0,
            sent: body?.data?.digest?.totalSent ?? 0,
            failed: body?.data?.digest?.totalFailed ?? 0,
          }))

          if (requestMode === 'verify') {
            if (response.status === 200 && body?.success === true && body?.mode === 'verify') process.exit(0)
            throw new Error(`daily-radar verification failed (HTTP ${response.status})`)
          }

          const cleanNoop = body?.reason === 'retry-backoff'
            || body?.reason === 'already-running'
            || body?.reason === 'already-completed'
          if (response.status === 200 && (body?.success === true || cleanNoop)) process.exit(0)
          if (response.status === 422) process.exit(0)
          if (body?.reason === 'attempt-limit' || body?.reason === 'terminal' || body?.terminal === true) {
            throw new Error(`daily-radar reached a terminal state: ${body?.reason ?? 'terminal'}`)
          }
          throw new Error(`daily-radar requires a later DB-eligible recovery trigger (HTTP ${response.status})`)
          NODE
          SSH_EOF
