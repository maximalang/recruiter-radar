name: Deploy

# Production deploy to Timeweb VDS. The workflow runs only for a successful
# Tests workflow triggered by a push to main and deploys that exact tested SHA.
# The image is transferred over SSH, so no container registry credentials are
# required. Secrets: RR_SSH_HOST, RR_SSH_PORT, RR_SSH_USER, RR_SSH_PRIVATE_KEY.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate deployment scripts
        run: |
          bash -n scripts/deploy/configure-notification-encryption.sh
          bash -n scripts/deploy/configure-caddy-real-ip.sh
          bash -n scripts/deploy/rollback-guard.sh

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.RR_SSH_PORT }} -t ed25519 ${{ secrets.RR_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload runtime configurator for preflight
        run: |
          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            scripts/deploy/configure-notification-encryption.sh \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}:/opt/recruiter-radar/configure-notification-encryption.sh

      - name: Preflight production server configuration
        run: |
          ssh -p ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }} \
            'chmod 700 /opt/recruiter-radar/configure-notification-encryption.sh && /opt/recruiter-radar/configure-notification-encryption.sh --preflight'

      - name: Build immutable Docker image
        run: |
          metrika_id="${{ vars.NEXT_PUBLIC_YANDEX_METRIKA_ID }}"
          [[ "$metrika_id" =~ ^[0-9]{5,12}$ ]] || {
            echo "NEXT_PUBLIC_YANDEX_METRIKA_ID is missing or invalid" >&2
            exit 1
          }
          docker build \
            --build-arg NEXT_PUBLIC_YANDEX_METRIKA_ID="$metrika_id" \
            -f apps/web/Dockerfile \
            -t "recruiter-radar:${DEPLOY_SHA}" .

      - name: Save image as tarball
        run: |
          docker save "recruiter-radar:${DEPLOY_SHA}" | gzip > /tmp/recruiter-radar-image.tar.gz
          ls -lh /tmp/recruiter-radar-image.tar.gz

      - name: Upload image and deployment helper to server
        run: |
          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            /tmp/recruiter-radar-image.tar.gz \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}:/opt/recruiter-radar/image-new.tar.gz
          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            scripts/deploy/rollback-guard.sh \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}:/opt/recruiter-radar/rollback-guard.sh
          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            scripts/deploy/configure-caddy-real-ip.sh \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}:/opt/recruiter-radar/configure-caddy-real-ip.sh

      - name: Deploy image with local rollback
        id: deploy
        run: |
          ssh -p ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }} \
            "DEPLOY_SHA='${DEPLOY_SHA}' bash -s" << 'SSH_EOF'
          set -Eeuo pipefail
          cd /opt/recruiter-radar
          chmod 700 /opt/recruiter-radar/configure-caddy-real-ip.sh
          /opt/recruiter-radar/configure-caddy-real-ip.sh
          chmod 700 /opt/recruiter-radar/configure-notification-encryption.sh
          chmod 700 /opt/recruiter-radar/rollback-guard.sh
          source /opt/recruiter-radar/rollback-guard.sh

          cleanup_tarball() {
            rm -f /opt/recruiter-radar/image-new.tar.gz
          }
          trap cleanup_tarball EXIT

          wait_for_health() {
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "Health check passed after ${i}x2s"
                curl -fsS http://localhost:3000/api/health
                return 0
              fi
              sleep 2
            done
            return 1
          }

          rollback() {
            echo "=== Rolling back to previous production image ==="
            if ! docker image inspect recruiter-radar:rollback > /dev/null 2>&1; then
              echo "Rollback image is unavailable" >&2
              return 1
            fi
            docker tag recruiter-radar:rollback recruiter-radar:latest
            /opt/recruiter-radar/configure-notification-encryption.sh
            wait_for_health
          }

          previous_image_id="$(docker inspect --format '{{.Image}}' recruiter-radar-web-1 2>/dev/null || true)"
          if [ -n "$previous_image_id" ]; then
            docker tag "$previous_image_id" recruiter-radar:rollback
            echo "Preserved rollback image $previous_image_id"
          fi

          echo "=== Reclaiming only safe Docker artifacts ==="
          docker container prune -f
          docker image prune -f

          # Each deploy tags a new recruiter-radar:<sha> image and never removes
          # the old ones, so they accumulate and exhaust the VDS disk (the d5d320f
          # deploy failed with "Insufficient disk space" this way). Drop every
          # <sha>-tagged image except the ones backing the live (:latest) and
          # rollback (:rollback) tags, then prune build cache. This keeps the
          # disk bounded across deploys without losing the rollback safety net.
          keep_ids="$(
            docker inspect --format '{{.Image}}' recruiter-radar:latest 2>/dev/null || true
            docker inspect --format '{{.Image}}' recruiter-radar:rollback 2>/dev/null || true
          )"
          for img in $(docker images --filter 'reference=recruiter-radar:*' --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
                       | awk '$1 !~ /:latest$/ && $1 !~ /:rollback$/ { print $2 }'); do
            case "$keep_ids" in
              *"$img"*) : ;;           # image backs latest or rollback — keep it
              *) docker rmi -f "$img" 2>/dev/null || true ;;
            esac
          done
          docker builder prune -f 2>/dev/null || true

          archive_bytes="$(stat -c '%s' /opt/recruiter-radar/image-new.tar.gz)"
          available_bytes="$(df -PB1 /opt/recruiter-radar | awk 'NR == 2 { print $4 }')"
          required_bytes="$((archive_bytes * 3 + 536870912))"
          if [ "$available_bytes" -lt "$required_bytes" ]; then
            echo "Insufficient disk space: ${available_bytes} bytes available, ${required_bytes} required" >&2
            exit 1
          fi

          echo "=== Validating production runtime configuration ==="
          /opt/recruiter-radar/configure-notification-encryption.sh --preflight

          echo "=== Loading immutable image ${DEPLOY_SHA} ==="
          docker load < /opt/recruiter-radar/image-new.tar.gz
          docker image inspect "recruiter-radar:${DEPLOY_SHA}" > /dev/null
          docker tag "recruiter-radar:${DEPLOY_SHA}" recruiter-radar:latest
          rollback_guard_arm

          echo "=== Recreating web container ==="
          /opt/recruiter-radar/configure-notification-encryption.sh

          echo "=== Waiting for local health (up to 60s) ==="
          wait_for_health
          rollback_guard_disarm
          SSH_EOF

      - name: Read brand version (single source of truth for the favicon gate)
        id: brand
        run: |
          BRAND_VERSION=$(grep -oE 'brandVersion = "brand-[0-9]+"' apps/web/app/layout.tsx \
            | grep -oE 'brand-[0-9]+' | head -1)
          if [ -z "$BRAND_VERSION" ]; then
            echo "Could not read brandVersion from apps/web/app/layout.tsx" >&2
            exit 1
          fi
          echo "Brand version: $BRAND_VERSION"
          echo "version=$BRAND_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify public HTTPS endpoint, brand layout, and native rounded favicons
        run: |
          BRAND_VERSION="${{ steps.brand.outputs.version }}"
          code=000
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://recruiter-radar.ru/api/health --max-time 30)
            echo "Public /api/health attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              landing_ok=false
              brand_layout_ok=false
              favicon_ok=false
              landing_html=$(curl -fsS https://recruiter-radar.ru/ --max-time 30 || true)

              if printf '%s' "$landing_html" \
                | grep -q 'data-deploy-anchor="recruiter-radar-landing-v3"'; then
                landing_ok=true
              fi

              if printf '%s' "$landing_html" \
                | grep -q 'data-brand-header="recruiter-radar-v3"'; then
                brand_layout_ok=true
              fi

              tab16_link_ok=false
              tab32_link_ok=false
              tab48_link_ok=false
              apple_icon_ok=false
              if printf '%s' "$landing_html" \
                | grep -qE '<link[^>]*rel="icon"[^>]*href="/tab-favicon-brand34-16"[^>]*>' \
                && printf '%s' "$landing_html" | grep -q 'sizes="16x16"'; then
                tab16_link_ok=true
              fi
              if printf '%s' "$landing_html" \
                | grep -qE '<link[^>]*rel="icon"[^>]*href="/tab-favicon-brand34-32"[^>]*>' \
                && printf '%s' "$landing_html" | grep -q 'sizes="32x32"'; then
                tab32_link_ok=true
              fi
              if printf '%s' "$landing_html" \
                | grep -qE '<link[^>]*rel="icon"[^>]*href="/tab-favicon-brand34-48"[^>]*>' \
                && printf '%s' "$landing_html" | grep -q 'sizes="48x48"'; then
                tab48_link_ok=true
              fi
              if printf '%s' "$landing_html" \
                | grep -qE '<link[^>]*rel="apple-touch-icon"[^>]*href="/apple-icon-180\?v='"${BRAND_VERSION}"'"[^>]*>' \
                && printf '%s' "$landing_html" | grep -q 'sizes="180x180"'; then
                apple_icon_ok=true
              fi

              tab16_code=$(curl -s -o /dev/null -w '%{http_code}' "https://recruiter-radar.ru/tab-favicon-brand34-16" --max-time 30)
              tab32_code=$(curl -s -o /dev/null -w '%{http_code}' "https://recruiter-radar.ru/tab-favicon-brand34-32" --max-time 30)
              tab48_code=$(curl -s -o /dev/null -w '%{http_code}' "https://recruiter-radar.ru/tab-favicon-brand34-48" --max-time 30)
              root_favicon_code=$(curl -s -o /dev/null -w '%{http_code}' "https://recruiter-radar.ru/favicon.ico" --max-time 30)
              apple_asset_code=$(curl -s -o /dev/null -w '%{http_code}' "https://recruiter-radar.ru/apple-icon-180?v=${BRAND_VERSION}" --max-time 30)
              echo "favicon assets: 16=$tab16_code 32=$tab32_code 48=$tab48_code root=$root_favicon_code apple=$apple_asset_code"

              if [ "$tab16_link_ok" = "true" ] && [ "$tab32_link_ok" = "true" ] \
                && [ "$tab48_link_ok" = "true" ] && [ "$apple_icon_ok" = "true" ] \
                && [ "$tab16_code" = "200" ] && [ "$tab32_code" = "200" ] \
                && [ "$tab48_code" = "200" ] && [ "$root_favicon_code" = "200" ] \
                && [ "$apple_asset_code" = "200" ]; then
                favicon_ok=true
              fi

              echo "landing_ok=$landing_ok brand_layout_ok=$brand_layout_ok favicon_ok=$favicon_ok (brand=$BRAND_VERSION)"
              if [ "$landing_ok" = "true" ] && [ "$brand_layout_ok" = "true" ] && [ "$favicon_ok" = "true" ]; then
                echo "Public endpoint, brand layout, and native rounded favicons are live"
                exit 0
              fi
            fi
            sleep 3
          done
          echo "Public deployment verification failed (last health status: $code)"
          exit 1

      - name: Verify public landing events route
        run: |
          curl \
            --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Origin: https://recruiter-radar.ru" \
            --data '{"name":"landing_viewed","context":"landing","dryRun":true}' \
            https://recruiter-radar.ru/api/landing-events

      - name: Rollback production deployment
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          ssh -p ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }} << 'SSH_EOF'
          set -euo pipefail
          cd /opt/recruiter-radar
          docker image inspect recruiter-radar:rollback > /dev/null
          docker tag recruiter-radar:rollback recruiter-radar:latest
          chmod 700 /opt/recruiter-radar/configure-notification-encryption.sh
          /opt/recruiter-radar/configure-notification-encryption.sh
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Rollback health check passed after ${i}x2s"
              exit 0
            fi
            sleep 2
          done
          echo "Rollback health check failed" >&2
          docker logs --tail 50 recruiter-radar-web-1 || true
          exit 1
          SSH_EOF
