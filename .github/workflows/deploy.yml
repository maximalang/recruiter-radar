name: Deploy

# Production deploy to Timeweb VDS. The workflow runs only for a successful
# Tests workflow triggered by a push to main and deploys that exact tested SHA.
# The image is transferred over SSH, so no container registry credentials are
# required. Secrets: RR_SSH_HOST, RR_SSH_PORT, RR_SSH_USER, RR_SSH_PRIVATE_KEY.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate deployment scripts
        run: |
          node --check scripts/deploy/verify-public-readiness.mjs
          bash -n scripts/deploy/configure-notification-encryption.sh
          bash -n scripts/deploy/configure-caddy-real-ip.sh
          bash -n scripts/deploy/rollback-guard.sh
          bash -n scripts/deploy/recover-deployment.sh
          bash -n scripts/deploy/run-commercial-signal-production-canary.sh
          sh -n scripts/deploy/validate-metrika-id.sh

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.RR_SSH_PORT }} -t ed25519 ${{ secrets.RR_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Refuse unresolved production recovery state
        run: |
          ssh -p ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }} << 'SSH_EOF'
          set -euo pipefail
          marker_path="/opt/recruiter-radar/.deployment-switched"
          if [ -e "$marker_path" ] || [ -L "$marker_path" ]; then
            echo "An unresolved deployment marker exists; recover it before another deploy." >&2
            exit 1
          fi
          SSH_EOF

      - name: Upload runtime configurator for preflight
        run: |
          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            scripts/deploy/configure-notification-encryption.sh \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}:/opt/recruiter-radar/configure-notification-encryption.${DEPLOY_SHA}.sh

      - name: Preflight production server configuration
        run: |
          ssh -p ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }} \
            "DEPLOY_SHA='${DEPLOY_SHA}' bash -s" << 'SSH_EOF'
          set -euo pipefail
          staged_configurator="/opt/recruiter-radar/configure-notification-encryption.${DEPLOY_SHA}.sh"
          chmod 700 "$staged_configurator"
          "$staged_configurator" --preflight
          SSH_EOF

      - name: Build immutable Docker image
        env:
          METRIKA_ID: ${{ vars.NEXT_PUBLIC_YANDEX_METRIKA_ID }}
        run: |
          sh scripts/deploy/validate-metrika-id.sh "$METRIKA_ID"
          docker build \
            --build-arg NEXT_PUBLIC_YANDEX_METRIKA_ID="$METRIKA_ID" \
            -f apps/web/Dockerfile \
            -t "recruiter-radar:${DEPLOY_SHA}" .

      - name: Save image as tarball
        run: |
          docker save "recruiter-radar:${DEPLOY_SHA}" | gzip > /tmp/recruiter-radar-image.tar.gz
          ls -lh /tmp/recruiter-radar-image.tar.gz

      - name: Upload image and deployment helper to server
        run: |
          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            /tmp/recruiter-radar-image.tar.gz \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}:/opt/recruiter-radar/image-${DEPLOY_SHA}.tar.gz
          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            scripts/deploy/rollback-guard.sh \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}:/opt/recruiter-radar/rollback-guard.${DEPLOY_SHA}.sh
          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            scripts/deploy/recover-deployment.sh \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}:/opt/recruiter-radar/recover-deployment.${DEPLOY_SHA}.sh
          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            scripts/deploy/configure-caddy-real-ip.sh \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}:/opt/recruiter-radar/configure-caddy-real-ip.${DEPLOY_SHA}.sh
          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            scripts/deploy/run-commercial-signal-production-canary.sh \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}:/opt/recruiter-radar/run-commercial-signal-production-canary.${DEPLOY_SHA}.sh
          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            scripts/deploy/run-government-source-sync.sh \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}:/opt/recruiter-radar/run-government-source-sync.${DEPLOY_SHA}.sh
          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            scripts/deploy/verify-source-production-runtime.sh \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}:/opt/recruiter-radar/verify-source-production-runtime.${DEPLOY_SHA}.sh

      - name: Deploy image with local rollback
        id: deploy
        run: |
          ssh -p ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }} \
            "DEPLOY_SHA='${DEPLOY_SHA}' bash -s" << 'SSH_EOF'
          set -Eeuo pipefail
          cd /opt/recruiter-radar
          deployment_marker="/opt/recruiter-radar/.deployment-switched"
          deployment_lock="/tmp/recruiter-radar-deployment.lock"
          staged_image="/opt/recruiter-radar/image-${DEPLOY_SHA}.tar.gz"
          staged_notification="/opt/recruiter-radar/configure-notification-encryption.${DEPLOY_SHA}.sh"
          staged_rollback_guard="/opt/recruiter-radar/rollback-guard.${DEPLOY_SHA}.sh"
          staged_recovery="/opt/recruiter-radar/recover-deployment.${DEPLOY_SHA}.sh"
          staged_caddy="/opt/recruiter-radar/configure-caddy-real-ip.${DEPLOY_SHA}.sh"
          staged_canary_runner="/opt/recruiter-radar/run-commercial-signal-production-canary.${DEPLOY_SHA}.sh"
          staged_government_runner="/opt/recruiter-radar/run-government-source-sync.${DEPLOY_SHA}.sh"
          staged_source_preflight="/opt/recruiter-radar/verify-source-production-runtime.${DEPLOY_SHA}.sh"

          cleanup_staged() {
            rm -f \
              "$staged_image" \
              "$staged_notification" \
              "$staged_rollback_guard" \
              "$staged_recovery" \
              "$staged_caddy" \
              "$staged_canary_runner" \
              "$staged_government_runner" \
              "$staged_source_preflight"
          }
          trap cleanup_staged EXIT

          exec 9> "$deployment_lock"
          if ! flock -w 180 9; then
            echo "Timed out waiting for the production deployment lock." >&2
            exit 1
          fi
          if [ -e "$deployment_marker" ] || [ -L "$deployment_marker" ]; then
            echo "An unresolved deployment marker exists; refusing server mutation." >&2
            exit 1
          fi
          mv "$staged_notification" /opt/recruiter-radar/configure-notification-encryption.sh
          mv "$staged_rollback_guard" /opt/recruiter-radar/rollback-guard.sh
          mv "$staged_recovery" /opt/recruiter-radar/recover-deployment.sh
          mv "$staged_caddy" /opt/recruiter-radar/configure-caddy-real-ip.sh
          mv "$staged_canary_runner" /opt/recruiter-radar/run-commercial-signal-production-canary.sh
          chmod 700 /opt/recruiter-radar/configure-caddy-real-ip.sh
          /opt/recruiter-radar/configure-caddy-real-ip.sh
          chmod 700 /opt/recruiter-radar/configure-notification-encryption.sh
          chmod 700 /opt/recruiter-radar/rollback-guard.sh
          chmod 700 /opt/recruiter-radar/recover-deployment.sh
          chmod 700 /opt/recruiter-radar/run-commercial-signal-production-canary.sh
          source /opt/recruiter-radar/rollback-guard.sh

          wait_for_health() {
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "Health check passed after ${i}x2s"
                curl -fsS http://localhost:3000/api/health
                return 0
              fi
              sleep 2
            done
            return 1
          }

          rollback() {
            EXPECTED_DEPLOY_SHA="$DEPLOY_SHA" \
              RR_DEPLOYMENT_MARKER="$deployment_marker" \
              RR_RECOVERY_LOCK="$deployment_lock" \
              RR_DEPLOYMENT_LOCK_HELD=true \
              /opt/recruiter-radar/recover-deployment.sh
          }

          current_container_state="$(
            docker inspect \
              --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
              recruiter-radar-web-1 2>/dev/null || true
          )"
          if [ "$current_container_state" != "running healthy" ]; then
            echo "Current production container is not running and healthy; refusing to record it for rollback." >&2
            exit 1
          fi
          if ! curl -fsS http://localhost:3000/api/health > /dev/null; then
            echo "Current production health endpoint failed; refusing to record its image for rollback." >&2
            exit 1
          fi

          previous_image_id="$(docker inspect --format '{{.Image}}' recruiter-radar-web-1 2>/dev/null || true)"
          if [ -z "$previous_image_id" ]; then
            echo "Previous production image is unavailable; refusing a non-recoverable switch" >&2
            exit 1
          fi
          docker image inspect "$previous_image_id" > /dev/null
          docker tag "$previous_image_id" recruiter-radar:rollback
          echo "Preserved rollback image $previous_image_id"

          echo "=== Reclaiming only safe Docker artifacts ==="
          docker container prune -f
          docker image prune -f

          # Each deploy tags a new recruiter-radar:<sha> image and never removes
          # the old ones, so they accumulate and exhaust the VDS disk (the d5d320f
          # deploy failed with "Insufficient disk space" this way). Drop every
          # <sha>-tagged image except the ones backing the live (:latest) and
          # rollback (:rollback) tags, then prune build cache. This keeps the
          # disk bounded across deploys without losing the rollback safety net.
          latest_image_id="$(
            docker image inspect --format '{{.Id}}' recruiter-radar:latest
          )"
          rollback_image_id="$(
            docker image inspect --format '{{.Id}}' recruiter-radar:rollback
          )"
          for image_ref in $(
            docker images \
              --filter 'reference=recruiter-radar:*' \
              --format '{{.Repository}}:{{.Tag}}' |
              awk '$0 !~ /:latest$/ && $0 !~ /:rollback$/'
          ); do
            candidate_image_id="$(
              docker image inspect --format '{{.Id}}' "$image_ref"
            )"
            case "$candidate_image_id" in
              "$latest_image_id" | "$rollback_image_id") : ;;
              *) docker rmi "$image_ref" 2>/dev/null || true ;;
            esac
          done
          docker builder prune -f 2>/dev/null || true

          archive_bytes="$(stat -c '%s' "$staged_image")"
          available_bytes="$(df -PB1 /opt/recruiter-radar | awk 'NR == 2 { print $4 }')"
          required_bytes="$((archive_bytes * 3 + 536870912))"
          if [ "$available_bytes" -lt "$required_bytes" ]; then
            echo "Insufficient disk space: ${available_bytes} bytes available, ${required_bytes} required" >&2
            exit 1
          fi

          echo "=== Validating production runtime configuration ==="
          /opt/recruiter-radar/configure-notification-encryption.sh --preflight

          echo "=== Loading immutable image ${DEPLOY_SHA} ==="
          docker load < "$staged_image"
          docker image inspect "recruiter-radar:${DEPLOY_SHA}" > /dev/null
          rollback_guard_write_marker \
            "$deployment_marker" \
            "$DEPLOY_SHA" \
            "$previous_image_id"
          rollback_guard_arm
          docker tag "recruiter-radar:${DEPLOY_SHA}" recruiter-radar:latest

          echo "=== Recreating web container ==="
          /opt/recruiter-radar/configure-notification-encryption.sh

          echo "=== Waiting for local health (up to 60s) ==="
          wait_for_health

          echo "=== Verifying production source runtime and schedules ==="
          install -m 700 "$staged_government_runner" \
            /opt/recruiter-radar/scripts/deploy/run-government-source-sync.sh
          install -m 700 "$staged_source_preflight" \
            /opt/recruiter-radar/scripts/deploy/verify-source-production-runtime.sh
          /opt/recruiter-radar/scripts/deploy/verify-source-production-runtime.sh
          rollback_guard_disarm
          SSH_EOF

      - name: Read brand version (single source of truth for the favicon gate)
        id: brand
        run: |
          BRAND_VERSION=$(grep -oE 'brandVersion = "brand-[0-9]+"' apps/web/app/layout.tsx \
            | grep -oE 'brand-[0-9]+' | head -1)
          if [ -z "$BRAND_VERSION" ]; then
            echo "Could not read brandVersion from apps/web/app/layout.tsx" >&2
            exit 1
          fi
          echo "Brand version: $BRAND_VERSION"
          echo "version=$BRAND_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify public HTTPS endpoint, brand layout, and native rounded favicons
        run: |
          BRAND_VERSION="${{ steps.brand.outputs.version }}"
          code=000
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://recruiter-radar.ru/api/health --max-time 30)
            echo "Public /api/health attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              landing_ok=false
              brand_layout_ok=false
              favicon_ok=false
              landing_html=$(curl -fsS https://recruiter-radar.ru/ --max-time 30 || true)

              if printf '%s' "$landing_html" \
                | grep -q 'data-deploy-anchor="recruiter-radar-landing-v3"'; then
                landing_ok=true
              fi

              if printf '%s' "$landing_html" \
                | grep -q 'data-brand-header="recruiter-radar"'; then
                brand_layout_ok=true
              fi

              tab16_link_ok=false
              tab32_link_ok=false
              tab48_link_ok=false
              apple_icon_ok=false
              if printf '%s' "$landing_html" \
                | grep -qE '<link[^>]*rel="icon"[^>]*href="/tab-icons/tab-icon-16.png\?v='"${BRAND_VERSION}"'"[^>]*>' \
                && printf '%s' "$landing_html" | grep -q 'sizes="16x16"'; then
                tab16_link_ok=true
              fi
              if printf '%s' "$landing_html" \
                | grep -qE '<link[^>]*rel="icon"[^>]*href="/tab-icons/tab-icon-32.png\?v='"${BRAND_VERSION}"'"[^>]*>' \
                && printf '%s' "$landing_html" | grep -q 'sizes="32x32"'; then
                tab32_link_ok=true
              fi
              if printf '%s' "$landing_html" \
                | grep -qE '<link[^>]*rel="icon"[^>]*href="/tab-icons/tab-icon-48.png\?v='"${BRAND_VERSION}"'"[^>]*>' \
                && printf '%s' "$landing_html" | grep -q 'sizes="48x48"'; then
                tab48_link_ok=true
              fi
              if printf '%s' "$landing_html" \
                | grep -qE '<link[^>]*rel="apple-touch-icon"[^>]*href="/app-icons/app-icon-180.png\?v='"${BRAND_VERSION}"'"[^>]*>' \
                && printf '%s' "$landing_html" | grep -q 'sizes="180x180"'; then
                apple_icon_ok=true
              fi

              tab16_code=$(curl -s -o /dev/null -w '%{http_code}' "https://recruiter-radar.ru/tab-icons/tab-icon-16.png?v=${BRAND_VERSION}" --max-time 30)
              tab32_code=$(curl -s -o /dev/null -w '%{http_code}' "https://recruiter-radar.ru/tab-icons/tab-icon-32.png?v=${BRAND_VERSION}" --max-time 30)
              tab48_code=$(curl -s -o /dev/null -w '%{http_code}' "https://recruiter-radar.ru/tab-icons/tab-icon-48.png?v=${BRAND_VERSION}" --max-time 30)
              root_favicon_code=$(curl -L -s -o /dev/null -w '%{http_code}' "https://recruiter-radar.ru/favicon.ico" --max-time 30)
              apple_asset_code=$(curl -s -o /dev/null -w '%{http_code}' "https://recruiter-radar.ru/app-icons/app-icon-180.png?v=${BRAND_VERSION}" --max-time 30)
              echo "favicon assets: 16=$tab16_code 32=$tab32_code 48=$tab48_code root=$root_favicon_code apple=$apple_asset_code"

              if [ "$tab16_link_ok" = "true" ] && [ "$tab32_link_ok" = "true" ] \
                && [ "$tab48_link_ok" = "true" ] && [ "$apple_icon_ok" = "true" ] \
                && [ "$tab16_code" = "200" ] && [ "$tab32_code" = "200" ] \
                && [ "$tab48_code" = "200" ] && [ "$root_favicon_code" = "200" ] \
                && [ "$apple_asset_code" = "200" ]; then
                favicon_ok=true
              fi

              echo "landing_ok=$landing_ok brand_layout_ok=$brand_layout_ok favicon_ok=$favicon_ok (brand=$BRAND_VERSION)"
              if [ "$landing_ok" = "true" ] && [ "$brand_layout_ok" = "true" ] && [ "$favicon_ok" = "true" ]; then
                echo "Public endpoint, brand layout, and native rounded favicons are live"
                exit 0
              fi
            fi
            sleep 3
          done
          echo "Public deployment verification failed (last health status: $code)"
          exit 1

      - name: Verify exact public readiness and critical routes
        run: node scripts/deploy/verify-public-readiness.mjs https://recruiter-radar.ru "$DEPLOY_SHA"

      - name: Verify public landing events route
        run: |
          curl \
            --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Origin: https://recruiter-radar.ru" \
            --data '{"name":"landing_viewed","context":"landing","dryRun":true}' \
            https://recruiter-radar.ru/api/landing-events

      - name: Finalize successful production deployment
        run: |
          ssh -p ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }} \
            "EXPECTED_DEPLOY_SHA='${DEPLOY_SHA}' bash -s" << 'SSH_EOF'
          set -euo pipefail
          source /opt/recruiter-radar/rollback-guard.sh
          rollback_guard_finalize \
            /opt/recruiter-radar/.deployment-switched \
            "$EXPECTED_DEPLOY_SHA"
          SSH_EOF

      - name: Cleanup staged preflight configurator
        if: always()
        run: |
          ssh -p ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }} \
            "DEPLOY_SHA='${DEPLOY_SHA}' bash -s" << 'SSH_EOF'
          set -euo pipefail
          staged_configurator="/opt/recruiter-radar/configure-notification-encryption.${DEPLOY_SHA}.sh"
          staged_canary_runner="/opt/recruiter-radar/run-commercial-signal-production-canary.${DEPLOY_SHA}.sh"
          staged_government_runner="/opt/recruiter-radar/run-government-source-sync.${DEPLOY_SHA}.sh"
          staged_source_preflight="/opt/recruiter-radar/verify-source-production-runtime.${DEPLOY_SHA}.sh"
          deployment_marker="/opt/recruiter-radar/.deployment-switched"
          if [ ! -e "$deployment_marker" ] && [ ! -L "$deployment_marker" ]; then
            rm -f -- "$staged_configurator"
            rm -f -- "$staged_canary_runner"
            rm -f -- "$staged_government_runner"
            rm -f -- "$staged_source_preflight"
          else
            echo "Deployment recovery is pending; preserving the staged preflight configurator."
          fi
          SSH_EOF

  rollback:
    name: Rollback production deployment
    needs: deploy
    if: >-
      ${{
        always() &&
        (
          needs.deploy.result == 'failure' ||
          needs.deploy.result == 'cancelled'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.RR_SSH_PORT }} -t ed25519 ${{ secrets.RR_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload isolated recovery helper
        run: |
          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            scripts/deploy/recover-deployment.sh \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}:/opt/recruiter-radar/recover-deployment.external.${DEPLOY_SHA}.sh

      - name: Recover marked deployment
        run: |
          ssh -p ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }} \
            "EXPECTED_DEPLOY_SHA='${DEPLOY_SHA}' bash -s" << 'SSH_EOF'
          set -euo pipefail
          marker_path="/opt/recruiter-radar/.deployment-switched"
          external_recovery="/opt/recruiter-radar/recover-deployment.external.${EXPECTED_DEPLOY_SHA}.sh"
          trap 'rm -f "$external_recovery"' EXIT
          chmod 700 /opt/recruiter-radar/configure-notification-encryption.sh
          chmod 700 "$external_recovery"
          EXPECTED_DEPLOY_SHA="$EXPECTED_DEPLOY_SHA" \
            RR_DEPLOYMENT_MARKER="$marker_path" \
            RR_RECOVERY_LOCK="/tmp/recruiter-radar-deployment.lock" \
            "$external_recovery"
          SSH_EOF
