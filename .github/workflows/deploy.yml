name: Deploy

# Autodeploy to Timeweb VDS (replaces Railway deploy).
# Runs after a push to main (the Tests workflow runs separately on the same push).
# Builds the standalone Next.js image on a fast CI runner, ships it as a tar to
# the VDS over SSH, loads it, and recreates the web container with a health check.
# No registry / PAT needed — image travels via scp. Secrets: RR_SSH_*.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment scripts
        run: bash -n scripts/deploy/configure-notification-encryption.sh

      - name: Build Docker image
        run: |
          docker build -f apps/web/Dockerfile -t recruiter-radar:latest .

      - name: Save image as tarball
        run: |
          docker save recruiter-radar:latest | gzip > /tmp/recruiter-radar-image.tar.gz
          ls -lh /tmp/recruiter-radar-image.tar.gz

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.RR_SSH_PORT }} -t ed25519 ${{ secrets.RR_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload image and deployment helper to server
        run: |
          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            /tmp/recruiter-radar-image.tar.gz \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}:/opt/recruiter-radar/image-new.tar.gz
          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            scripts/deploy/configure-notification-encryption.sh \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}:/opt/recruiter-radar/configure-notification-encryption.sh

      - name: Load image and recreate web container
        run: |
          ssh -p ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }} << 'SSH_EOF'
          set -euo pipefail
          echo "=== Freeing space from unused Docker artifacts ==="
          docker container prune -f
          docker image prune -af
          df -h /
          echo "=== Loading new image ==="
          docker load < /opt/recruiter-radar/image-new.tar.gz
          echo "=== Ensuring notification encryption and recreating web container ==="
          chmod 700 /opt/recruiter-radar/configure-notification-encryption.sh
          /opt/recruiter-radar/configure-notification-encryption.sh
          # Clean up the tarball to save disk
          rm -f /opt/recruiter-radar/image-new.tar.gz
          echo "=== Waiting for health (up to 60s) ==="
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Health check passed after ${i}x2s"
              curl -s http://localhost:3000/api/health
              exit 0
            fi
            sleep 2
          done
          echo "Health check FAILED — showing logs:"
          docker logs --tail 30 recruiter-radar-web-1
          exit 1
          SSH_EOF

      - name: Verify public HTTPS endpoint and native favicon
        run: |
          # Retry loop: Caddy may briefly 502 while the recreated web container
          # finishes booting (Next.js ready ~2-4s after container health passes).
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://recruiter-radar.ru/api/health --max-time 30)
            echo "Public /api/health attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              landing_ok=false
              inline_logo_ok=false
              favicon_ok=false

              landing_html=$(curl -fsS https://recruiter-radar.ru/ --max-time 30 || true)
              if printf '%s' "$landing_html" | grep -q "Компания и контакты"; then
                landing_ok=true
              fi
              if printf '%s' "$landing_html" | grep -q 'data-mark="true"' \
                && printf '%s' "$landing_html" | grep -q 'data-logo-mark="inline"'; then
                inline_logo_ok=true
              fi

              favicon_href=$(printf '%s' "$landing_html" \
                | grep -oE 'href="/icon[^\"]*"' \
                | head -n 1 \
                | cut -d'"' -f2 \
                | sed 's/&amp;/\&/g' || true)
              echo "favicon_href=$favicon_href"
              if [ -n "$favicon_href" ] \
                && curl -fsSL "https://recruiter-radar.ru${favicon_href}" --max-time 30 -o /tmp/recruiter-radar-favicon \
                && file /tmp/recruiter-radar-favicon | grep -q 'PNG image data'; then
                favicon_ok=true
              fi

              echo "landing_ok=$landing_ok inline_logo_ok=$inline_logo_ok favicon_ok=$favicon_ok"
              if [ "$landing_ok" = "true" ] && [ "$inline_logo_ok" = "true" ] && [ "$favicon_ok" = "true" ]; then
                echo "Public endpoint, inline logo, and native Next favicon are live"
                exit 0
              fi
            fi
            sleep 3
          done
          echo "Public deployment verification failed (last health status: $code)"
          exit 1
