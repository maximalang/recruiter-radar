name: Diagnose prod landing (throwaway)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch prod landing + health and print bodies
        run: |
          set +e
          echo "=== /api/health ==="
          curl -sS -i --max-time 30 https://recruiter-radar.ru/api/health || true
          echo ""
          echo "=== / (status + first 4000 bytes of body) ==="
          curl -sS -i --max-time 30 https://recruiter-radar.ru/ -o /tmp/landing.html -w "HTTP %{http_code} bytes %{size_download}\n" || true
          echo "--- body head ---"
          head -c 4000 /tmp/landing.html 2>/dev/null || true
          echo ""
          echo "=== grep checks ==="
          grep -c "Компания и контакты" /tmp/landing.html 2>/dev/null || echo "string not found"

      - name: SSH to VDS, provoke landing render, capture container error log
        run: |
          set +e
          mkdir -p ~/.ssh
          echo "${{ secrets.RR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.RR_SSH_PORT }} -t ed25519 ${{ secrets.RR_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }} << 'SSH_EOF'
          set +e
          echo "=== provoking landing render x3 to surface the error ==="
          for i in 1 2 3; do curl -sS -o /dev/null -w "local / attempt $i -> HTTP %{http_code}\n" http://localhost:3000/ ; done
          echo "=== docker logs (last 120 lines) ==="
          docker logs --tail 120 recruiter-radar-web-1 2>&1
          SSH_EOF
