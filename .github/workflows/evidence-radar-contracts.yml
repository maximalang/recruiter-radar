name: Commercial Signal + Evidence Radar Contracts

on:
  push:
    branches:
      - 'codex/evidence-radar-system'
      - 'codex/commercial-signal-evidence-integration'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commercial-signal-evidence-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type check application
        run: npm run web:check
      - name: Type check tests
        run: npm run test:types --workspace @recruiter-radar/web
      - name: Apply migration chain
        run: node packages/db/scripts/migrate.mjs
      - name: Validate database schema
        run: npm run db:validate
      - name: Verify Company Events PostgreSQL runtime
        run: npm run test:company-events-v1:db
      - name: Verify Company State PostgreSQL runtime
        run: npm run test:company-state-v1:db
      - name: Verify Signal Episodes PostgreSQL runtime
        run: npm run test:signal-episodes-v2:db
      - name: Verify Commercial Theses PostgreSQL runtime
        run: npm run test:commercial-theses-v1:db
      - name: Verify External Agency Propensity PostgreSQL runtime
        run: npm run test:external-agency-propensity-v1:db
      - name: Verify Agency DNA PostgreSQL runtime
        run: npm run test:agency-dna-match-v2:db
      - name: Verify Opportunity Scoring v3 PostgreSQL runtime
        run: npm run test:opportunity-scoring-v3:db
      - name: Verify Query Planner v2 PostgreSQL runtime
        run: npm run test:query-planner-v2:db
      - name: Verify Commercial Signal evaluation and contract matrix
        run: |
          set -euo pipefail
          npm run test:commercial-signal:evaluation
          node --test packages/db/scripts/lib/commercial-signal-baseline-metrics.test.mjs
          npm run test:commercial-signal:canary
          npm run test:commercial-signal:evaluation:db
          npm run test:commercial-signal:contracts
      - name: Verify authoritative Today, event support, and adaptive supply
        run: >-
          npm test --workspace @recruiter-radar/web -- --runInBand --runTestsByPath
          src/__tests__/lib/opportunities/commercial-signal-today.test.ts
          src/__tests__/lib/opportunities/company-event-support-registry.test.ts
          src/__tests__/lib/lead-discovery/query-planner-v2-yield.test.ts
          src/__tests__/scripts/commercial-signal-runtime-migration.test.ts
      - name: Run Evidence Radar unit and surface contracts
        run: >-
          npm test --workspace @recruiter-radar/web -- --runInBand --runTestsByPath
          src/__tests__/lib/intelligence/evidence-radar.test.ts
          src/__tests__/lib/intelligence/evidence-radar-config.test.ts
          src/__tests__/lib/intelligence/evidence-radar-repository.test.ts
          src/__tests__/scripts/evidence-radar-migration.test.ts
          src/__tests__/app/evidence-radar-surface-contract.test.ts
      - name: Verify isolated Evidence Radar PostgreSQL runtime
        run: node packages/db/scripts/run-evidence-radar-v1-db-tests.mjs
      - name: Verify Commercial Signal migration round-trip
        run: node packages/db/scripts/verify-commercial-signal-migration-roundtrip.mjs
      - name: Verify rollback safety
        run: npm run test:opportunity-engine:down
      - name: Build production web application
        env:
          NEXT_PUBLIC_YANDEX_METRIKA_ID: '12345678'
        run: npm run web:build
