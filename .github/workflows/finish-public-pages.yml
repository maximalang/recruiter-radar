name: Finish public legal pages

on:
  push:
    branches: [feat/robokassa-primary-billing]
    paths:
      - '.github/workflows/finish-public-pages.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/robokassa-primary-billing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Align offer and privacy policy with completed checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrences, found {actual}: {old[:90]!r}')
              text = text.replace(old, new, count)
              p.write_text(text)

          privacy = 'apps/web/app/privacy/page.tsx'
          replace(
              privacy,
              'import { PageFrame, SectionIntro } from "../ui/page-primitives";\nimport { SiteFooter } from "../ui/site-footer";',
              'import { PageFrame, SectionIntro } from "../ui/page-primitives";\nimport { LegalDocumentNav } from "../ui/legal-document-nav";\nimport { SiteFooter } from "../ui/site-footer";',
          )
          replace(
              privacy,
              '      <section className={s.docSection}>\n        <SectionIntro',
              '      <section className={s.docSection}>\n        <LegalDocumentNav current="/privacy" />\n        <SectionIntro',
          )
          replace(
              privacy,
              '        </p>\n\n        <div className={s.docBody}>',
              '''        </p>\n\n        <div className={s.docSummary}>\n          <Summary label="Оператор" value={`Самозанятый · ${OPERATOR_REQUISITES.city}`} />\n          <Summary label="Контакт" value={OPERATOR_REQUISITES.email} />\n          <Summary label="Ответ на запрос" value="10 рабочих дней" />\n        </div>\n\n        <p className={s.docCallout}>\n          <strong>Коротко:</strong> обязательные данные используются для аккаунта, договора, оплаты, чека и безопасности. Яндекс Метрика включается только после отдельного выбора, Telegram — только после отдельного подключения.\n        </p>\n\n        <div className={s.docBody}>''',
          )
          replace(
              privacy,
              '<p>Оператор не принимает решения, порождающие юридические последствия для пользователя, исключительно на основании автоматизированной обработки персональных данных.</p>',
              '''<p>Оператор не принимает решения, порождающие юридические последствия для пользователя, исключительно на основании автоматизированной обработки персональных данных.</p>\n            <p>Оператор обязан обеспечивать законность и безопасность обработки, публиковать актуальную Политику, отвечать на обращения субъектов, уточнять неточные данные и прекращать неправомерную обработку. Пользователь обязан предоставлять достоверные сведения и не передавать данные третьих лиц без законного основания или полномочия.</p>''',
          )
          replace(
              privacy,
              'e-mail покупателя, журнал принятия документов, номер и ссылка на чек НПД.',
              'e-mail покупателя, тип плательщика и ИНН покупателя-ООО/ИП, журнал принятия документов, номер и ссылка на чек НПД.',
          )
          replace(
              privacy,
              '<li><strong>ООО «РОБОКАССА», Россия:</strong> платёжная форма, подтверждение операции и возвраты.</li>',
              '<li><strong>ООО «РОБОКАССА» (ИНН 5047063929), Россия:</strong> платёжная форма, подтверждение операции и возвраты.</li>',
          )
          replace(
              privacy,
              'Резервные копии не используются для обычной работы и перезаписываются в установленном цикле не позднее 90 дней, кроме копий, изолированных для расследования инцидента или выполнения закона.',
              'Резервные копии не используются для обычной работы и удаляются либо перезаписываются в пределах установленного оператором цикла резервного копирования. Исключение составляют изолированные копии, необходимые для расследования инцидента или выполнения закона.',
          )
          replace(
              privacy,
              'function PolicySection({ n, title, children }: { n: string; title: string; children: React.ReactNode }) {',
              '''function Summary({ label, value }: { label: string; value: string }) {\n  return <div className={s.docSummaryItem}><span className={s.docSummaryLabel}>{label}</span><span className={s.docSummaryValue}>{value}</span></div>;\n}\n\nfunction PolicySection({ n, title, children }: { n: string; title: string; children: React.ReactNode }) {''',
          )

          terms = 'apps/web/app/terms/page.tsx'
          replace(
              terms,
              'import { PageFrame, SectionIntro } from "../ui/page-primitives";\nimport { SiteFooter } from "../ui/site-footer";',
              'import { PageFrame, SectionIntro } from "../ui/page-primitives";\nimport { LegalDocumentNav } from "../ui/legal-document-nav";\nimport { SiteFooter } from "../ui/site-footer";',
          )
          replace(
              terms,
              '      <section className={s.docSection}>\n        <SectionIntro',
              '      <section className={s.docSection}>\n        <LegalDocumentNav current="/terms" />\n        <SectionIntro',
          )
          replace(
              terms,
              '        </p>\n\n        <div className={s.docBody}>',
              '''        </p>\n\n        <div className={s.docSummary}>\n          <Summary label="Оплата" value="Разовая · без автосписаний" />\n          <Summary label="Доступ" value="7, 30 или 90 дней" />\n          <Summary label="Продавец" value={`Самозанятый · ${OPERATOR_REQUISITES.city}`} />\n        </div>\n\n        <p className={s.docCallout}>\n          <strong>Существенные условия:</strong> до оплаты заказчик видит точную цену и срок; доступ активируется только после серверного подтверждения Robokassa; карта не сохраняется.\n        </p>\n\n        <div className={s.docBody}>''',
          )
          replace(
              terms,
              '<p>Отдельное согласие на обработку персональных данных не объединяется с акцептом оферты.</p>',
              '''<p>Отдельное согласие на обработку персональных данных не объединяется с акцептом оферты.</p>\n            <p>Заказчиком может быть физическое лицо, самозанятый, ИП или организация. Представитель организации подтверждает наличие полномочий на оформление заказа и указание её реквизитов.</p>''',
          )
          replace(
              terms,
              '<p>По каждому полученному расчёту формируется чек через «Мой налог» или подключённый сервис «Робочеки СМЗ». Чек направляется по предоставленному заказчиком электронному контакту. При возврате выполняется необходимая корректировка чека.</p>',
              '<p>По каждому полученному расчёту формируется чек через «Мой налог» или подключённый сервис «Робочеки СМЗ». Чек направляется по предоставленному заказчиком электронному контакту. Для ООО или ИП заказчик указывает ИНН покупателя. При возврате выполняется необходимая корректировка чека.</p>',
          )
          replace(
              terms,
              '<li>Заказчик отдельно принимает оферту и даёт необходимое согласие на обработку данных.</li>',
              '<li>Заказчик выбирает тип плательщика, при оплате от ООО/ИП указывает ИНН, отдельно принимает оферту и даёт необходимое согласие на обработку данных.</li>',
          )
          replace(
              terms,
              '''            <p>Если доступ не предоставлен по вине исполнителя, производится полный возврат. После начала оказания услуги размер возврата определяется с учётом фактически предоставленного периода, причины обращения и обязательных прав заказчика.</p>\n            <p>Запрос направляется на <a href={`mailto:${OPERATOR_REQUISITES.email}`} className={s.docLink}>{OPERATOR_REQUISITES.email}</a> с указанием e-mail аккаунта, номера заказа, даты и суммы платежа. Возврат может быть полным или частичным и проводится через Robokassa на исходный способ оплаты, когда это технически возможно.</p>''',
              '''            <p>Если доступ не активирован, услуга не предоставлена по вине исполнителя либо подтверждён ошибочный или повторный платёж, производится полный возврат.</p>\n            <p>При добровольном отказе после активации возврат рассчитывается пропорционально полным неиспользованным календарным дням оплаченного периода. День активации и день обращения считаются использованными, если доступ был доступен. Это правило не ограничивает обязательные права заказчика.</p>\n            <p>Запрос направляется на <a href={`mailto:${OPERATOR_REQUISITES.email}`} className={s.docLink}>{OPERATOR_REQUISITES.email}</a> с указанием e-mail аккаунта, номера заказа, даты и суммы платежа. Решение и инициирование одобренного возврата выполняются не позднее 10 календарных дней, если закон не требует более короткого срока.</p>''',
          )
          replace(
              terms,
              'function TermsSection({ n, title, children }: { n: string; title: string; children: React.ReactNode }) {',
              '''function Summary({ label, value }: { label: string; value: string }) {\n  return <div className={s.docSummaryItem}><span className={s.docSummaryLabel}>{label}</span><span className={s.docSummaryValue}>{value}</span></div>;\n}\n\nfunction TermsSection({ n, title, children }: { n: string; title: string; children: React.ReactNode }) {''',
          )

          criteria = 'apps/web/scripts/verify-robokassa-site-criteria.mjs'
          replace(
              criteria,
              '  "OPERATOR_REQUISITES.email",\n]) requireText("terms", token, `offer requirement ${token}`);',
              '  "OPERATOR_REQUISITES.email",\n  "ИНН покупателя",\n  "LegalDocumentNav",\n]) requireText("terms", token, `offer requirement ${token}`);',
          )
          replace(
              criteria,
              '  "OPERATOR_REQUISITES.email",\n]) requireText("privacy", token, `privacy policy requirement ${token}`);',
              '  "OPERATOR_REQUISITES.email",\n  "ИНН покупателя-ООО/ИП",\n  "ООО «РОБОКАССА» (ИНН 5047063929)",\n  "цикла резервного копирования",\n  "LegalDocumentNav",\n]) requireText("privacy", token, `privacy policy requirement ${token}`);',
          )
          replace(
              criteria,
              '  \'name="acceptPersonalData"\',\n  \'href="/terms"\',',
              '  \'name="acceptPersonalData"\',\n  \'name="payerType"\',\n  \'name="buyerInn"\',\n  \'href="/terms"\',',
          )
          replace(
              criteria,
              '  "Robokassa",\n]) requireText("checkout", token, `checkout requirement ${token}`);',
              '  "Robokassa",\n  "ИНН покупателя",\n  "paymentAndRefundRevision",\n]) requireText("checkout", token, `checkout requirement ${token}`);',
          )

          Path('.github/workflows/finish-public-pages.yml').unlink()
          PY
          npm ci
          npm run web:check
          npm run payments:robokassa:site-criteria --workspace @recruiter-radar/web
          git add apps/web/app/privacy/page.tsx apps/web/app/terms/page.tsx apps/web/scripts/verify-robokassa-site-criteria.mjs .github/workflows/finish-public-pages.yml
          git config user.name 'Recruiter Radar CI'
          git config user.email 'support@recruiter-radar.ru'
          git commit -m 'feat: finish public legal pages'
          git push origin HEAD:feat/robokassa-primary-billing
