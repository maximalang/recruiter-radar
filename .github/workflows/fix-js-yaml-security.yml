name: Fix js-yaml security lock

on:
  push:
    branches: [ codex/evidence-radar-system ]

concurrency:
  group: fix-js-yaml-security
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix-lock:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/evidence-radar-system
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore dependency metadata and apply exact security patch
        shell: bash
        run: |
          set -euo pipefail
          base=e356c95cc1e6d6afcbb4b1de5b7ca5b6e3ed38d0
          git show "$base:package.json" > /tmp/base-package.json
          git show "$base:package-lock.json" > /tmp/base-package-lock.json
          cp /tmp/base-package.json package.json
          cp /tmp/base-package-lock.json package-lock.json
          python - <<'PY'
          from pathlib import Path
          path = Path('package-lock.json')
          text = path.read_text()
          old = '''      "version": "3.15.0",\n      "resolved": "https://registry.npmjs.org/js-yaml/-/js-yaml-3.15.0.tgz",\n      "integrity": "sha512-ttBQIIQPDeLjpPOohtUdXuXUVoA2uIB6fEH9HyJ7234s5mBJ5wTx20njxplLZQgLaOfpmPQA7X2t5AX6tIPbog==",'''
          new = '''      "version": "3.15.1",\n      "resolved": "https://registry.npmjs.org/js-yaml/-/js-yaml-3.15.1.tgz",\n      "integrity": "sha512-S99WuO3HlhO3XN41EtYUNl9zzXjoJx7QvmipxsJVxtCBT0YHEFy+iOJhjSvrmV12nYhWpZaM8lPHkJm0yUMbag==",'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one vulnerable js-yaml lock entry, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          cmp -s /tmp/base-package.json package.json
          set +e
          git diff --no-index --numstat /tmp/base-package-lock.json package-lock.json > /tmp/js-yaml-numstat
          diff_status=$?
          set -e
          test "$diff_status" -eq 1
          test "$(awk '{print $1":"$2}' /tmp/js-yaml-numstat)" = "3:3"
          git diff --check -- package.json package-lock.json
      - name: Verify patched install and production dependency audit
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit exact cumulative dependency patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): narrow js-yaml lock patch"
          git push origin HEAD:codex/evidence-radar-system
