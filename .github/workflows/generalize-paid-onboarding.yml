name: Generalize paid plan onboarding

on:
  push:
    branches: [feat/robokassa-primary-billing]
    paths:
      - '.github/workflows/generalize-paid-onboarding.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/robokassa-primary-billing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Remove legacy pilot-only onboarding gates
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('apps/web/lib/payments.ts')
          text = path.read_text()
          old_readiness = '''  if (!order || order.productCode !== "pilot") {
              return null;
            }'''.replace('            ', '')
          new_readiness = '''  if (!order) {
              return null;
            }'''.replace('            ', '')
          if old_readiness not in text:
              raise SystemExit('readiness pilot-only gate not found')
          text = text.replace(old_readiness, new_readiness, 1)
          old_gate = '''  if (order.productCode !== "pilot") {
              throw new Error(CUSTOMER_CHECKOUT_COPY.pilotOnly);
            }

'''.replace('            ', '')
          count = text.count(old_gate)
          if count != 4:
              raise SystemExit(f'expected 4 onboarding pilot-only gates, found {count}')
          text = text.replace(old_gate, '')
          path.write_text(text)
          PY
          npm ci
          npm run web:check
          npm test --workspace @recruiter-radar/web -- --runInBand --testPathPattern='payments|checkout'
          rm -f .github/workflows/generalize-paid-onboarding.yml
          git add apps/web/lib/payments.ts .github/workflows/generalize-paid-onboarding.yml
          git config user.name 'Recruiter Radar CI'
          git config user.email 'support@recruiter-radar.ru'
          git commit -m 'fix: allow onboarding for every paid plan'
          git push origin HEAD:feat/robokassa-primary-billing
