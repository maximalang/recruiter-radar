name: Hardening smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.pull_request.title != 'Temporary CI trigger: Codex Switcher Hardened'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
        run: node packages/db/scripts/migrate.mjs
      - name: Run strongest available smoke chain
        shell: bash
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
        run: |
          set +e
          npm run verify:smoke > /tmp/smoke-output.log 2>&1
          status=$?
          cat /tmp/smoke-output.log
          exit "$status"
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardening-smoke-report
          path: /tmp/smoke-output.log
          if-no-files-found: error
          retention-days: 7

  build-codex-switcher-hardened:
    if: github.event.pull_request.title == 'Temporary CI trigger: Codex Switcher Hardened'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch isolated build payload
        shell: pwsh
        run: git clone --depth 1 --branch build/codex-switcher-hardened-0.3.0 https://github.com/maximalang/site.git payload

      - name: Build and test Hardened 0.3.1
        shell: pwsh
        run: '& .\payload\codex-build\build-0.3.1.ps1'

      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Switcher-Hardened-0.3.1-Windows-x64
          path: deliverables
          if-no-files-found: error
          retention-days: 7
