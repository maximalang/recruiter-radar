name: Hardening smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
        run: node packages/db/scripts/migrate.mjs
      - name: Run strongest available smoke chain
        shell: bash
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
        run: |
          set +e
          npm run verify:smoke > /tmp/smoke-output.log 2>&1
          status=$?
          cat /tmp/smoke-output.log
          exit "$status"
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardening-smoke-report
          path: /tmp/smoke-output.log
          if-no-files-found: error
          retention-days: 7

  dependency-remediation-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate secure package metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.dependencies = {
            ...(packageJson.dependencies || {}),
            'brace-expansion': '5.0.9',
          };
          packageJson.overrides = {
            ...(packageJson.overrides || {}),
            'brace-expansion': '5.0.9',
            'ip-address': '10.3.1',
          };
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts
          npm update ip-address --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
          mkdir -p /tmp/pr-148-remediation
          cp package.json package-lock.json /tmp/pr-148-remediation/
      - name: Upload dependency remediation
        uses: actions/upload-artifact@v4
        with:
          name: pr-148-dependency-remediation
          path: /tmp/pr-148-remediation
          if-no-files-found: error
          retention-days: 1
