name: HH Employer Identity Contract

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hh-employer-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify HH employer detail cache and identity persistence
        run: |
          node --test packages/db/scripts/adapters/hh-employer-enrichment.test.mjs
          node --test packages/db/scripts/adapters/hh-employer-identity-persistence.test.mjs
          node --check packages/db/scripts/enrich-hh-employer-identities.mjs
