name: HH Production Secret Sync

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hh-production-secret-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate HH runtime configurator
        run: bash -n scripts/deploy/configure-hh-runtime.sh

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.RR_SSH_PORT }} -t ed25519 ${{ secrets.RR_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Stage HH application token and configurator
        env:
          HH_ACCESS_TOKEN: ${{ secrets.HH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HH_ACCESS_TOKEN:-}" ]; then
            echo 'HH_ACCESS_TOKEN repository secret is missing.' >&2
            exit 1
          fi

          umask 077
          token_file="/tmp/hh-token-${DEPLOY_SHA}.b64"
          printf '%s' "$HH_ACCESS_TOKEN" | base64 -w0 > "$token_file"
          unset HH_ACCESS_TOKEN

          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            "$token_file" \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}:/opt/recruiter-radar/.hh-token-${DEPLOY_SHA}.b64
          rm -f "$token_file"

          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            scripts/deploy/configure-hh-runtime.sh \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}:/opt/recruiter-radar/configure-hh-runtime.${DEPLOY_SHA}.sh

      - name: Configure and live-verify HH production runtime
        run: |
          ssh -p ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }} \
            "DEPLOY_SHA='${DEPLOY_SHA}' bash -s" <<'SSH_EOF'
          set -euo pipefail
          staged_configurator="/opt/recruiter-radar/configure-hh-runtime.${DEPLOY_SHA}.sh"
          staged_token="/opt/recruiter-radar/.hh-token-${DEPLOY_SHA}.b64"

          cleanup() {
            rm -f "$staged_configurator" "$staged_token"
          }
          trap cleanup EXIT

          test -f "$staged_configurator" || { echo 'Staged HH configurator is missing.' >&2; exit 1; }
          test -f "$staged_token" || { echo 'Staged HH token is missing.' >&2; exit 1; }
          chmod 700 "$staged_configurator"
          "$staged_configurator" --token-file "$staged_token"

          install -m 700 "$staged_configurator" /opt/recruiter-radar/scripts/deploy/configure-hh-runtime.sh
          SSH_EOF
