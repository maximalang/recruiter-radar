name: Notification typecheck diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/notification-typecheck-diagnostics.yml'
      - 'apps/web/app/api/cron/notification-delivery-retry/**'
      - 'apps/web/app/profile/notification-actions.ts'
      - 'apps/web/lib/notification-connection-operations.ts'
      - 'apps/web/lib/notification-dispatch.ts'
      - 'apps/web/lib/notification-providers.ts'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run concise typecheck
        shell: bash
        run: |
          if npm run web:check > /tmp/typecheck.log 2>&1; then
            echo "Typecheck passed"
          else
            echo "--- TypeScript errors (tail) ---"
            tail -n 120 /tmp/typecheck.log
            exit 1
          fi
