name: One-shot final landing polish

on:
  push:
    branches:
      - codex/post-merge-design-polish
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-final-blockers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/post-merge-design-polish
          fetch-depth: 0
      - name: Fix history audit synchronization and remove dead radar CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          audit_path = Path('apps/web/scripts/verify-landing-production.mjs')
          audit = audit_path.read_text()
          old_history = (
              '  await page.goBack();\n'
              '  assert.match(page.url(), /#scene-workspace$/);\n'
              '  await page.goForward();\n'
              '  assert.match(page.url(), /#scene-evidence$/);'
          )
          new_history = (
              '  await Promise.all([\n'
              '    page.waitForURL(/#scene-workspace$/),\n'
              '    page.goBack(),\n'
              '  ]);\n'
              '  assert.match(page.url(), /#scene-workspace$/);\n'
              '  await Promise.all([\n'
              '    page.waitForURL(/#scene-evidence$/),\n'
              '    page.goForward(),\n'
              '  ]);\n'
              '  assert.match(page.url(), /#scene-evidence$/);'
          )
          if old_history not in audit:
              raise SystemExit('history assertion block not found')
          audit_path.write_text(audit.replace(old_history, new_history, 1))

          css_path = Path('apps/web/app/landing/landing.module.css')
          css = css_path.read_text()
          dead_blocks = [
              '.instrumentGuides path { stroke: rgba(155, 203, 187, .16); stroke-width: 1; stroke-dasharray: 2 16; }\n',
              '.instrumentConnection { fill: none; stroke: url(#instrument-link); stroke-width: 1.2; stroke-dasharray: 4 9; }\n',
              '.instrumentCore circle:first-child { fill: rgba(169, 215, 200, .82); }\n.instrumentCore circle:last-child { fill: none; stroke: rgba(169, 215, 200, .35); }\n',
          ]
          for block in dead_blocks:
              if block not in css:
                  raise SystemExit(f'dead radar CSS block not found: {block!r}')
              css = css.replace(block, '', 1)
          css_path.write_text(css)

          test_path = Path('apps/web/src/__tests__/app/landing-visual-polish.test.ts')
          test = test_path.read_text()
          old_test = (
              '    const hero = source("app/landing/hero-instrument.tsx");\n'
              '    const compatibilityRadar = source("app/landing/brand-glyphs.tsx");\n\n'
              '    expect(hero).not.toContain("instrumentConnection");'
          )
          new_test = (
              '    const hero = source("app/landing/hero-instrument.tsx");\n'
              '    const heroStyles = source("app/landing/landing.module.css");\n'
              '    const compatibilityRadar = source("app/landing/brand-glyphs.tsx");\n\n'
              '    expect(hero).not.toContain("instrumentConnection");'
          )
          if old_test not in test:
              raise SystemExit('hero contract insertion point not found')
          test = test.replace(old_test, new_test, 1)
          old_assert = '    expect(compatibilityRadar).not.toContain("styles.instrumentCore");'
          new_assert = (
              '    expect(compatibilityRadar).not.toContain("styles.instrumentCore");\n'
              '    expect(heroStyles).not.toContain(".instrumentGuides");\n'
              '    expect(heroStyles).not.toContain(".instrumentConnection");\n'
              '    expect(heroStyles).not.toContain(".instrumentCore");'
          )
          if old_assert not in test:
              raise SystemExit('hero CSS contract insertion point not found')
          test_path.write_text(test.replace(old_assert, new_assert, 1))
          PY
      - name: Verify targeted contract
        run: npm ci && npm test --workspace @recruiter-radar/web -- --runInBand landing-visual-polish.test.ts
      - name: Commit final fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/scripts/verify-landing-production.mjs apps/web/app/landing/landing.module.css apps/web/src/__tests__/app/landing-visual-polish.test.ts
          git commit -m "fix(landing): stabilize history audit and remove dead radar styles"
          for attempt in 1 2 3; do
            git fetch origin codex/post-merge-design-polish
            git rebase origin/codex/post-merge-design-polish
            if git push origin HEAD:codex/post-merge-design-polish; then
              exit 0
            fi
            sleep 2
          done
          exit 1
