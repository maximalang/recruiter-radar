name: One-shot preview ready selector fix

on:
  push:
    branches:
      - codex/post-merge-design-polish

permissions:
  contents: write

jobs:
  patch-selector:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/post-merge-design-polish
          fetch-depth: 0
      - name: Patch only the stale ready selector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/scripts/verify-landing-production.mjs')
          source = path.read_text()
          old = 'await page.locator("#preview-results[data-preview-results-ready]").waitFor({ state: "attached" });'
          new = 'await page.locator("#preview-results [data-preview-results-ready]").waitFor({ state: "attached" });'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale ready selector, found {count}')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          git diff -- apps/web/scripts/verify-landing-production.mjs
      - name: Commit focused audit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/scripts/verify-landing-production.mjs
          git commit -m "test(landing): follow stable preview ready descendant"
          git fetch origin codex/post-merge-design-polish
          git rebase origin/codex/post-merge-design-polish
          git push origin HEAD:codex/post-merge-design-polish
