name: One-shot responsive matrix fix

on:
  push:
    branches:
      - codex/post-merge-design-polish

permissions:
  contents: write

jobs:
  patch-matrix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/post-merge-design-polish
          fetch-depth: 0
      - name: Expand responsive and legal route coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify-responsive-surfaces.mjs')
          text = path.read_text()

          old_routes = "  '/terms',\n  '/auth/verify',"
          new_routes = "  '/terms',\n  '/offer',\n  '/payment-and-refund',\n  '/auth/verify',"
          if text.count(old_routes) != 1:
              raise SystemExit('route insertion anchor changed')
          text = text.replace(old_routes, new_routes)

          old_viewports = """const viewports = [
            { name: 'mobile-320', width: 320, height: 720 },
            { name: 'mobile-390', width: 390, height: 844 },
            { name: 'tablet-768', width: 768, height: 1024 },
            { name: 'desktop-1440', width: 1440, height: 1000 },
          ];"""
          new_viewports = """const viewports = [
            { name: 'mobile-320', width: 320, height: 720 },
            { name: 'mobile-360', width: 360, height: 800 },
            { name: 'mobile-390', width: 390, height: 844 },
            { name: 'tablet-768', width: 768, height: 1024 },
            { name: 'tablet-1024', width: 1024, height: 768 },
            { name: 'desktop-1440', width: 1440, height: 900 },
          ];"""
          if text.count(old_viewports) != 1:
              raise SystemExit('viewport matrix anchor changed')
          text = text.replace(old_viewports, new_viewports)
          path.write_text(text)
          PY
      - name: Commit final matrix without the one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/one-shot-responsive-matrix-fix.yml
          git add scripts/verify-responsive-surfaces.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(ui): cover required responsive and legal surfaces"
          git fetch origin codex/post-merge-design-polish
          git rebase origin/codex/post-merge-design-polish
          git push origin HEAD:codex/post-merge-design-polish
