name: Operator Auth Client Defaults Patch

on:
  push:
    branches: [codex/operator-mcp-local-oidc]
    paths: [.github/workflows/operator-auth-client-defaults-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/operator-mcp-local-oidc
      - run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('operator-auth/src/server.js'); s=p.read_text()
          old="""    clientDefaults: {\n      token_endpoint_auth_method: 'none',\n      response_types: ['code'],\n      grant_types: ['authorization_code', 'refresh_token'],\n    },"""
          new="""    clientDefaults: {\n      token_endpoint_auth_method: 'none',\n      id_token_signed_response_alg: 'ES256',\n      response_types: ['code'],\n      grant_types: ['authorization_code', 'refresh_token'],\n    },\n    allowOmittingSingleRegisteredRedirectUri: false,"""
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git add operator-auth/src/server.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(operator-auth): use strict ES256 client defaults'
          git push origin HEAD:codex/operator-mcp-local-oidc
