name: Operator Auth ES256 Patch

on:
  push:
    branches: [codex/operator-mcp-local-oidc]
    paths: [.github/workflows/operator-auth-es256-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/operator-mcp-local-oidc
      - name: Apply provider signing profile
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('operator-auth/src/server.js')
          s=p.read_text()
          old="""      registration: { enabled: true },"""
          new="""      registration: { enabled: true, issueRegistrationAccessToken: false },"""
          assert old in s
          s=s.replace(old,new,1)
          old="""    interactions: {"""
          new="""    idTokenSigningAlgValues: ['ES256'],\n    interactions: {"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          git add operator-auth/src/server.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(operator-auth): constrain provider signing to ES256'
          git push origin HEAD:codex/operator-mcp-local-oidc
