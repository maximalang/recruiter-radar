name: Operator Auth Listen Fix

on:
  push:
    branches: [codex/operator-mcp-local-oidc]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/operator-mcp-local-oidc
          fetch-depth: 0
      - name: Fix container listener
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('operator-auth/src/server.js')
          text = path.read_text()
          old = "server.listen(3002, '127.0.0.1', () => safeAudit('service_started', { status: 'ready' }))"
          new = "server.listen(3002, '0.0.0.0', () => safeAudit('service_started', { status: 'ready' }))"
          if text.count(old) != 1:
              raise SystemExit(f'expected one listener anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operator-auth/src/server.js
          git commit -m 'fix(operator-auth): bind container listener to bridge interface'
          git push origin HEAD:codex/operator-mcp-local-oidc
