name: Operator Auth Lock Bootstrap

on:
  push:
    branches: [codex/operator-mcp-local-oidc]
    paths:
      - operator-auth/package.json
      - .github/workflows/operator-auth-lock-bootstrap.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/operator-mcp-local-oidc
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
      - name: Generate lockfile
        working-directory: operator-auth
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to this branch only
        run: |
          set -euo pipefail
          git add operator-auth/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore(operator-auth): lock production dependencies'
          git push origin HEAD:codex/operator-mcp-local-oidc
