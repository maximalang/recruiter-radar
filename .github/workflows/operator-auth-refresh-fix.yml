name: Operator Auth Refresh Fix

on:
  push:
    branches: [codex/operator-mcp-local-oidc]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/operator-mcp-local-oidc
          fetch-depth: 0
      - name: Apply OIDC offline-access and TTL fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test = Path('operator-auth/test/security.test.js')
          text = test.read_text()
          old = "resource: RESOURCE, state: 'state-123'"
          new = "resource: RESOURCE, prompt: 'consent', state: 'state-123'"
          if text.count(old) != 1:
              raise SystemExit(f'expected one authorization request anchor, found {text.count(old)}')
          test.write_text(text.replace(old, new, 1))

          server = Path('operator-auth/src/server.js')
          text = server.read_text()
          old = "      AccessToken: ACCESS_TOKEN_TTL,\n      AuthorizationCode: AUTHORIZATION_CODE_TTL,\n      RefreshToken: REFRESH_TOKEN_TTL,"
          new = "      AccessToken: ACCESS_TOKEN_TTL,\n      AuthorizationCode: AUTHORIZATION_CODE_TTL,\n      Grant: REFRESH_TOKEN_TTL,\n      IdToken: ACCESS_TOKEN_TTL,\n      RefreshToken: REFRESH_TOKEN_TTL,"
          if text.count(old) != 1:
              raise SystemExit(f'expected one ttl anchor, found {text.count(old)}')
          server.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff --exit-code >/dev/null && { echo 'patch produced no diff' >&2; exit 1; } || true
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operator-auth/src/server.js operator-auth/test/security.test.js
          git commit -m 'fix(operator-auth): issue standards-compliant refresh tokens'
          git push origin HEAD:codex/operator-mcp-local-oidc
