name: Operator MCP Bootstrap

# Separate from the customer-facing deploy. This workflow consumes the exact
# successful Deploy SHA and can only add/remove the isolated operator services.
on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: operator-mcp-prod
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      RR_MCP_OWNER_PASSWORD_HASH: ${{ secrets.RR_MCP_OWNER_PASSWORD_HASH }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify exact main commit and deployment artifacts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          bash -n scripts/deploy/configure-operator-mcp.sh
          bash -n scripts/deploy/configure-operator-mcp-caddy.sh
          sh -n scripts/deploy/configure-caddy-real-ip.sh
          python3 -m py_compile scripts/operator-mcp/rr-operator-agent.py

      - name: Resolve fail-dark local OAuth configuration
        run: |
          set -euo pipefail
          umask 077
          enabled=false
          if [ -n "${RR_MCP_OWNER_PASSWORD_HASH:-}" ]; then
            [[ "$RR_MCP_OWNER_PASSWORD_HASH" == \$argon2id\$* ]] || {
              echo "RR_MCP_OWNER_PASSWORD_HASH must be an Argon2id encoded hash" >&2
              exit 1
            }
            test "${#RR_MCP_OWNER_PASSWORD_HASH}" -le 512
            printf '%s' "$RR_MCP_OWNER_PASSWORD_HASH" > /tmp/rr-mcp-owner-password-hash
            chmod 600 /tmp/rr-mcp-owner-password-hash
            enabled=true
          else
            echo "::warning::RR_MCP_OWNER_PASSWORD_HASH is absent; Operator MCP remains fail-dark."
          fi

          cat > /tmp/rr-operator-bootstrap.env <<EOF
          RR_OPERATOR_AUTH_PROVIDER=local_oidc
          RR_MCP_ENABLED=${enabled}
          RR_MCP_MUTATIONS_ENABLED=false
          RR_MCP_OAUTH_ISSUER=https://recruiter-radar.ru/operator/oauth
          RR_MCP_RESOURCE=https://recruiter-radar.ru/api/internal/mcp
          RR_MCP_ALLOWED_SUBJECTS=rr_owner
          RR_DEPLOY_SHA=${DEPLOY_SHA}
          RR_OPERATOR_AUTH_IMAGE=recruiter-radar-operator-auth:${DEPLOY_SHA}
          EOF
          chmod 600 /tmp/rr-operator-bootstrap.env
          printf 'RR_MCP_ENABLED=%s\n' "$enabled" >> "$GITHUB_ENV"
          unset RR_MCP_OWNER_PASSWORD_HASH

      - name: Build exact-SHA operator auth image
        if: env.RR_MCP_ENABLED == 'true'
        run: |
          set -euo pipefail
          docker build -f operator-auth/Dockerfile -t "recruiter-radar-operator-auth:${DEPLOY_SHA}" .
          docker save "recruiter-radar-operator-auth:${DEPLOY_SHA}" | gzip -1 > /tmp/rr-operator-auth-image.tar.gz

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.RR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.RR_SSH_PORT }} -t ed25519 ${{ secrets.RR_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload staged operator bootstrap
        run: |
          set -euo pipefail
          remote="${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}"
          ssh -p ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR "$remote" \
            "mkdir -p /opt/recruiter-radar/scripts/operator-mcp"
          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            scripts/deploy/configure-operator-mcp.sh \
            "$remote:/opt/recruiter-radar/configure-operator-mcp.${DEPLOY_SHA}.sh"
          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            scripts/deploy/configure-operator-mcp-caddy.sh \
            "$remote:/opt/recruiter-radar/configure-operator-mcp-caddy.${DEPLOY_SHA}.sh"
          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            scripts/operator-mcp/rr-operator-agent.py \
            "$remote:/opt/recruiter-radar/scripts/operator-mcp/rr-operator-agent.${DEPLOY_SHA}.py"
          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            /tmp/rr-operator-bootstrap.env \
            "$remote:/opt/recruiter-radar/.rr-operator-bootstrap.${DEPLOY_SHA}.env"
          if [ "$RR_MCP_ENABLED" = "true" ]; then
            scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
              /tmp/rr-mcp-owner-password-hash \
              "$remote:/opt/recruiter-radar/.rr-mcp-owner-password-hash.${DEPLOY_SHA}"
            scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
              /tmp/rr-operator-auth-image.tar.gz \
              "$remote:/opt/recruiter-radar/.rr-operator-auth-image.${DEPLOY_SHA}.tar.gz"
          fi
          rm -f /tmp/rr-operator-bootstrap.env /tmp/rr-mcp-owner-password-hash /tmp/rr-operator-auth-image.tar.gz

      - name: Configure isolated operator runtime
        run: |
          set -euo pipefail
          ssh -p ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }} \
            "EXPECTED_DEPLOY_SHA='${DEPLOY_SHA}' bash -s" <<'SSH_EOF'
          set -Eeuo pipefail
          cd /opt/recruiter-radar
          lock_path=/tmp/recruiter-radar-operator-bootstrap.lock
          bootstrap_env="/opt/recruiter-radar/.rr-operator-bootstrap.${EXPECTED_DEPLOY_SHA}.env"
          owner_hash="/opt/recruiter-radar/.rr-mcp-owner-password-hash.${EXPECTED_DEPLOY_SHA}"
          auth_archive="/opt/recruiter-radar/.rr-operator-auth-image.${EXPECTED_DEPLOY_SHA}.tar.gz"
          staged_configurator="/opt/recruiter-radar/configure-operator-mcp.${EXPECTED_DEPLOY_SHA}.sh"
          staged_caddy="/opt/recruiter-radar/configure-operator-mcp-caddy.${EXPECTED_DEPLOY_SHA}.sh"
          staged_agent="/opt/recruiter-radar/scripts/operator-mcp/rr-operator-agent.${EXPECTED_DEPLOY_SHA}.py"
          cleanup() {
            rm -f "$bootstrap_env" "$owner_hash" "$auth_archive" "$staged_configurator" "$staged_caddy" "$staged_agent"
          }
          trap cleanup EXIT

          exec 9> "$lock_path"
          flock -w 120 9
          test -f "$bootstrap_env"
          chmod 600 "$bootstrap_env"
          test "$(wc -l < "$bootstrap_env")" -eq 8

          read_bootstrap_value() {
            local key="$1"
            sed -n "s/^${key}=//p" "$bootstrap_env" | tail -n 1
          }
          RR_OPERATOR_AUTH_PROVIDER="$(read_bootstrap_value RR_OPERATOR_AUTH_PROVIDER)"
          RR_MCP_ENABLED="$(read_bootstrap_value RR_MCP_ENABLED)"
          RR_MCP_MUTATIONS_ENABLED="$(read_bootstrap_value RR_MCP_MUTATIONS_ENABLED)"
          RR_MCP_OAUTH_ISSUER="$(read_bootstrap_value RR_MCP_OAUTH_ISSUER)"
          RR_MCP_RESOURCE="$(read_bootstrap_value RR_MCP_RESOURCE)"
          RR_MCP_ALLOWED_SUBJECTS="$(read_bootstrap_value RR_MCP_ALLOWED_SUBJECTS)"
          RR_DEPLOY_SHA="$(read_bootstrap_value RR_DEPLOY_SHA)"
          RR_OPERATOR_AUTH_IMAGE="$(read_bootstrap_value RR_OPERATOR_AUTH_IMAGE)"
          export RR_OPERATOR_AUTH_PROVIDER RR_MCP_ENABLED RR_MCP_MUTATIONS_ENABLED \
            RR_MCP_OAUTH_ISSUER RR_MCP_RESOURCE RR_MCP_ALLOWED_SUBJECTS RR_DEPLOY_SHA RR_OPERATOR_AUTH_IMAGE

          test "$RR_OPERATOR_AUTH_PROVIDER" = local_oidc
          case "$RR_MCP_ENABLED" in true | false) ;; *) exit 61 ;; esac
          test "$RR_MCP_MUTATIONS_ENABLED" = false
          test "$RR_MCP_OAUTH_ISSUER" = 'https://recruiter-radar.ru/operator/oauth'
          test "$RR_MCP_RESOURCE" = 'https://recruiter-radar.ru/api/internal/mcp'
          test "$RR_MCP_ALLOWED_SUBJECTS" = rr_owner
          test "$RR_DEPLOY_SHA" = "$EXPECTED_DEPLOY_SHA"
          test "$RR_OPERATOR_AUTH_IMAGE" = "recruiter-radar-operator-auth:${EXPECTED_DEPLOY_SHA}"

          if [ "$RR_MCP_ENABLED" = true ]; then
            test -s "$owner_hash"
            chmod 600 "$owner_hash"
            [[ "$(cat "$owner_hash")" == \$argon2id\$* ]]
            test -s "$auth_archive"
            gzip -dc "$auth_archive" | docker load >/dev/null
            docker image inspect "$RR_OPERATOR_AUTH_IMAGE" >/dev/null
            export RR_MCP_OWNER_PASSWORD_HASH_FILE="$owner_hash"
          fi

          mv "$staged_configurator" /opt/recruiter-radar/configure-operator-mcp.sh
          mv "$staged_caddy" /opt/recruiter-radar/configure-operator-mcp-caddy.sh
          mv "$staged_agent" /opt/recruiter-radar/scripts/operator-mcp/rr-operator-agent.py
          chmod 700 \
            /opt/recruiter-radar/configure-operator-mcp.sh \
            /opt/recruiter-radar/configure-operator-mcp-caddy.sh \
            /opt/recruiter-radar/scripts/operator-mcp/rr-operator-agent.py

          /opt/recruiter-radar/configure-operator-mcp.sh --preflight
          /opt/recruiter-radar/configure-operator-mcp.sh
          /opt/recruiter-radar/configure-operator-mcp-caddy.sh

          docker exec recruiter-radar-operator-1 node -e '
            const url = new URL(process.env.DATABASE_URL || "");
            if (url.username !== "rr_operator_ro") process.exit(1);
            if (process.env.RR_OPERATOR_MODE !== "true") process.exit(1);
            if (process.env.MIGRATE_ON_START !== "false") process.exit(1);
            if (process.env.RR_MCP_MUTATIONS_ENABLED !== "false") process.exit(1);
            if (process.env.RR_MCP_OAUTH_ISSUER !== "https://recruiter-radar.ru/operator/oauth") process.exit(1);
            if (process.env.RR_MCP_ALLOWED_SUBJECTS !== "rr_owner") process.exit(1);
            if (process.env.RR_DEPLOY_SHA !== process.argv[1]) process.exit(1);
          ' "$EXPECTED_DEPLOY_SHA"
          if [ "$RR_MCP_ENABLED" = true ]; then
            docker exec recruiter-radar-operator-auth-1 node -e '
              const url = new URL(process.env.RR_MCP_AUTH_DATABASE_URL || "");
              if (url.username !== "rr_operator_auth") process.exit(1);
              if (process.env.RR_OPERATOR_AUTH_PROVIDER !== "local_oidc") process.exit(1);
              if (process.env.RR_MCP_ALLOWED_SUBJECTS !== "rr_owner") process.exit(1);
              if (process.env.RR_MCP_RESOURCE !== "https://recruiter-radar.ru/api/internal/mcp") process.exit(1);
            '
            curl -fsS http://127.0.0.1:3002/healthz >/dev/null
          fi
          curl -fsS http://127.0.0.1:3001/api/health >/dev/null
          systemctl is-active --quiet rr-operator-agent.service
          SSH_EOF

      - name: Verify public operator boundary
        run: |
          set -euo pipefail
          if [ "$RR_MCP_ENABLED" = "true" ]; then
            metadata_code="$(curl -sS -o /tmp/operator-metadata.json -w '%{http_code}' \
              https://recruiter-radar.ru/.well-known/oauth-protected-resource/api/internal/mcp)"
            test "$metadata_code" = "200"
            node -e '
              const fs = require("fs");
              const value = JSON.parse(fs.readFileSync("/tmp/operator-metadata.json", "utf8"));
              if (value.resource !== "https://recruiter-radar.ru/api/internal/mcp") process.exit(1);
              if (JSON.stringify(value.authorization_servers) !== JSON.stringify(["https://recruiter-radar.ru/operator/oauth"])) process.exit(1);
              if (JSON.stringify(value.scopes_supported) !== JSON.stringify(["rr.operator.read"])) process.exit(1);
            '

            oidc_code="$(curl -sS -o /tmp/operator-oidc.json -w '%{http_code}' \
              https://recruiter-radar.ru/operator/oauth/.well-known/openid-configuration)"
            test "$oidc_code" = "200"
            node -e '
              const fs=require("fs"), v=JSON.parse(fs.readFileSync("/tmp/operator-oidc.json","utf8"));
              if(v.issuer!=="https://recruiter-radar.ru/operator/oauth")process.exit(1);
              if(v.authorization_endpoint!==v.issuer+"/auth")process.exit(1);
              if(v.token_endpoint!==v.issuer+"/token")process.exit(1);
              if(v.jwks_uri!==v.issuer+"/jwks")process.exit(1);
              if(v.registration_endpoint!==v.issuer+"/reg")process.exit(1);
              if(!Array.isArray(v.code_challenge_methods_supported)||v.code_challenge_methods_supported.join(" ")!=="S256")process.exit(1);
              if(!v.scopes_supported?.includes("offline_access")||!v.scopes_supported?.includes("rr.operator.read"))process.exit(1);
            '
            curl -fsS https://recruiter-radar.ru/.well-known/oauth-authorization-server/operator/oauth >/tmp/operator-rfc8414.json
            node -e 'const v=require("/tmp/operator-rfc8414.json");if(v.issuer!=="https://recruiter-radar.ru/operator/oauth")process.exit(1)'
            curl -fsS https://recruiter-radar.ru/operator/oauth/jwks >/tmp/operator-jwks.json
            node -e 'const v=require("/tmp/operator-jwks.json");if(!v.keys?.length||v.keys.some(k=>k.d))process.exit(1)'

            unauth_code="$(curl -sS -D /tmp/operator-headers.txt -o /dev/null -w '%{http_code}' \
              -X POST https://recruiter-radar.ru/api/internal/mcp \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')"
            test "$unauth_code" = "401"
            grep -Fq 'resource_metadata="https://recruiter-radar.ru/.well-known/oauth-protected-resource/api/internal/mcp"' /tmp/operator-headers.txt
          else
            endpoint_code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              https://recruiter-radar.ru/api/internal/mcp -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')"
            metadata_code="$(curl -sS -o /dev/null -w '%{http_code}' \
              https://recruiter-radar.ru/.well-known/oauth-protected-resource/api/internal/mcp)"
            test "$endpoint_code" = "404"
            test "$metadata_code" = "404"
          fi

      - name: Cleanup local bootstrap material
        if: always()
        run: rm -f /tmp/rr-operator-bootstrap.env /tmp/rr-mcp-owner-password-hash /tmp/rr-operator-auth-image.tar.gz /tmp/operator-*.json /tmp/operator-headers.txt
