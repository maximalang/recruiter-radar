name: Operator MCP OAuth Security

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: operator-mcp-oauth-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operator-oauth-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.9-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install product dependencies
        run: npm ci

      - name: Install locked operator auth dependencies
        working-directory: operator-auth
        run: npm ci --no-audit --no-fund

      - name: Verify pinned OAuth dependency and audit production graph
        working-directory: operator-auth
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies['oidc-provider']!=='9.11.1') process.exit(1)"
          npm audit --omit=dev --audit-level=high

      - name: Check operator auth source
        working-directory: operator-auth
        run: npm run check

      - name: Run OAuth persistence and security flow
        working-directory: operator-auth
        shell: bash
        run: |
          set +e
          npm test > /tmp/operator-oauth-test.log 2>&1
          status=$?
          set -e
          cat /tmp/operator-oauth-test.log
          if [ "$status" -ne 0 ]; then
            diagnostic="$(tail -n 30 /tmp/operator-oauth-test.log | base64 -w0)"
            printf '::error file=operator-auth/test/security.test.js,line=1,title=Operator OAuth integration (base64)::%s\n' "$diagnostic"
            exit "$status"
          fi

      - name: Validate operator deployment scripts
        run: |
          bash -n scripts/deploy/configure-operator-mcp.sh
          bash -n scripts/deploy/configure-operator-mcp-caddy.sh
          sh -n scripts/deploy/configure-caddy-real-ip.sh
          python3 -m py_compile scripts/operator-mcp/rr-operator-agent.py
          python3 scripts/test/operator-mcp-agent.py
          bash scripts/test/operator-mcp-caddy.sh
          bash scripts/test/operator-mcp-bootstrap-security.sh
          bash scripts/test/operator-mcp-bootstrap-first-run.sh
          bash scripts/test/configure-caddy-production.sh

      - name: Run MCP resource-server contract tests
        run: npm test --workspace @recruiter-radar/web -- --runInBand src/__tests__/api/internal/operator-mcp-route.test.ts

      - name: Type and production-build checks
        run: |
          npm run check --workspace @recruiter-radar/web
          npm run build --workspace @recruiter-radar/web

      - name: Build isolated operator auth image
        run: docker build -f operator-auth/Dockerfile -t rr-operator-auth:test .
