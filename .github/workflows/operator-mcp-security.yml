name: Timeweb MCP OAuth Security

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: timeweb-mcp-oauth-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timeweb-oauth-security:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16.9-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install product dependencies
        run: npm ci

      - name: Audit product production graph
        run: npm audit --omit=dev --audit-level=high

      - name: Install locked OAuth dependencies
        working-directory: operator-auth
        run: npm ci --no-audit --no-fund

      - name: Verify pinned OAuth dependency and audit auth production graph
        working-directory: operator-auth
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies['oidc-provider']!=='9.11.1') process.exit(1)"
          npm audit --omit=dev --audit-level=high

      - name: Check OAuth source
        working-directory: operator-auth
        run: npm run check

      - name: Run legacy and Timeweb OAuth persistence/security suites
        working-directory: operator-auth
        run: npm test

      - name: Validate Timeweb deployment scripts and fail-closed bootstrap contract
        run: |
          set -euo pipefail
          bash -n scripts/deploy/configure-timeweb-mcp-auth.sh
          bash -n scripts/deploy/configure-timeweb-mcp-runtime.sh
          bash -n scripts/deploy/timeweb-mcp-runtime-dispatch.sh
          bash -n scripts/deploy/configure-timeweb-mcp-caddy.sh
          bash scripts/deploy/test-timeweb-mcp-first-bootstrap.sh
          test -f .github/workflows/timeweb-mcp-bootstrap.yml
          test ! -f .github/workflows/operator-mcp-bootstrap.yml
          grep -Fq 'RR_TIMEWEB_MCP_TOKEN:' .github/workflows/timeweb-mcp-bootstrap.yml
          grep -Fq 'secrets.RR_TIMEWEB_MCP_TOKEN' .github/workflows/timeweb-mcp-bootstrap.yml
          grep -Fq 'RR_MCP_ENABLED: "false"' scripts/deploy/configure-timeweb-mcp-runtime.sh
          grep -Fq 'RR_MCP_MUTATIONS_ENABLED: "false"' scripts/deploy/configure-timeweb-mcp-runtime.sh
          grep -Fq 'restrict,command=' scripts/deploy/configure-timeweb-mcp-runtime.sh
          grep -Fq 'action_not_allowed' scripts/deploy/timeweb-mcp-runtime-dispatch.sh
          grep -Fq 'respond @rr_legacy_operator_mcp 404' scripts/deploy/configure-timeweb-mcp-caddy.sh
          if grep -Fq 'https://recruiter-radar.ru/api/internal/mcp' operator-auth/src/timeweb-server.js; then
            echo 'Timeweb auth service must not authorize the legacy MCP resource' >&2
            exit 1
          fi

      - name: Run Timeweb MCP resource-server contract tests
        run: >-
          npm test --workspace @recruiter-radar/web -- --runInBand
          src/__tests__/app/api/timeweb-mcp-route.test.ts
          src/__tests__/lib/timeweb-mcp-auth.test.ts
          src/__tests__/lib/timeweb-mcp-session.test.ts
          src/__tests__/lib/timeweb-mcp-recovery.test.ts
          src/__tests__/lib/timeweb-mcp-runtime.test.ts
          src/__tests__/lib/timeweb-mcp-router.test.ts

      - name: Type and production-build checks
        run: |
          npm run check --workspace @recruiter-radar/web
          npm run build --workspace @recruiter-radar/web

      - name: Build isolated Timeweb OAuth image
        run: docker build -f operator-auth/Dockerfile -t rr-timeweb-auth:test .
