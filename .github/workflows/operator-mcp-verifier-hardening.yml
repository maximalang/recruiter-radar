name: Operator MCP Verifier Hardening

on:
  push:
    branches: [codex/operator-mcp-local-oidc]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/operator-mcp-local-oidc
          fetch-depth: 0
      - name: Pin JWKS endpoint and key profile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/lib/operator-mcp-auth.ts')
          text = path.read_text()
          old = """      const jwksUri = typeof body.jwks_uri === 'string' ? body.jwks_uri : ''\n      if (!isSecureHttpsUrl(jwksUri)) {\n        throw new Error('OAuth metadata does not expose a secure JWKS URL')\n      }\n      const value = { issuer, jwksUri }\n"""
          new = """      const jwksUri = typeof body.jwks_uri === 'string' ? body.jwks_uri : ''\n      if (!isSecureHttpsUrl(jwksUri)) {\n        throw new Error('OAuth metadata does not expose a secure JWKS URL')\n      }\n      if (jwksUri !== `${issuerBase}/jwks`) {\n        throw new Error('OAuth metadata exposes an unexpected JWKS URL')\n      }\n      const value = { issuer, jwksUri }\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one metadata anchor, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old = """  return keys.find((key) =>\n    key.kid === kid &&\n    (key.use === undefined || key.use === 'sig') &&\n    (key.alg === undefined || key.alg === alg),\n  )\n"""
          new = """  return keys.find((key) =>\n    key.kid === kid &&\n    key.kty === 'EC' &&\n    key.crv === 'P-256' &&\n    key.use === 'sig' &&\n    key.alg === alg &&\n    typeof key.x === 'string' && key.x.length > 0 &&\n    typeof key.y === 'string' && key.y.length > 0 &&\n    key.d === undefined,\n  )\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one signing-key anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/lib/operator-mcp-auth.ts
          git commit -m 'fix(operator-mcp): pin verifier JWKS trust boundary'
          git push origin HEAD:codex/operator-mcp-local-oidc
