name: V1-V6 PASS 10 apply

on:
  push:
    branches:
      - chatgpt/full-v1-v6-implementation
    paths:
      - .github/workflows/pass10-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Verify invocation head
        shell: bash
        run: |
          set -euo pipefail
          expected_parent="22d7bb80c0c3bfa2db09442bf5e7b2f702251030"
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent"

      - name: Reconstruct verified PASS 10 patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin chatgpt/pass10-payload
          : > /tmp/pass10.patch.xz.b64
          for p in 00 01 02 03 04 05 06 07; do
            git show "origin/chatgpt/pass10-payload:.pass10/part${p}" >> /tmp/pass10.patch.xz.b64
          done
          base64 -d /tmp/pass10.patch.xz.b64 | xz -d > /tmp/pass10.patch
          echo "dc175a5fc95294e92fbc99829bf7aa800965548a400f3ebe38bca60e252f7547  /tmp/pass10.patch" | sha256sum -c -

      - name: Apply PASS 10 cleanup
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --whitespace=error-all /tmp/pass10.patch
          git rm .github/workflows/pass10-apply.yml
          git diff --cached --check
          if grep -RInE --exclude-dir=node_modules --exclude-dir=.next \
            'recruiter-radar-v(6|7)|#(9fca63|c8f36a|c9ec8b)|\bScoreGauge\b|\bScoreBar\b|\bScoreBandChip\b|\bSettingsOverview\b|\borganizationDiamond\b|\bscoreGrid\b|Дашборд|Командный центр|Карта спроса' \
            apps/web/app; then
            echo "Legacy V1-V6 presentation grammar remains in app" >&2
            exit 1
          fi

      - name: Commit and push exact cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "refactor(ui): complete V1-V6 PASS 10 legacy cleanup"
          git push origin HEAD:chatgpt/full-v1-v6-implementation

      - name: Remove payload branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete chatgpt/pass10-payload || true
