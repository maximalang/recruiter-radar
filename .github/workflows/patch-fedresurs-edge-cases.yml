name: Apply Fedresurs edge-case patches

on:
  push:
    branches: [codex/source-closure-2026-08]
    paths: ['.github/workflows/patch-fedresurs-edge-cases.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/source-closure-2026-08
          fetch-depth: 0
      - name: Apply exact fail-closed patches
        run: |
          python - <<'PY'
          from pathlib import Path

          sync = Path('packages/db/scripts/sync-fedresurs-snapshot.mjs')
          text = sync.read_text()
          old = """  const candidates = parseFedresursExportIndex(html, year)
              .filter((entry) => entry.bytes > 0 && entry.bytes <= maxArchiveBytes)
              .sort((left, right) => right.month - left.month);
            if (candidates.length === 0) {
              throw new Error(`Fedresurs exposed no ${year} monthly archive within the ${maxArchiveBytes}-byte safety limit.`);
            }
            return candidates[0];
          """
          new = """  const candidates = parseFedresursExportIndex(html, year)
              .filter((entry) => entry.bytes > 0)
              .sort((left, right) => right.month - left.month);
            if (candidates.length === 0) {
              throw new Error(`Fedresurs exposed no ${year} monthly archive.`);
            }
            const latest = candidates[0];
            if (latest.bytes > maxArchiveBytes) {
              throw new Error(
                `Latest Fedresurs archive ${latest.fileName} is ${latest.bytes} bytes, exceeding the ${maxArchiveBytes}-byte safety limit; refusing a stale-month fallback.`,
              );
            }
            return latest;
          """
          if text.count(old) != 1:
              raise SystemExit(f'Fedresurs discovery block count={text.count(old)}')
          sync.write_text(text.replace(old, new))

          runner = Path('scripts/deploy/run-government-source-sync.sh')
          text = runner.read_text()
          old = """\"$docker_bin\" compose exec -T web \\
            node \"packages/db/scripts/sync-${source_id}-snapshot.mjs\"

          # Snapshot-backed derived sources should become useful immediately after the
          """
          new = """sync_output=\"$(
            \"$docker_bin\" compose exec -T web \\
              node \"packages/db/scripts/sync-${source_id}-snapshot.mjs\"
          )\"
          printf '%s\\n' \"$sync_output\"

          if printf '%s\\n' \"$sync_output\" | grep -Fq '\"reason\": \"deferred:no-eligible-legal-entities\"'; then
            echo 'No eligible tracked legal entities; skipping derived snapshot ingestion.'
            exit 0
          fi

          # Snapshot-backed derived sources should become useful immediately after the
          """
          if text.count(old) != 1:
              raise SystemExit(f'government runner block count={text.count(old)}')
          runner.write_text(text.replace(old, new))

          test = Path('packages/db/scripts/sync-fedresurs-snapshot.test.mjs')
          text = test.read_text()
          text = text.replace(
            """  assertOfficialFedresursArchiveUrl,\n  parseFedresursExportIndex,\n""",
            """  assertOfficialFedresursArchiveUrl,\n  discoverLatestFedresursArchive,\n  parseFedresursExportIndex,\n""",
          )
          anchor = """test('Fedresurs archive URL is locked to the official export path', () => {\n"""
          addition = """test('Fedresurs discovery refuses a stale-month fallback when the latest archive is oversized', async () => {
            const indexUrl = 'https://download.fedresurs.ru/export_messages/2026/';
            const html = `
              <a href=\"05-2026.7z\">05-2026.7z</a> 17-Jun-2026 00:44 205M
              <a href=\"06-2026.7z\">06-2026.7z</a> 17-Jul-2026 00:54 600M
            `;
            await assert.rejects(
              () => discoverLatestFedresursArchive({
                year: 2026,
                maxArchiveBytes: 512 * 1024 * 1024,
                fetchImpl: async () => ({
                  ok: true,
                  status: 200,
                  url: indexUrl,
                  headers: new Headers(),
                  text: async () => html,
                }),
              }),
              /refusing a stale-month fallback/,
            );
          });

          """
          if text.count(anchor) != 1:
              raise SystemExit(f'Fedresurs test anchor count={text.count(anchor)}')
          test.write_text(text.replace(anchor, addition + anchor))

          runner_test = Path('scripts/test/government-source-sync-runner.sh')
          text = runner_test.read_text()
          old = """cat > \"$temporary_dir/bin/fake-docker\" <<'SH'
          #!/usr/bin/env bash
          printf '%s\\n' \"$*\" >> \"$RR_TEST_COMMAND_LOG\"
          exit 0
          SH
          """
          new = """cat > \"$temporary_dir/bin/fake-docker\" <<'SH'
          #!/usr/bin/env bash
          printf '%s\\n' \"$*\" >> \"$RR_TEST_COMMAND_LOG\"
          if [ \"${RR_TEST_NO_ELIGIBLE:-false}\" = 'true' ] && [[ \"$*\" == *'sync-fedresurs-snapshot.mjs'* ]]; then
            printf '%s\\n' '{\"ok\":true,\"source\":\"fedresurs\",\"outcome\":\"expected-zero\",\"reason\": \"deferred:no-eligible-legal-entities\",\"activated\":false}'
          fi
          exit 0
          SH
          """
          if text.count(old) != 1:
              raise SystemExit(f'runner fake docker block count={text.count(old)}')
          text = text.replace(old, new)
          anchor = """: > \"$command_log\"\nbash \"$repo_root/scripts/deploy/run-government-source-sync.sh\" fns-open-data\n"""
          addition = """: > \"$command_log\"
          RR_TEST_NO_ELIGIBLE=true bash \"$repo_root/scripts/deploy/run-government-source-sync.sh\" fedresurs
          grep -Fxq 'compose exec -T web node packages/db/scripts/sync-fedresurs-snapshot.mjs' \"$command_log\"
          if grep -Fq 'source-fedresurs.mjs pipeline' \"$command_log\"; then
            echo 'Fedresurs pipeline ran despite no eligible tracked legal entities.' >&2
            exit 1
          fi

          """
          if text.count(anchor) != 1:
              raise SystemExit(f'runner test anchor count={text.count(anchor)}')
          runner_test.write_text(text.replace(anchor, addition + anchor))
          PY
          rm .github/workflows/patch-fedresurs-edge-cases.yml
          git diff --check
          git diff --stat
      - name: Commit minimal patches and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/db/scripts/sync-fedresurs-snapshot.mjs packages/db/scripts/sync-fedresurs-snapshot.test.mjs scripts/deploy/run-government-source-sync.sh scripts/test/government-source-sync-runner.sh .github/workflows/patch-fedresurs-edge-cases.yml
          git commit -m 'fix(sources): fail closed on stale Fedresurs snapshots'
          git push origin HEAD:codex/source-closure-2026-08
