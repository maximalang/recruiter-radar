name: PR 148 remediation

on:
  push:
    branches:
      - codex/finish-layout-all-pages

permissions:
  contents: write

concurrency:
  group: pr-148-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/finish-layout-all-pages
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update dependency overrides and deploy anchors
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.overrides = {
            ...(packageJson.overrides || {}),
            'brace-expansion': '5.0.9',
            'ip-address': '10.3.1',
          };
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);

          const files = [
            '.github/workflows/test.yml',
            '.github/workflows/deploy.yml',
            'apps/web/src/__tests__/scripts/ci-workflow-contract.test.ts',
            'apps/web/src/__tests__/scripts/deploy-workflow-contract.test.ts',
          ];
          const previousAnchor = 'recruiter-radar-landing-v3';
          const currentAnchor = 'recruiter-radar-signal-lock';

          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(previousAnchor)) {
              throw new Error(`Expected legacy deploy anchor in ${file}`);
            }
            fs.writeFileSync(file, source.replaceAll(previousAnchor, currentAnchor));
          }
          NODE
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Remove one-time workflow and commit generated files
        shell: bash
        run: |
          rm .github/workflows/pr-148-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json \
            .github/workflows/test.yml \
            .github/workflows/deploy.yml \
            apps/web/src/__tests__/scripts/ci-workflow-contract.test.ts \
            apps/web/src/__tests__/scripts/deploy-workflow-contract.test.ts \
            .github/workflows/pr-148-remediation.yml
          git commit -m 'fix(ci): clear dependency and deploy readiness blockers'
          git push origin HEAD:codex/finish-layout-all-pages
