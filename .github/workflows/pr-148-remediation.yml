name: PR 148 remediation

on:
  push:
    branches:
      - codex/finish-layout-all-pages

permissions:
  contents: write

concurrency:
  group: pr-148-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/finish-layout-all-pages
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update secure dependency versions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.dependencies = {
            ...(packageJson.dependencies || {}),
            'brace-expansion': '5.0.9',
          };
          packageJson.overrides = {
            ...(packageJson.overrides || {}),
            'brace-expansion': '5.0.9',
            'ip-address': '10.3.1',
          };
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
      - name: Refresh lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm update ip-address --package-lock-only --ignore-scripts
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit dependency remediation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(security): update vulnerable transitive dependencies'
          git push origin HEAD:codex/finish-layout-all-pages
