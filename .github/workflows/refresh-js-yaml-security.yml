name: Refresh js-yaml security lockfile

on:
  push:
    branches: ['codex/evidence-radar-system']

permissions:
  contents: write

concurrency:
  group: refresh-js-yaml-security-lockfile
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/evidence-radar-system
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh patched js-yaml resolution
        run: npm install js-yaml@5.2.2 --save --package-lock-only
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit refreshed lockfile and remove helper workflow
        run: |
          rm .github/workflows/refresh-js-yaml-security.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/refresh-js-yaml-security.yml
          git diff --cached --check
          git commit -m 'fix(security): update js-yaml to patched release'
          git push origin HEAD:codex/evidence-radar-system
