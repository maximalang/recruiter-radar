name: Refresh nanoid lockfile

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.number == 206 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Generate patched lockfile with npm
        run: |
          set -euo pipefail
          npm install --save-exact nanoid@3.3.18
          npm audit --omit=dev --audit-level=high
          node -e 'const p=require("./package-lock.json"); if(p.packages?.["node_modules/nanoid"]?.version!=="3.3.18") process.exit(1)'
      - name: Commit generated dependency files and remove this one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-nanoid-lock.yml
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile update required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): patch nanoid CVE-2026-67213"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
