name: Resolve exact current main into final integration

on:
  push:
    branches:
      - codex/commercial-signal-evidence-integration

permissions:
  contents: write

concurrency:
  group: resolve-commercial-signal-evidence-main-v2
  cancel-in-progress: true

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/commercial-signal-evidence-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Merge exact fetched main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          printf '%s' "$MAIN_SHA" > /tmp/integration-main-sha
          echo "Fetched main: $MAIN_SHA"

          set +e
          git merge --no-ff --no-commit "$MAIN_SHA"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Conflicts:"
            printf '%s\n' "$conflicts"
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                .github/workflows/test.yml|apps/web/next.config.ts|apps/web/src/__tests__/app/content-security-policy.test.ts|package-lock.json|package.json) ;;
                *) echo "Unexpected merge conflict: $path"; exit 1 ;;
              esac
            done <<< "$conflicts"
          fi

          if git diff --name-only --diff-filter=U | grep -qx '.github/workflows/test.yml'; then
            git checkout --ours .github/workflows/test.yml
            sed -i 's/for i in $(seq 1 30); do/for i in $(seq 1 75); do/' .github/workflows/test.yml
            sed -i 's/data-deploy-anchor="recruiter-radar-signal-lock"/data-deploy-anchor="recruiter-radar-landing-v3"/' .github/workflows/test.yml
            git add .github/workflows/test.yml
          fi

          for path in apps/web/next.config.ts apps/web/src/__tests__/app/content-security-policy.test.ts; do
            if git diff --name-only --diff-filter=U | grep -qx "$path"; then
              git checkout --theirs "$path"
              git add "$path"
            fi
          done

          for path in package.json package-lock.json; do
            if git diff --name-only --diff-filter=U | grep -qx "$path"; then
              git checkout --ours "$path"
              git add "$path"
            fi
          done

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            echo "Unresolved conflicts:"
            printf '%s\n' "$remaining"
            exit 1
          fi

      - name: Regenerate combined lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit merge and prove ancestry
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(cat /tmp/integration-main-sha)"
          rm .github/workflows/resolve-commercial-signal-evidence-main-v2.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "merge: integrate main ${MAIN_SHA} into Commercial Signal and Evidence Radar"
          git merge-base --is-ancestor "$MAIN_SHA" HEAD
          parents="$(git show -s --format=%P HEAD)"
          echo "Parents: $parents"
          [ "$(wc -w <<< "$parents")" -ge 2 ]
          git push origin HEAD:codex/commercial-signal-evidence-integration
