name: Resolve exact current main into final integration

on:
  push:
    branches: ['codex/commercial-signal-evidence-integration']

permissions:
  contents: write

concurrency:
  group: resolve-commercial-signal-evidence-main-v2
  cancel-in-progress: false

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/commercial-signal-evidence-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Merge exact fetched main and resolve only known overlaps
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          echo "$MAIN_SHA" > /tmp/integration-main-sha
          echo "Fetched main SHA: $MAIN_SHA"

          set +e
          git merge --no-ff --no-commit "$MAIN_SHA"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts detected:\n%s\n' "${conflicts[*]}"
            expected=(
              '.github/workflows/test.yml'
              'apps/web/next.config.ts'
              'apps/web/src/__tests__/app/content-security-policy.test.ts'
              'package-lock.json'
              'package.json'
            )
            for path in "${conflicts[@]}"; do
              allowed=false
              for known in "${expected[@]}"; do
                if [ "$path" = "$known" ]; then allowed=true; break; fi
              done
              if [ "$allowed" != true ]; then
                echo "Unexpected merge conflict: $path"
                exit 1
              fi
            done
          fi

          if git diff --name-only --diff-filter=U | grep -qx '.github/workflows/test.yml'; then
            git checkout --ours .github/workflows/test.yml
            python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/test.yml')
          text = path.read_text()
          text = text.replace('for i in $(seq 1 30); do', 'for i in $(seq 1 75); do')
          text = text.replace('data-deploy-anchor="recruiter-radar-signal-lock"', 'data-deploy-anchor="recruiter-radar-landing-v3"')
          path.write_text(text)
          PY
            git add .github/workflows/test.yml
          fi

          for path in apps/web/next.config.ts apps/web/src/__tests__/app/content-security-policy.test.ts; do
            if git diff --name-only --diff-filter=U | grep -qx "$path"; then
              git checkout --theirs "$path"
              git add "$path"
            fi
          done

          if git diff --name-only --diff-filter=U | grep -qx 'package.json'; then
            git checkout --ours package.json
            git add package.json
          fi

          if git diff --name-only --diff-filter=U | grep -qx 'package-lock.json'; then
            git checkout --ours package-lock.json
            git add package-lock.json
          fi

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            echo "Unresolved conflicts remain:"
            printf '%s\n' "$remaining"
            exit 1
          fi

      - name: Regenerate combined lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit exact merge and prove main ancestry
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(cat /tmp/integration-main-sha)"
          rm .github/workflows/resolve-commercial-signal-evidence-main-v2.yml
          git add package.json package-lock.json .github/workflows/resolve-commercial-signal-evidence-main-v2.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "merge: integrate main ${MAIN_SHA} into Commercial Signal and Evidence Radar"
          git merge-base --is-ancestor "$MAIN_SHA" HEAD
          parent_count="$(git show -s --format=%P HEAD | wc -w | tr -d ' ')"
          if [ "$parent_count" -lt 2 ]; then
            echo "Expected a true merge commit, got $parent_count parent(s)"
            exit 1
          fi
          git push origin HEAD:codex/commercial-signal-evidence-integration
