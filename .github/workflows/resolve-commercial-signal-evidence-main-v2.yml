name: Resolve exact current main into final integration

on:
  push:
    branches:
      - codex/commercial-signal-evidence-integration

permissions:
  contents: write

concurrency:
  group: resolve-commercial-signal-evidence-main-v2
  cancel-in-progress: true

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/commercial-signal-evidence-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve exact current main
        shell: bash
        run: |
          set -Eeuo pipefail
          STAGE=bootstrap
          diagnose() {
            status=$?
            set +e
            conflicts="$(git diff --name-only --diff-filter=U)"
            git merge --abort >/dev/null 2>&1 || true
            printf 'stage=%s\nstatus=%s\nconflicts=%s\n' "$STAGE" "$status" "$conflicts" > .integration-resolver-state.txt
            rm -f .github/workflows/resolve-commercial-signal-evidence-main-v2.yml
            git add -A
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "chore: record integration resolver failure at ${STAGE}" || true
            git push origin HEAD:codex/commercial-signal-evidence-integration || true
            exit "$status"
          }
          trap diagnose ERR

          STAGE=fetch-main
          git fetch origin main
          MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          echo "Fetched main: $MAIN_SHA"

          STAGE=merge-main
          set +e
          git merge --no-ff --no-commit "$MAIN_SHA"
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Conflicts:"
            printf '%s\n' "$conflicts"
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                .github/workflows/test.yml|apps/web/next.config.ts|apps/web/src/__tests__/app/content-security-policy.test.ts|package-lock.json|package.json) ;;
                *) echo "Unexpected merge conflict: $path"; false ;;
              esac
            done <<< "$conflicts"
          fi

          STAGE=resolve-known-conflicts
          if git diff --name-only --diff-filter=U | grep -qx '.github/workflows/test.yml'; then
            git checkout --ours .github/workflows/test.yml
            sed -i 's/for i in $(seq 1 30); do/for i in $(seq 1 75); do/' .github/workflows/test.yml
            sed -i 's/data-deploy-anchor="recruiter-radar-signal-lock"/data-deploy-anchor="recruiter-radar-landing-v3"/' .github/workflows/test.yml
            git add .github/workflows/test.yml
          fi
          for path in apps/web/next.config.ts apps/web/src/__tests__/app/content-security-policy.test.ts; do
            if git diff --name-only --diff-filter=U | grep -qx "$path"; then
              git checkout --theirs "$path"
              git add "$path"
            fi
          done
          for path in package.json package-lock.json; do
            if git diff --name-only --diff-filter=U | grep -qx "$path"; then
              git checkout --ours "$path"
              git add "$path"
            fi
          done
          remaining="$(git diff --name-only --diff-filter=U)"
          [ -z "$remaining" ] || { echo "$remaining"; false; }

          STAGE=regenerate-lockfile
          npm install --package-lock-only --ignore-scripts

          STAGE=security-audit
          npm audit --omit=dev --audit-level=high

          STAGE=commit-merge
          rm .github/workflows/resolve-commercial-signal-evidence-main-v2.yml
          rm -f .integration-resolver-state.txt
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "merge: integrate main ${MAIN_SHA} into Commercial Signal and Evidence Radar"

          STAGE=verify-ancestry
          git merge-base --is-ancestor "$MAIN_SHA" HEAD
          parents="$(git show -s --format=%P HEAD)"
          echo "Parents: $parents"
          [ "$(wc -w <<< "$parents")" -ge 2 ]

          STAGE=push
          git push origin HEAD:codex/commercial-signal-evidence-integration
          trap - ERR
