name: Source Closure Contracts

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-closure:
    # Keep transport, parser, activation, readiness and deployment wiring in one focused gate.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate production source runtime scripts
        run: |
          bash -n scripts/deploy/configure-hh-runtime.sh
          bash -n scripts/deploy/configure-youtube-runtime.sh
          bash -n scripts/deploy/run-government-source-sync.sh
          bash scripts/test/government-source-sync-runner.sh
      - name: Verify public-source transport and projection contracts
        run: |
          node --test packages/db/scripts/adapters/gdelt-doc-client.test.mjs
          node --test packages/db/scripts/source-transparent-business-fns.test.mjs
          node --test packages/db/scripts/sync-fedresurs-snapshot.test.mjs
          node --test packages/db/scripts/source-rabota-rossii-pagination.test.mjs
          node --test packages/db/scripts/adapters/hh-incremental-coverage.test.mjs
          node --test packages/db/scripts/adapters/superjob-incremental-coverage.test.mjs
          node --test packages/db/scripts/adapters/source-escalation.test.mjs
          node --test packages/db/scripts/adapters/source-transport-health-store.test.mjs
          node --test packages/db/scripts/adapters/organization-resolution.test.mjs
          node --test packages/db/scripts/adapters/rf-source-intelligence-v2.test.mjs
          node --test packages/db/scripts/adapters/rf-job-board-discovery.test.mjs
          node --test packages/db/scripts/adapters/rf-job-board-detail-fallback.test.mjs
          node --test packages/db/scripts/adapters/rf-employer-profile-enrichment.test.mjs
          node --test packages/db/scripts/adapters/rf-candidate-org-bootstrap.test.mjs
          node --test packages/db/scripts/adapters/rf-hiring-discovery-candidates.test.mjs
          node --test packages/db/scripts/adapters/rf-hiring-candidate-reconciliation.test.mjs
          node --test packages/db/scripts/adapters/source-production-readiness.test.mjs
          node packages/db/scripts/verify-funding-business-signals-smoke.mjs
          node packages/db/scripts/verify-rf-source-expansion-smoke.mjs
      - name: Verify source activation contracts
        run: npm test --workspace @recruiter-radar/web -- --runInBand --runTestsByPath src/__tests__/lib/sources/source-activation.test.ts
      - name: Verify readiness metadata contracts
        run: npm run verify:sources:readiness
