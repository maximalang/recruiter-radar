name: Source Refresh Clock

on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-refresh-prod
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.RR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.RR_SSH_PORT }} -t ed25519 ${{ secrets.RR_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Trigger cadence-aware source refresh
        run: |
          set -euo pipefail
          ssh -p ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }} <<'SSH_EOF'
          set -euo pipefail
          cd /opt/recruiter-radar
          docker compose exec -T web node --input-type=module - <<'NODE'
          const http = await import('node:http')
          const SOURCE_REFRESH_CLIENT_TIMEOUT_MS = 15 * 60 * 1000
          const key = process.env.CRON_API_KEY?.trim()
          if (!key) throw new Error('CRON_API_KEY is not configured in the web runtime.')
          const payload = '{}'
          const response = await new Promise((resolve, reject) => {
            const request = http.request({
              hostname: '127.0.0.1',
              port: 3000,
              path: '/api/cron/source-refresh',
              method: 'POST',
              headers: {
                'x-api-key': key,
                'content-type': 'application/json',
                'content-length': Buffer.byteLength(payload),
              },
            }, (incoming) => {
              let rawBody = ''
              incoming.setEncoding('utf8')
              incoming.on('data', (chunk) => { rawBody += chunk })
              incoming.on('error', reject)
              incoming.on('end', () => {
                let body = {}
                try { body = JSON.parse(rawBody) } catch {}
                resolve({ status: incoming.statusCode ?? 0, body })
              })
            })
            request.setTimeout(SOURCE_REFRESH_CLIENT_TIMEOUT_MS, () => {
              request.destroy(new Error('source-refresh client timeout'))
            })
            request.on('error', reject)
            request.end(payload)
          })
          const body = response.body
          console.log(JSON.stringify({
            status: response.status,
            success: body?.success ?? false,
            total: body?.data?.total ?? 0,
            succeeded: body?.data?.succeeded ?? 0,
            failed: body?.data?.failed ?? 0,
            deferred: body?.data?.deferred ?? 0,
            credentialGated: body?.data?.credentialGated ?? 0,
            rateLimited: body?.data?.rateLimited ?? 0,
            failedSources: (body?.data?.details ?? [])
              .filter((result) => result?.success === false)
              .map((result) => ({ source: result?.source ?? 'unknown', outcome: result?.outcome ?? 'failed' })),
            rateLimitedSources: (body?.data?.details ?? [])
              .filter((result) => result?.outcome === 'rate-limited')
              .map((result) => result?.source ?? 'unknown'),
          }))
          if (response.status === 200) process.exit(0)
          if (response.status === 422) process.exit(0)
          throw new Error(`source-refresh returned HTTP ${response.status}`)
          NODE
          SSH_EOF
