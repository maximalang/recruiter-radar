name: Tests

on:
  push:
    branches: [ main, develop, 'codex/**' ]
  pull_request:
    branches: [ main, 'codex/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Guard router layout
        run: npm run guard:router
      - name: Type check application
        run: npm run web:check
      - name: Type check tests
        run: npm run test:types --workspace @recruiter-radar/web

  unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate deployment scripts
        run: |
          bash -n scripts/deploy/configure-notification-encryption.sh
          bash -n scripts/deploy/configure-caddy-real-ip.sh
          bash -n scripts/deploy/rollback-guard.sh
          bash -n scripts/deploy/recover-deployment.sh
          bash -n scripts/deploy/run-commercial-signal-production-canary.sh
          bash -n scripts/deploy/run-government-source-sync.sh
          bash -n scripts/deploy/verify-source-production-runtime.sh
          sh -n scripts/deploy/validate-metrika-id.sh
          bash -n scripts/test/configure-caddy-production.sh
          bash -n scripts/test/deploy-rollback-guard.sh
          bash -n scripts/test/configure-notification-encryption.sh
          bash -n scripts/test/commercial-signal-canary-host-runner.sh
          bash -n scripts/test/docker-entrypoint-reconciliation.sh
          bash -n scripts/test/landing-events-caddy-smoke.sh
          bash -n scripts/test/government-source-sync-runner.sh
          bash -n scripts/test/source-production-runtime-preflight.sh
          bash -n scripts/test/landing-events-caddy-smoke-contract.sh
      - name: Verify deployment rollback and runtime preflights
        run: |
          bash scripts/test/deploy-rollback-guard.sh
          bash scripts/test/configure-notification-encryption.sh
          bash scripts/test/commercial-signal-canary-host-runner.sh
          bash scripts/test/configure-caddy-production.sh
          bash scripts/test/docker-entrypoint-reconciliation.sh
          bash scripts/test/landing-events-caddy-smoke-contract.sh
          bash scripts/test/government-source-sync-runner.sh
          bash scripts/test/source-production-runtime-preflight.sh
          bash scripts/test/validate-metrika-id.sh
      - name: Validate database migrations
        run: DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/test node packages/db/scripts/migrate.mjs
      - name: Verify payment success telemetry transitions
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
        run: npm run test:payment-telemetry:db
      - name: Validate database contract
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
        run: npm run db:validate
      - name: Verify daily radar and delivery state migration lifecycle
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
          DAILY_RADAR_DB_TEST_ACK: isolated
        run: npm run test:daily-radar:db
      - name: Benchmark career-page set-based persistence
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
        run: npm run verify:career-pages:persistence-benchmark | tee /tmp/career-pages-persistence-benchmark.log
      - name: Verify Opportunity Engine and Outcome Ledger production runtime
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
        run: npm run test:opportunity-engine:db
      - name: Verify Opportunity Engine and Outcome Ledger down migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
        run: npm run test:opportunity-engine:down
      - name: Verify Company Events v1 PostgreSQL runtime
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
        run: npm run test:company-events-v1:db
      - name: Verify Company State v1 PostgreSQL runtime
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
        run: npm run test:company-state-v1:db
      - name: Verify Signal Episodes v2 PostgreSQL runtime
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
        run: npm run test:signal-episodes-v2:db
      - name: Verify Commercial Theses v1 PostgreSQL runtime
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
        run: npm run test:commercial-theses-v1:db
      - name: Verify External Agency Propensity v1 PostgreSQL runtime
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
        run: npm run test:external-agency-propensity-v1:db
      - name: Verify Agency DNA Match v2 PostgreSQL runtime
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
        run: npm run test:agency-dna-match-v2:db
      - name: Verify Opportunity Scoring v3 PostgreSQL runtime
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
        run: npm run test:opportunity-scoring-v3:db
      - name: Verify Query Planner v2 PostgreSQL runtime
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
        run: npm run test:query-planner-v2:db
      - name: Verify Commercial Signal Quality v2 PostgreSQL runtime
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
        run: npm run test:commercial-signal-quality-v2:db
      - name: Verify Commercial Signal Quality v2 descendant-first rollback
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
        run: npm run test:commercial-signal-quality-v2:down
      - name: Run Jest
        shell: bash
        run: |
          set +e
          npm test --workspace @recruiter-radar/web -- --runInBand > /tmp/jest-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Jest failed. Showing the final 200 log lines:"
            tail -n 200 /tmp/jest-output.log
            exit "$status"
          fi
          cat /tmp/jest-output.log
      - name: Evaluate FIUR quality fixture
        run: npm run --workspace @recruiter-radar/web quality:evaluate > /tmp/fiur-evaluation.json
      - name: Verify source readiness contracts
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
        run: |
          npm run verify:sources:readiness
          npm run verify:sources:coverage
          npm run verify:source:confidence
          npm run verify:smartrecruiters:confidence
      - name: Upload contract reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-reports
          path: |
            /tmp/jest-output.log
            /tmp/fiur-evaluation.json
            /tmp/career-pages-persistence-benchmark.log
          if-no-files-found: warn
          retention-days: 7

  production-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      AUTH_V2_DISPOSABLE_DB_CONFIRMED: 'true'
      ENTITLEMENT_DISPOSABLE_DB_CONFIRMED: 'true'
      WORKSPACE_BILLING_DISPOSABLE_DB_CONFIRMED: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify preinstalled system Chrome
        run: |
          test -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH"
          "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH" --version
      - name: Verify entitlement migration lifecycle
        run: npm run test:entitlements:migration:db
      - name: Run production acceptance scenarios
        run: npm run test:production:acceptance

  web-build:
    needs: lint-and-types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js application
        env:
          NEXT_PUBLIC_YANDEX_METRIKA_ID: '12345678'
        run: npm run web:build
      - name: Upload standalone build
        uses: actions/upload-artifact@v7
        with:
          name: web-build-output
          path: |
            apps/web/.next/standalone
            apps/web/.next/static
            apps/web/public
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  landing-playwright:
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      LANDING_BASE_URL: http://127.0.0.1:3000
      LANDING_REQUIRE_ANALYTICS_CONSENT: 'true'
      LANDING_E2E_ALLOW_DB_FIXTURES: 'true'
      LANDING_SCREENSHOT_DIR: /tmp/recruiter-radar-landing/screenshots
      LANDING_TRACE_DIR: /tmp/recruiter-radar-landing/traces
      RESPONSIVE_BASE_URL: http://127.0.0.1:3000
      RESPONSIVE_ARTIFACT_DIR: /tmp/recruiter-radar-responsive
      SESSION_SECRET: test-session-secret-at-least-32-chars-long
      LANDING_ANALYTICS_RATE_LIMIT_SALT: test-landing-rate-limit-salt-at-least-32-characters
      PUBLIC_APP_ORIGIN: https://recruiter-radar.ru
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply database migrations
        run: node packages/db/scripts/migrate.mjs
      - name: Download standalone build
        uses: actions/download-artifact@v8
        with:
          name: web-build-output
          path: apps/web
      - name: Prepare standalone static assets
        run: node apps/web/scripts/prepare-standalone.mjs
      - name: Verify preinstalled system Chrome
        run: |
          test -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH"
          "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH" --version
      - name: Start production server
        shell: bash
        env:
          PORT: '3000'
          HOSTNAME: 127.0.0.1
          MIGRATE_ON_START: 'false'
          CRON_API_KEY: test-cron-api-key-at-least-32-chars
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: |
          node apps/web/.next/standalone/apps/web/server.js > /tmp/landing-server.log 2>&1 &
          echo "$!" > /tmp/landing-server.pid
          for i in $(seq 1 75); do
            if curl -fsS -o /tmp/landing-ready.html http://127.0.0.1:3000/ \
              && grep -q 'data-deploy-anchor="recruiter-radar-landing-v3"' /tmp/landing-ready.html; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/landing-server.log
          exit 1
      - name: Landing production audit
        run: npm run test:landing:e2e
      - name: Responsive surface audit
        run: npm run test:responsive-surfaces
      - name: Landing review captures (PR evidence artifact)
        run: npm run test:landing:review-captures --workspace @recruiter-radar/web
        env:
          LANDING_REVIEW_SCREENSHOT_DIR: /tmp/recruiter-radar-landing/review
          LANDING_SCREENSHOT_DIR: /tmp/recruiter-radar-landing/screenshots
      - name: Stop production server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/landing-server.pid ]; then
            server_pid="$(cat /tmp/landing-server.pid)"
            kill "$server_pid" 2>/dev/null || true
            for _ in $(seq 1 20); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                exit 0
              fi
              sleep 0.25
            done
            kill -KILL "$server_pid" 2>/dev/null || true
          fi
      - name: Verify production server log
        if: always()
        run: node scripts/verify-production-server-log.mjs /tmp/landing-server.log
      - name: Upload Playwright screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: landing-playwright-artifacts
          path: |
            /tmp/recruiter-radar-landing
            /tmp/recruiter-radar-responsive
            playwright-report
            test-results
            /tmp/landing-server.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload landing review captures (visual gate evidence)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: landing-review-captures-${{ github.sha }}
          path: /tmp/recruiter-radar-landing/review
          if-no-files-found: warn
          retention-days: 30

  auth-v2-verification:
    name: Auth v2 / ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: unit
          - gate: postgresql
          - gate: migration-upgrade
          - gate: tenancy-isolation
          - gate: e2e
          - gate: accessibility
          - gate: security-smoke
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      AUTH_V2_DISPOSABLE_DB_CONFIRMED: 'true'
      SESSION_SECRET: auth-v2-ci-session-secret-at-least-32-characters
      AUTH_RATE_LIMIT_SECRET: auth-v2-ci-rate-limit-secret-at-least-32-characters
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Auth unit and type contracts
        if: matrix.gate == 'unit'
        run: |
          npm run test:types --workspace @recruiter-radar/web
          npm test --workspace @recruiter-radar/web -- --runInBand --testPathPattern=auth-v2
      - name: Auth PostgreSQL contracts
        if: matrix.gate == 'postgresql'
        run: |
          npm run test:auth-v2:core:db
          npm run test:auth-v2:account-team:db
          npm run test:auth-v2:passkeys:db
      - name: Auth migration upgrade and operational verification
        if: matrix.gate == 'migration-upgrade'
        env:
          AUTH_PLATFORM_V2_ENABLED: 'false'
          AUTH_WORKSPACES_V2_ENABLED: 'false'
          AUTH_ONBOARDING_V2_ENABLED: 'false'
          AUTH_PASSKEYS_ENABLED: 'false'
        run: |
          npm run db:migrate
          npm run auth-v2:verify-db
          npm run auth-v2:preflight
          npm run auth-v2:backfill
          npm run auth-v2:verify-backfill
      - name: Auth tenant isolation contracts
        if: matrix.gate == 'tenancy-isolation'
        run: npm run test:auth-v2:tenancy:db
      - name: Verify preinstalled system Chrome
        if: matrix.gate == 'e2e' || matrix.gate == 'accessibility'
        run: |
          test -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH"
          "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH" --version
      - name: Auth browser end-to-end contracts
        if: matrix.gate == 'e2e'
        run: |
          npm run test:auth-v2:account-team:e2e
          npm run test:auth-v2:passkeys:e2e
      - name: Auth accessibility and responsive contracts
        if: matrix.gate == 'accessibility'
        run: npm run test:auth-v2:account-team:e2e
      - name: Auth security smoke
        if: matrix.gate == 'security-smoke'
        env:
          AUTH_PLATFORM_V2_ENABLED: 'false'
          AUTH_WORKSPACES_V2_ENABLED: 'false'
          AUTH_ONBOARDING_V2_ENABLED: 'false'
          AUTH_PASSKEYS_ENABLED: 'false'
        run: |
          npm run db:migrate
          npm run auth-v2:verify-db
          npm run auth-v2:preflight
          npm run auth-v2:session-report
          npm test --workspace @recruiter-radar/web -- --runInBand --runTestsByPath src/__tests__/scripts/pre-deep-security-regression.test.ts src/__tests__/scripts/auth-v2-dal-migration.test.ts src/__tests__/scripts/auth-v2-rollout-operations.test.ts
          npm audit --omit=dev --audit-level=high
      - name: Upload Auth v2 browser evidence
        if: always() && (matrix.gate == 'e2e' || matrix.gate == 'accessibility')
        uses: actions/upload-artifact@v7
        with:
          name: auth-v2-${{ matrix.gate }}-evidence
          path: |
            apps/web/scripts/auth-v2-account-team-e2e-report.json
            apps/web/scripts/auth-v2-passkey-e2e-report.json
            apps/web/scripts/auth-v2-*.png
          if-no-files-found: error
          retention-days: 7

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker-build:
    needs: [unit-tests, web-build, production-acceptance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -f apps/web/Dockerfile -t ${{ github.repository }}:${{ github.sha }} .
      - name: Verify source runtime final image
        shell: bash
        run: |
          set -euo pipefail
          image='${{ github.repository }}:${{ github.sha }}'
          network="rr-source-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          database="rr-source-runtime-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$database" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$network" >/dev/null
          docker run -d --name "$database" --network "$network" \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=source_runtime \
            postgres:16-alpine >/dev/null
          database_ready=0
          for _ in $(seq 1 30); do
            if docker logs "$database" 2>&1 \
                | grep -F 'PostgreSQL init process complete; ready for start up.' >/dev/null \
              && docker exec "$database" pg_isready -U postgres -d source_runtime >/dev/null 2>&1; then
              database_ready=1
              break
            fi
            sleep 1
          done
          if [ "$database_ready" -ne 1 ]; then
            docker logs "$database"
            exit 1
          fi
          docker exec "$database" pg_isready -U postgres -d source_runtime
          docker run --rm --network "$network" "$image" \
            node packages/db/scripts/verify-source-runtime-image.mjs --filesystem --browser
          docker run --rm --network "$network" \
            -e DATABASE_URL=postgres://postgres:postgres@"$database":5432/source_runtime \
            "$image" node packages/db/scripts/migrate.mjs
          docker run --rm --network "$network" \
            -e DATABASE_URL=postgres://postgres:postgres@"$database":5432/source_runtime \
            "$image" node packages/db/scripts/verify-source-runtime-image.mjs --database
      - name: Caddy landing events smoke
        shell: bash
        env:
          SMOKE_IMAGE: ${{ github.repository }}:${{ github.sha }}
        run: bash scripts/test/landing-events-caddy-smoke.sh
