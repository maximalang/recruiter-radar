name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Validate deployment scripts
      run: bash -n scripts/deploy/configure-notification-encryption.sh

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Guard router layout
      run: npm run guard:router

    - name: Type check
      run: npm run web:check

    - name: Validate database migrations
      run: DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/test node packages/db/scripts/migrate.mjs

    - name: Validate database contract
      env:
        DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
      run: npm run db:validate

    - name: Run tests
      shell: bash
      run: |
        set +e
        npm run --workspace @recruiter-radar/web test > /tmp/jest-output.log 2>&1
        status=$?
        if [ "$status" -ne 0 ]; then
          echo "Jest failed. Showing the final 200 log lines:"
          tail -n 200 /tmp/jest-output.log
          exit "$status"
        fi
        cat /tmp/jest-output.log

    - name: Evaluate FIUR quality fixture
      run: npm run --workspace @recruiter-radar/web quality:evaluate > /tmp/fiur-evaluation.json

    - name: Verify source readiness contracts
      env:
        DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
      run: |
        npm run verify:sources:readiness
        npm run verify:sources:coverage
        npm run verify:source:confidence

    - name: Audit production dependencies
      run: npm audit --omit=dev --audit-level=high

    - name: Upload verification reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: contract-reports
        path: |
          /tmp/jest-output.log
          /tmp/fiur-evaluation.json
        if-no-files-found: warn
        retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Docker image
      run: docker build -f apps/web/Dockerfile -t ${{ github.repository }}:latest .

    - name: Run smoke tests
      run: |
        DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/test node packages/db/scripts/migrate.mjs

        docker run -d --name smoke-test --network host \
          -e DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/test \
          -e SESSION_SECRET=test-session-secret-at-least-32-chars-long \
          -e CRON_API_KEY=test-cron-api-key-at-least-32-chars \
          -e NEXT_PUBLIC_APP_URL=http://localhost:3000 \
          -e MIGRATE_ON_START=false \
          ${{ github.repository }}:latest

        for i in {1..30}; do
          if curl -f http://localhost:3000/api/health > /dev/null 2>&1; then
            echo "Health check passed"
            break
          fi
          if [ "$i" = "30" ]; then
            echo "Health check timed out"
            docker logs smoke-test
            exit 1
          fi
          sleep 2
        done

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Responsive and accessibility smoke
      env:
        RESPONSIVE_BASE_URL: http://localhost:3000
        RESPONSIVE_ARTIFACT_DIR: /tmp/recruiter-radar-responsive
      run: node scripts/verify-responsive-surfaces.mjs

    - name: Upload responsive screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: responsive-surface-audit
        path: /tmp/recruiter-radar-responsive
        if-no-files-found: error
        retention-days: 7

    - name: Cleanup smoke test
      if: always()
      run: |
        docker stop smoke-test || true
        docker rm smoke-test || true
