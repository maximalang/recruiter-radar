name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Validate deployment scripts
      run: bash -n scripts/deploy/configure-notification-encryption.sh

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Guard router layout
      run: npm run guard:router

    - name: Type check
      run: npm run web:check

    - name: Validate database migrations
      run: DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/test node packages/db/scripts/migrate.mjs

    - name: Run tests
      shell: bash
      run: |
        set +e
        npm run --workspace @recruiter-radar/web test > /tmp/jest-output.log 2>&1
        status=$?
        if [ "$status" -ne 0 ]; then
          echo "Jest failed. Showing the final 200 log lines:"
          tail -n 200 /tmp/jest-output.log
          exit "$status"
        fi
        cat /tmp/jest-output.log

    - name: Upload Jest failure log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: jest-failure-log
        path: /tmp/jest-output.log
        if-no-files-found: error
        retention-days: 3

  grant-monthly-access:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'ops/grant-monthly-access-6uunn9' &&
      github.actor == 'maximalang'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.RR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -p ${{ secrets.RR_SSH_PORT }} -t ed25519 ${{ secrets.RR_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

    - name: Grant 30-day monthly access
      run: |
        ssh -p ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
          ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }} << 'SSH_EOF'
        set -euo pipefail
        cd /opt/recruiter-radar
        docker compose exec -T db sh -lc 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
        DO $grant$
        DECLARE
          target_user_id BIGINT;
          granted_until TIMESTAMPTZ;
        BEGIN
          SELECT id
          INTO target_user_id
          FROM users
          WHERE md5(lower(btrim(email))) = '0b2af1a77193ab2cd8f9d54dcff566d0'
          LIMIT 1;

          IF target_user_id IS NULL THEN
            RAISE EXCEPTION 'Target account is not registered';
          END IF;

          UPDATE subscriptions
          SET status = 'expired',
              updated_at = NOW()
          WHERE user_id = target_user_id
            AND status IN ('trial', 'active', 'past_due');

          granted_until := NOW() + INTERVAL '30 days';

          INSERT INTO subscriptions (
            user_id,
            plan_code,
            status,
            started_at,
            current_period_end,
            cancel_at_period_end,
            billing_provider
          )
          VALUES (
            target_user_id,
            'monthly',
            'active',
            NOW(),
            granted_until,
            TRUE,
            'manual_owner_grant'
          );

          RAISE NOTICE 'Monthly access granted: user_id=%, current_period_end=%',
            target_user_id,
            granted_until;
        END
        $grant$;

        SELECT
          u.id AS user_id,
          s.plan_code,
          s.status,
          s.started_at,
          s.current_period_end,
          s.cancel_at_period_end
        FROM users u
        JOIN subscriptions s ON s.user_id = u.id
        WHERE md5(lower(btrim(u.email))) = '0b2af1a77193ab2cd8f9d54dcff566d0'
          AND s.status = 'active'
        ORDER BY s.created_at DESC
        LIMIT 1;
        SQL
        SSH_EOF

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Docker image
      run: docker build -f apps/web/Dockerfile -t ${{ github.repository }}:latest .

    - name: Run smoke tests
      run: |
        # Run migrations against CI Postgres first (outside Docker)
        DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/test node packages/db/scripts/migrate.mjs

        # Start app with host network so container can reach CI Postgres
        # MIGRATE_ON_START=false because migrations already ran above
        docker run -d --name smoke-test --network host \
          -e DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/test \
          -e SESSION_SECRET=test-session-secret-at-least-32-chars-long \
          -e NEXT_PUBLIC_APP_URL=http://localhost:3000 \
          -e MIGRATE_ON_START=false \
          ${{ github.repository }}:latest

        # Wait for health check
        for i in {1..30}; do
          if curl -f http://localhost:3000/api/health > /dev/null 2>&1; then
            echo "Health check passed"
            exit 0
          fi
          sleep 2
        done
        echo "Health check timed out"
        docker logs smoke-test
        exit 1

    - name: Cleanup smoke test
      if: always()
      run: |
        docker stop smoke-test || true
        docker rm smoke-test || true
