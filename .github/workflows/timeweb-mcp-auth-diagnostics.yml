name: Timeweb MCP Auth Diagnostics

on:
  push:
    branches:
      - fix/timeweb-mcp-refresh-persistence

permissions:
  contents: read

jobs:
  oauth-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.RR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.RR_SSH_PORT }}" -t ed25519 "${{ secrets.RR_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Read safe OAuth audit events
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.RR_SSH_PORT }}" -o LogLevel=ERROR \
            "${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}" \
            'docker logs --since 2h recruiter-radar-operator-auth-1 2>&1 | grep -E "\"component\":\"timeweb-mcp-auth\"" | grep -E "authorization_granted|refresh_compatibility_path|token_refresh|token_refresh_failed|refresh_token_rotated|grant_revoked|client_registered" || true'
