name: Timeweb MCP Bootstrap

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: timeweb-mcp-prod
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      RR_MCP_OWNER_PASSWORD_HASH: ${{ secrets.RR_MCP_OWNER_PASSWORD_HASH }}
      RR_TIMEWEB_MCP_TOKEN: ${{ secrets.RR_TIMEWEB_MCP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate exact deploy and bootstrap scripts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]
          bash -n scripts/deploy/configure-timeweb-mcp-auth.sh
          bash -n scripts/deploy/configure-timeweb-mcp-runtime.sh
          bash -n scripts/deploy/timeweb-mcp-runtime-dispatch.sh
          bash -n scripts/deploy/configure-timeweb-mcp-caddy.sh
          node --check operator-auth/src/entrypoint.js
          node --check operator-auth/src/timeweb-server.js

      - name: Validate required protected credentials
        run: |
          set -euo pipefail
          if [ -z "${RR_TIMEWEB_MCP_TOKEN:-}" ]; then
            echo "::error::Missing required GitHub Actions secret RR_TIMEWEB_MCP_TOKEN"
            exit 78
          fi
          if [ "${#RR_TIMEWEB_MCP_TOKEN}" -lt 16 ] || [ "${#RR_TIMEWEB_MCP_TOKEN}" -gt 4096 ]; then
            echo "::error::RR_TIMEWEB_MCP_TOKEN has an invalid length"
            exit 78
          fi
          if [ -z "${RR_MCP_OWNER_PASSWORD_HASH:-}" ]; then
            echo "::error::Missing required GitHub Actions secret RR_MCP_OWNER_PASSWORD_HASH"
            exit 78
          fi
          [[ "$RR_MCP_OWNER_PASSWORD_HASH" == \$argon2id\$* ]] || {
            echo "::error::RR_MCP_OWNER_PASSWORD_HASH must be an Argon2id encoded hash"
            exit 78
          }
          [ "${#RR_MCP_OWNER_PASSWORD_HASH}" -le 512 ]

          umask 077
          printf '%s' "$RR_TIMEWEB_MCP_TOKEN" > /tmp/rr-timeweb-mcp-token
          printf '%s' "$RR_MCP_OWNER_PASSWORD_HASH" > /tmp/rr-timeweb-owner-password-hash
          chmod 600 /tmp/rr-timeweb-mcp-token /tmp/rr-timeweb-owner-password-hash
          unset RR_TIMEWEB_MCP_TOKEN RR_MCP_OWNER_PASSWORD_HASH

      - name: Build exact-SHA OAuth image
        run: |
          set -euo pipefail
          docker build -f operator-auth/Dockerfile -t "recruiter-radar-operator-auth:${DEPLOY_SHA}" .
          docker save "recruiter-radar-operator-auth:${DEPLOY_SHA}" | gzip -1 > /tmp/rr-timeweb-auth-image.tar.gz

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.RR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.RR_SSH_PORT }}" -t ed25519 "${{ secrets.RR_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload exact-SHA bootstrap material
        run: |
          set -euo pipefail
          remote="${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}"
          port="${{ secrets.RR_SSH_PORT }}"
          ssh -p "$port" -o LogLevel=ERROR "$remote" "install -d -m 0700 /opt/recruiter-radar/.timeweb-bootstrap-${DEPLOY_SHA}"
          stage="/opt/recruiter-radar/.timeweb-bootstrap-${DEPLOY_SHA}"
          scp -P "$port" -o LogLevel=ERROR \
            scripts/deploy/configure-timeweb-mcp-auth.sh \
            "$remote:$stage/configure-auth.sh"
          scp -P "$port" -o LogLevel=ERROR \
            scripts/deploy/configure-timeweb-mcp-runtime.sh \
            "$remote:$stage/configure-runtime.sh"
          scp -P "$port" -o LogLevel=ERROR \
            scripts/deploy/timeweb-mcp-runtime-dispatch.sh \
            "$remote:$stage/runtime-dispatch.sh"
          scp -P "$port" -o LogLevel=ERROR \
            scripts/deploy/configure-timeweb-mcp-caddy.sh \
            "$remote:$stage/configure-caddy.sh"
          scp -P "$port" -o LogLevel=ERROR \
            /tmp/rr-timeweb-mcp-token \
            "$remote:$stage/timeweb-token"
          scp -P "$port" -o LogLevel=ERROR \
            /tmp/rr-timeweb-owner-password-hash \
            "$remote:$stage/owner-password-hash"
          scp -P "$port" -o LogLevel=ERROR \
            /tmp/rr-timeweb-auth-image.tar.gz \
            "$remote:$stage/auth-image.tar.gz"

      - name: Configure fail-closed Timeweb MCP production boundary
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.RR_SSH_PORT }}" -o LogLevel=ERROR \
            "${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}" \
            "EXPECTED_DEPLOY_SHA='${DEPLOY_SHA}' RUNTIME_USER='${{ secrets.RR_SSH_USER }}' RUNTIME_PORT='${{ secrets.RR_SSH_PORT }}' bash -s" <<'SSH_EOF'
          set -Eeuo pipefail
          cd /opt/recruiter-radar
          stage="/opt/recruiter-radar/.timeweb-bootstrap-${EXPECTED_DEPLOY_SHA}"
          lock=/tmp/recruiter-radar-timeweb-mcp.lock
          cleanup() { rm -rf "$stage"; }
          trap cleanup EXIT
          exec 9>"$lock"
          flock -w 180 9

          test -d "$stage"
          chmod 700 "$stage"
          chmod 700 "$stage/configure-auth.sh" "$stage/configure-runtime.sh" "$stage/runtime-dispatch.sh" "$stage/configure-caddy.sh"
          chmod 600 "$stage/timeweb-token" "$stage/owner-password-hash" "$stage/auth-image.tar.gz"

          install -d -m 0700 /var/lib/recruiter-radar-timeweb
          install -m 0600 "$stage/timeweb-token" /var/lib/recruiter-radar-timeweb/token

          gzip -dc "$stage/auth-image.tar.gz" | docker load >/dev/null
          docker image inspect "recruiter-radar-operator-auth:${EXPECTED_DEPLOY_SHA}" >/dev/null

          install -m 0700 "$stage/configure-auth.sh" /opt/recruiter-radar/configure-timeweb-mcp-auth.sh
          install -m 0700 "$stage/configure-runtime.sh" /opt/recruiter-radar/configure-timeweb-mcp-runtime.sh
          install -m 0700 "$stage/runtime-dispatch.sh" /opt/recruiter-radar/timeweb-mcp-runtime-dispatch.sh
          install -m 0700 "$stage/configure-caddy.sh" /opt/recruiter-radar/configure-timeweb-mcp-caddy.sh

          # Close the legacy public path before changing the local services.
          /opt/recruiter-radar/configure-timeweb-mcp-caddy.sh

          RR_DEPLOY_SHA="$EXPECTED_DEPLOY_SHA" \
          RR_OPERATOR_AUTH_IMAGE="recruiter-radar-operator-auth:${EXPECTED_DEPLOY_SHA}" \
          RR_MCP_OWNER_PASSWORD_HASH_FILE="$stage/owner-password-hash" \
            /opt/recruiter-radar/configure-timeweb-mcp-auth.sh --preflight
          RR_DEPLOY_SHA="$EXPECTED_DEPLOY_SHA" \
          RR_OPERATOR_AUTH_IMAGE="recruiter-radar-operator-auth:${EXPECTED_DEPLOY_SHA}" \
          RR_MCP_OWNER_PASSWORD_HASH_FILE="$stage/owner-password-hash" \
            /opt/recruiter-radar/configure-timeweb-mcp-auth.sh

          RR_TIMEWEB_RUNTIME_SSH_USER="$RUNTIME_USER" \
          RR_TIMEWEB_RUNTIME_SSH_PORT="$RUNTIME_PORT" \
          RR_TIMEWEB_MCP_TOKEN_FILE=/var/lib/recruiter-radar-timeweb/token \
            /opt/recruiter-radar/configure-timeweb-mcp-runtime.sh --preflight
          RR_TIMEWEB_RUNTIME_SSH_USER="$RUNTIME_USER" \
          RR_TIMEWEB_RUNTIME_SSH_PORT="$RUNTIME_PORT" \
          RR_TIMEWEB_MCP_TOKEN_FILE=/var/lib/recruiter-radar-timeweb/token \
            /opt/recruiter-radar/configure-timeweb-mcp-runtime.sh

          # Revalidate ingress after all local services are in their final state.
          /opt/recruiter-radar/configure-timeweb-mcp-caddy.sh

          test "$(stat -c '%a' /var/lib/recruiter-radar-timeweb/token)" = 600
          test "$(stat -c '%a' /var/lib/recruiter-radar-timeweb/runtime/id_ed25519)" = 600
          if docker ps --format '{{.Names}}' | grep -Fxq recruiter-radar-operator-1; then
            echo "Legacy operator container is still running" >&2
            exit 1
          fi
          if systemctl is-active --quiet rr-operator-agent.service 2>/dev/null; then
            echo "Legacy operator host agent is still active" >&2
            exit 1
          fi
          curl -fsS http://127.0.0.1:3002/healthz >/dev/null
          curl -fsS http://127.0.0.1:3000/api/health >/dev/null

          runtime_ssh() {
            docker exec recruiter-radar-web-1 /usr/bin/ssh -T -p "$RUNTIME_PORT" \
              -i /run/rr-timeweb-runtime/id_ed25519 \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=/run/rr-timeweb-runtime/known_hosts -o ConnectTimeout=5 \
              "$RUNTIME_USER@rr-timeweb-host" "$1"
          }

          echo '=== TIMEWEB_STAGE1_SYSTEM_INFO ==='
          runtime_ssh system_info
          echo '=== TIMEWEB_STAGE1_DISK_USAGE ==='
          runtime_ssh disk_usage
          echo '=== TIMEWEB_STAGE1_MEMORY_USAGE ==='
          runtime_ssh memory_usage
          echo '=== TIMEWEB_STAGE1_DOCKER_HEALTH ==='
          runtime_ssh docker_health
          echo '=== TIMEWEB_STAGE1_DOCKER_COMPOSE ==='
          runtime_ssh docker_compose_ps
          echo '=== TIMEWEB_STAGE1_DEPLOYMENT_INFO ==='
          runtime_ssh deployment_info
          echo '=== TIMEWEB_STAGE1_GIT_REVISION ==='
          runtime_ssh git_rev_parse
          runtime_ssh docker_logs:web >/dev/null

          if runtime_ssh bash >/dev/null 2>&1; then
            echo "Restricted runtime SSH accepted arbitrary shell execution" >&2
            exit 1
          fi
          if runtime_ssh 'docker_ps;rm' >/dev/null 2>&1; then
            echo "Restricted runtime SSH accepted compound command execution" >&2
            exit 1
          fi
          echo '=== TIMEWEB_STAGE1_RUNTIME_SECURITY_OK ==='
          SSH_EOF

      - name: Verify public OAuth and MCP discovery boundary
        run: |
          set -euo pipefail

          old_code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            https://recruiter-radar.ru/api/internal/mcp \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')"
          old_metadata_code="$(curl -sS -o /dev/null -w '%{http_code}' \
            https://recruiter-radar.ru/.well-known/oauth-protected-resource/api/internal/mcp)"
          test "$old_code" = 404
          test "$old_metadata_code" = 404

          curl -fsS \
            https://recruiter-radar.ru/.well-known/oauth-protected-resource/api/internal/timeweb-mcp \
            > /tmp/timeweb-metadata.json
          node -e '
            const v=require("/tmp/timeweb-metadata.json");
            if(v.resource!=="https://recruiter-radar.ru/api/internal/timeweb-mcp")process.exit(1);
            if(JSON.stringify(v.authorization_servers)!==JSON.stringify(["https://recruiter-radar.ru/operator/oauth"]))process.exit(1);
            if(JSON.stringify(v.scopes_supported)!==JSON.stringify(["rr.timeweb.manage"]))process.exit(1);
          '

          curl -fsS \
            https://recruiter-radar.ru/operator/oauth/.well-known/openid-configuration \
            > /tmp/timeweb-oidc.json
          node -e '
            const v=require("/tmp/timeweb-oidc.json");
            const i="https://recruiter-radar.ru/operator/oauth";
            if(v.issuer!==i||v.authorization_endpoint!==i+"/auth"||v.token_endpoint!==i+"/token"||v.jwks_uri!==i+"/jwks"||v.registration_endpoint!==i+"/reg")process.exit(1);
            if(JSON.stringify(v.code_challenge_methods_supported)!==JSON.stringify(["S256"]))process.exit(1);
            if(!v.scopes_supported?.includes("rr.timeweb.manage")||!v.scopes_supported?.includes("offline_access"))process.exit(1);
            if(!v.grant_types_supported?.includes("authorization_code")||!v.grant_types_supported?.includes("refresh_token"))process.exit(1);
          '

          curl -fsS https://recruiter-radar.ru/operator/oauth/jwks > /tmp/timeweb-jwks.json
          node -e 'const v=require("/tmp/timeweb-jwks.json");if(!v.keys?.length||v.keys.some(k=>k.d))process.exit(1)'

          dcr_code="$(curl -sS -o /tmp/timeweb-dcr.json -w '%{http_code}' \
            -X POST https://recruiter-radar.ru/operator/oauth/reg \
            -H 'content-type: application/json' \
            --data '{"client_name":"RR production MCP smoke","redirect_uris":["https://chatgpt.com/connector_platform_oauth_redirect"],"token_endpoint_auth_method":"none","response_types":["code"],"grant_types":["authorization_code","refresh_token"]}')"
          test "$dcr_code" = 201
          node -e 'const v=require("/tmp/timeweb-dcr.json");if(!v.client_id||v.client_secret!==undefined||v.token_endpoint_auth_method!=="none")process.exit(1)'

          unauth_code="$(curl -sS -D /tmp/timeweb-headers.txt -o /tmp/timeweb-unauth.json -w '%{http_code}' \
            -X POST https://recruiter-radar.ru/api/internal/timeweb-mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')"
          test "$unauth_code" = 401
          grep -Fiq 'resource_metadata="https://recruiter-radar.ru/.well-known/oauth-protected-resource/api/internal/timeweb-mcp"' /tmp/timeweb-headers.txt
          echo 'STAGE 1 VERIFICATION COMPLETE'

      - name: Cleanup runner secret material
        if: always()
        run: |
          rm -f /tmp/rr-timeweb-mcp-token /tmp/rr-timeweb-owner-password-hash /tmp/rr-timeweb-auth-image.tar.gz
          rm -f /tmp/timeweb-*.json /tmp/timeweb-headers.txt
