name: V1-V6 PASS 10 source audit

on:
  push:
    branches:
      - chatgpt/full-v1-v6-implementation

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build exact-head source snapshot
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            -czf /tmp/recruiter-radar-pass10-source.tgz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: v1-v6-pass10-source
          path: /tmp/recruiter-radar-pass10-source.tgz
          retention-days: 1

      - name: Remove temporary audit workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/v1-v6-pass10-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore(ci): remove temporary PASS 10 audit workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
