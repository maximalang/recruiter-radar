name: Visual hover closure finalizer

on:
  push:
    branches:
      - chatgpt/full-v1-v6-implementation
    paths:
      - .github/visual-hover-closure-finalize.trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/full-v1-v6-implementation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capability-gate remaining hover selectors
        run: node scripts/ci/close-hover-gates.mjs

      - name: Treat hover-none media as capability-gated
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/ci/no-hardcoded-visual-values.mjs')
          s = p.read_text()
          old = r"const hoverCapabilityMedia = /\(\s*hover\s*:\s*hover\s*\)/i;"
          new = r"const hoverCapabilityMedia = /\(\s*hover\s*:\s*(?:hover|none)\s*\)/i;"
          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('Unexpected hoverCapabilityMedia contract')

      - name: Verify visual contract
        run: node scripts/ci/no-hardcoded-visual-values.mjs

      - name: Remove one-shot closure tooling
        shell: bash
        run: |
          rm -f \
            .github/visual-hover-closure.trigger \
            .github/visual-hover-closure-finalize.trigger \
            .github/workflows/visual-hover-closure.yml \
            .github/workflows/visual-hover-closure-finalize.yml \
            scripts/ci/close-hover-gates.mjs

      - name: Verify final diff
        run: git diff --check

      - name: Commit final visual closure
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Visual closure already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): finalize capability-gated visual interactions"
          git pull --rebase origin chatgpt/full-v1-v6-implementation
          git push origin HEAD:chatgpt/full-v1-v6-implementation
