name: Visual hover closure

on:
  push:
    branches:
      - chatgpt/full-v1-v6-implementation
    paths:
      - .github/visual-hover-closure.trigger

permissions:
  contents: write

jobs:
  close-hover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/full-v1-v6-implementation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capability-gate remaining hover selectors
        run: node scripts/ci/close-hover-gates.mjs

      - name: Verify visual contract
        run: node scripts/ci/no-hardcoded-visual-values.mjs

      - name: Verify diff
        run: git diff --check

      - name: Commit closure changes
        shell: bash
        run: |
          if git diff --quiet -- apps/web/app; then
            echo "No hover closure changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app
          git commit -m "fix(ui): capability-gate remaining hover states"
          git push origin HEAD:chatgpt/full-v1-v6-implementation
