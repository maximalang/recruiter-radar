name: Visual landing migration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.head_ref == 'chatgpt/full-v1-v6-implementation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Normalize landing semantic aliases
        run: node scripts/ci/migrate-landing-semantic-aliases.mjs
      - name: Commit migration to PR head
        run: |
          if git diff --quiet; then
            echo 'Landing semantic aliases already migrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app/landing
          git commit -m 'chore(landing): apply semantic alias cleanup'
          git push origin HEAD:${{ github.head_ref }}
