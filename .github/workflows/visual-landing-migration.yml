name: Visual landing migration

on:
  push:
    branches: ['chatgpt/full-v1-v6-implementation']

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'chore(landing): apply semantic alias cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Normalize landing semantic aliases
        run: node scripts/ci/migrate-landing-semantic-aliases.mjs
      - name: Commit migration to branch
        run: |
          if git diff --quiet; then
            echo 'Landing semantic aliases already migrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app/landing
          git commit -m 'chore(landing): apply semantic alias cleanup'
          git push origin HEAD:${GITHUB_REF_NAME}
