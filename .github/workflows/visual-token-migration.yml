name: Visual token migration

on:
  push:
    branches: ['chatgpt/full-v1-v6-implementation']

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'chore(visual): apply semantic token migration') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Migrate visual token namespaces
        run: node scripts/ci/migrate-visual-token-namespaces.mjs
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo 'No visual token migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app apps/web/src/__tests__ scripts/ci
          git commit -m 'chore(visual): apply semantic token migration'
          git push origin HEAD:${GITHUB_REF_NAME}
