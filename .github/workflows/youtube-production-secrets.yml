name: YouTube Production Secret Sync

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-production-secret-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate YouTube runtime configurator
        run: bash -n scripts/deploy/configure-youtube-runtime.sh

      - name: Detect optional YouTube secret
        id: secret
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "${YOUTUBE_API_KEY:-}" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'YouTube production secret is configured.'
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'YouTube production secret is not configured; source remains credential-gated.'
          fi

      - name: Setup SSH
        if: steps.secret.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.RR_SSH_PORT }} -t ed25519 ${{ secrets.RR_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Stage YouTube API key and configurator
        if: steps.secret.outputs.configured == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file="/tmp/youtube-key-${DEPLOY_SHA}.b64"
          printf '%s' "$YOUTUBE_API_KEY" | base64 -w0 > "$key_file"
          unset YOUTUBE_API_KEY

          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            "$key_file" \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}:/opt/recruiter-radar/.youtube-key-${DEPLOY_SHA}.b64
          rm -f "$key_file"

          scp -P ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            scripts/deploy/configure-youtube-runtime.sh \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }}:/opt/recruiter-radar/configure-youtube-runtime.${DEPLOY_SHA}.sh

      - name: Configure and live-verify YouTube production runtime
        if: steps.secret.outputs.configured == 'true'
        run: |
          ssh -p ${{ secrets.RR_SSH_PORT }} -o LogLevel=ERROR \
            ${{ secrets.RR_SSH_USER }}@${{ secrets.RR_SSH_HOST }} \
            "DEPLOY_SHA='${DEPLOY_SHA}' bash -s" <<'SSH_EOF'
          set -euo pipefail
          staged_configurator="/opt/recruiter-radar/configure-youtube-runtime.${DEPLOY_SHA}.sh"
          staged_key="/opt/recruiter-radar/.youtube-key-${DEPLOY_SHA}.b64"

          cleanup() { rm -f "$staged_configurator" "$staged_key"; }
          trap cleanup EXIT

          test -f "$staged_configurator" || { echo 'Staged YouTube configurator is missing.' >&2; exit 1; }
          test -f "$staged_key" || { echo 'Staged YouTube API key is missing.' >&2; exit 1; }
          chmod 700 "$staged_configurator"
          "$staged_configurator" --key-file "$staged_key"
          install -m 700 "$staged_configurator" /opt/recruiter-radar/scripts/deploy/configure-youtube-runtime.sh
          SSH_EOF
