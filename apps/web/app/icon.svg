<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Recruiter Radar brand mark — an instrument-grade radar scope. A deep
       slate→blue gradient disc, three concentric range rings, four short
       cardinal crosshair ticks (N/E/S/W), and a directional sweep whose beam
       points down-right with a radial-gradient trail (bright leading edge,
       dissolving toward the trail). Three detected-contact blips sit on the
       dial at idle opacity. Static (the favicon carries the mark; the animated
       sweep + contact flashes live on the site). Mirrors the RadarLogo React
       component (app/ui/icons.tsx) so the tab and the site share one identity.
       Reads at 16px. -->
  <defs>
    <linearGradient id="rr-disc" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <!-- Sweep trail — radial fade from a bright core to a transparent edge -->
    <radialGradient id="rr-sweep-trail-fav" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#bfdbfe" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#bfdbfe" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="12" cy="12" r="12" fill="url(#rr-disc)"/>
  <!-- Range rings — outer + mid + inner, brightness steps inward -->
  <g stroke="#bfdbfe" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="12" cy="12" r="9.4" stroke-width="1.2" opacity="0.4"/>
    <circle cx="12" cy="12" r="6.1" stroke-width="1.3" opacity="0.6"/>
    <circle cx="12" cy="12" r="3"   stroke-width="1.3" opacity="0.85"/>
    <!-- Cardinal crosshair ticks at N/E/S/W — short, only across the outer ring -->
    <line x1="12" y1="0.9" x2="12" y2="2.4" stroke-width="1.2" opacity="0.55"/>
    <line x1="12" y1="21.6" x2="12" y2="23.1" stroke-width="1.2" opacity="0.55"/>
    <line x1="0.9" y1="12" x2="2.4" y2="12" stroke-width="1.2" opacity="0.55"/>
    <line x1="21.6" y1="12" x2="23.1" y2="12" stroke-width="1.2" opacity="0.55"/>
  </g>
  <!-- Detected contacts — three blips at idle opacity (bearings 200/60/315 deg) -->
  <g fill="#bfdbfe" stroke="none">
    <circle cx="10.08" cy="17.26" r="1.1" opacity="0.55"/>
    <circle cx="18.41" cy="8.30" r="1.1" opacity="0.55"/>
    <circle cx="7.05" cy="7.05" r="1.0" opacity="0.5"/>
  </g>
  <!-- Sweep sector — radial fade (bright leading edge, dissolving trail),
       pointing down-right, static -->
  <path d="M12 12 L7.55 20.7 A9.4 9.4 0 0 0 16.45 20.7 Z" fill="url(#rr-sweep-trail-fav)"/>
  <!-- Bright leading beam edge pointing down-right -->
  <line x1="12" y1="12" x2="16.45" y2="20.7" stroke="#dbeafe" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
  <!-- Center origin node -->
  <circle cx="12" cy="12" r="1" fill="#eff6ff"/>
</svg>
