<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Recruiter Radar brand mark — an instrument-grade radar scope. A deep
       slate→blue gradient disc, three concentric range rings, four cardinal
       crosshair ticks (N/E/S/W), and a directional sweep whose beam points
       down-right with a fading gradient trail. Static (the favicon carries the
       mark; the animated sweep + contact blips live on the site). Mirrors the
       RadarLogo React component (app/ui/icons.tsx) so the tab and the site
       share one identity. Reads at 16px. -->
  <defs>
    <linearGradient id="rr-disc" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <circle cx="12" cy="12" r="12" fill="url(#rr-disc)"/>
  <!-- Range rings — outer + mid + inner, brightness steps inward -->
  <g stroke="#bfdbfe" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="12" cy="12" r="9.4" stroke-width="1.2" opacity="0.4"/>
    <circle cx="12" cy="12" r="6.1" stroke-width="1.3" opacity="0.6"/>
    <circle cx="12" cy="12" r="3"   stroke-width="1.3" opacity="0.85"/>
    <!-- Cardinal crosshair ticks at N/E/S/W -->
    <line x1="12" y1="1.7" x2="12" y2="3.3" stroke-width="1.2" opacity="0.6"/>
    <line x1="12" y1="20.7" x2="12" y2="22.3" stroke-width="1.2" opacity="0.6"/>
    <line x1="1.7" y1="12" x2="3.3" y2="12" stroke-width="1.2" opacity="0.6"/>
    <line x1="20.7" y1="12" x2="22.3" y2="12" stroke-width="1.2" opacity="0.6"/>
  </g>
  <!-- Sweep sector — a radial fade (bright leading edge, translucent trail),
       pointing down-right, static -->
  <path d="M12 12 L7.55 20.7 A9.4 9.4 0 0 0 16.45 20.7 Z" fill="#bfdbfe" opacity="0.28"/>
  <!-- Bright leading beam edge pointing down-right -->
  <line x1="12" y1="12" x2="16.45" y2="20.7" stroke="#dbeafe" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
  <!-- Center origin node -->
  <circle cx="12" cy="12" r="1" fill="#eff6ff"/>
</svg>
