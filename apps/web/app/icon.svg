<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Recruiter Radar brand mark — a precise, instrument-grade radar: three
       range rings, a cardinal crosshair, and a directional sweep whose beam
       points downward (the radar "looking down" at the market). The sweep
       sector fades from a bright leading edge to a translucent trail. Mirrors
       the RadarLogo React component (app/ui/icons.tsx) and the hero radar
       canvas so the tab/favicon carries one brand identity. Sits on a light
       slate→blue gradient disc so it reads as a bright circular radar at every
       size, including the browser tab favicon. -->
  <defs>
    <linearGradient id="rr-disc" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <circle cx="12" cy="12" r="12" fill="url(#rr-disc)"/>
  <!-- Range rings -->
  <g stroke="#bfdbfe" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9.4" opacity="0.3"/>
    <circle cx="12" cy="12" r="6.1" opacity="0.5"/>
    <circle cx="12" cy="12" r="3" opacity="0.8"/>
    <!-- Cardinal crosshair ticks -->
    <line x1="12" y1="1.7" x2="12" y2="3.3" opacity="0.55"/>
    <line x1="12" y1="20.7" x2="12" y2="22.3" opacity="0.55"/>
    <line x1="1.7" y1="12" x2="3.3" y2="12" opacity="0.55"/>
    <line x1="20.7" y1="12" x2="22.3" y2="12" opacity="0.55"/>
  </g>
  <!-- Downward sweep sector (static — favicon carries the mark, motion lives on the site) -->
  <path d="M12 12 L7.55 20.7 A9.4 9.4 0 0 0 16.45 20.7 Z" fill="#bfdbfe" opacity="0.22"/>
  <!-- Bright leading beam edge pointing down-right -->
  <line x1="12" y1="12" x2="16.45" y2="20.7" stroke="#dbeafe" stroke-width="1.5" stroke-linecap="round" opacity="0.95"/>
  <!-- Center origin node -->
  <circle cx="12" cy="12" r="1" fill="#eff6ff"/>
</svg>
