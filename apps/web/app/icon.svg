  <g stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9.2" opacity="0.45"/>
    <circle cx="12" cy="12" r="6" opacity="0.7"/>
    <circle cx="12" cy="12" r="2.9"/>
