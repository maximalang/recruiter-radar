<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Recruiter Radar brand mark — concentric range rings + a sweep sector with
       a bright leading edge + a detected-contact blip + the origin node. Mirrors
       the RadarLogo React component (app/ui/icons.tsx) and the hero radar canvas
       so the tab/favicon carries one brand identity. Sits on a round, light
       slate-blue gradient disc (not a dark square) so it reads as a bright
       circular radar at every size, including the browser tab favicon. -->
  <defs>
    <linearGradient id="rr-disc" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <circle cx="12" cy="12" r="12" fill="url(#rr-disc)"/>
  <g stroke="#bfdbfe" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9.2" opacity="0.4"/>
    <circle cx="12" cy="12" r="6" opacity="0.6"/>
    <circle cx="12" cy="12" r="2.9" opacity="0.85"/>
  </g>
  <path d="M12 12 L21.2 12 A9.2 9.2 0 0 0 14.4 3.1 Z" fill="#bfdbfe" opacity="0.22"/>
  <line x1="12" y1="12" x2="21.2" y2="12" stroke="#dbeafe" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <circle cx="17.4" cy="9.2" r="0.9" fill="#eff6ff"/>
  <circle cx="12" cy="12" r="1.25" fill="#eff6ff"/>
</svg>
