<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Recruiter Radar brand mark — an instrument-grade radar scope. A deep
       slate→blue gradient disc, three concentric range rings, four short
       cardinal crosshair ticks (N/E/S/W), and a directional sweep: a thin
       bright BEAM (leading edge, pointing down-right) with a NARROW ~45°
       fading TRAIL behind it (three stacked sectors, brightest at the beam,
       dissolving counterclockwise) — the way a real radar scope reads, not a
       wide solid wedge. Three detected-contact blips sit on the dial at idle
       opacity. Static (the favicon carries the mark; the animated sweep +
       contact flashes live on the site). Mirrors the RadarLogo React component
       (app/ui/icons.tsx) so the tab and the site share one identity. 16px. -->
  <defs>
    <linearGradient id="rr-disc" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <circle cx="12" cy="12" r="12" fill="url(#rr-disc)"/>
  <!-- Range rings — outer + mid + inner, brightness steps inward -->
  <g stroke="#bfdbfe" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="12" cy="12" r="9.4" stroke-width="1.2" opacity="0.4"/>
    <circle cx="12" cy="12" r="6.1" stroke-width="1.3" opacity="0.6"/>
    <circle cx="12" cy="12" r="3"   stroke-width="1.3" opacity="0.85"/>
    <!-- Cardinal crosshair ticks at N/E/S/W — short, only across the outer ring -->
    <line x1="12" y1="0.9" x2="12" y2="2.4" stroke-width="1.2" opacity="0.55"/>
    <line x1="12" y1="21.6" x2="12" y2="23.1" stroke-width="1.2" opacity="0.55"/>
    <line x1="0.9" y1="12" x2="2.4" y2="12" stroke-width="1.2" opacity="0.55"/>
    <line x1="21.6" y1="12" x2="23.1" y2="12" stroke-width="1.2" opacity="0.55"/>
  </g>
  <!-- Detected contacts — three blips at idle opacity (bearings 200/60/315 deg) -->
  <g fill="#bfdbfe" stroke="none">
    <circle cx="10.08" cy="17.26" r="1.1" opacity="0.55"/>
    <circle cx="18.41" cy="8.30" r="1.1" opacity="0.55"/>
    <circle cx="7.05" cy="7.05" r="1.0" opacity="0.5"/>
  </g>
  <!-- Sweep trail — three stacked 15° sectors, brightest at the beam edge
       (153°) and dissolving counterclockwise toward 108° (the afterglow BEHIND
       a clockwise beam). Arc sweep flag 0 = counterclockwise = behind. -->
  <g fill="#bfdbfe" stroke="none">
    <path d="M12 12 L16.27 20.38 A9.4 9.4 0 0 0 18.29 18.99 Z" opacity="0.36"/>
    <path d="M12 12 L18.29 18.99 A9.4 9.4 0 0 0 19.88 17.12 Z" opacity="0.2"/>
    <path d="M12 12 L19.88 17.12 A9.4 9.4 0 0 0 20.94 14.90 Z" opacity="0.09"/>
  </g>
  <!-- Bright leading beam edge pointing down-right (bearing ~153 deg) -->
  <line x1="12" y1="12" x2="16.27" y2="20.38" stroke="#dbeafe" stroke-width="1.5" stroke-linecap="round" opacity="1"/>
  <!-- Center origin node -->
  <circle cx="12" cy="12" r="1" fill="#eff6ff"/>
</svg>
