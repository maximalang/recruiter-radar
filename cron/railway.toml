# Legacy Railway daily-radar compatibility image.
#
# IMPORTANT: this repository no longer authorizes Railway as a production
# scheduler. GitHub Actions is the only production clock authority. This file
# intentionally has NO `cronSchedule`; an existing Railway cron service must be
# disabled/deleted by an operator after the GitHub workflows land on `main`.
#
# The image is retained only for explicit/manual compatibility invocations while
# migration is completed. Do not add a schedule here.
[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  # Manual/deprecated compatibility tooling only. There is no automatic clock.
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3
