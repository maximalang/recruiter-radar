# Railway config for the daily-radar cron trigger (separate from web + n8n).
# This service's Root Directory MUST be set to cron/ in the Railway Dashboard,
# so Railway auto-discovers this railway.toml and resolves paths relative to it.
#
# NOTE: with Root Directory = cron/, the build context and dockerfilePath are
# relative to cron/ (NOT the repo root) — so dockerfilePath is just "Dockerfile".
[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  # cronSchedule turns this into a scheduled one-off: Railway starts the
  # container on this cron, runs CMD to completion, then stops it. The schedule
  # is in UTC. 03:00 UTC = 06:00 MSK (Europe/Moscow, UTC+3) — the daily window.
  cronSchedule = "0 3 * * *"

  # No long-running process to health-check; just retry a failed run.
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3
